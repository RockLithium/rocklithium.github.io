<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=850, user-scalable=yes">
    <title>GPU Throughput Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.3px;
        }
        
        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        #homeButton:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.04);
        }
        
        #homeButton:active {
            transform: scale(0.96);
            transition: transform 0.05s;
        }
        
        .gradient-text {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        
        .container {
            max-width: 800px;
            width: 90%;
            height: 80vh;
            padding: 10px 25px 25px 25px;
            margin-top: 70px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 20px;
        }
        
        button {
            padding: 10px 40px;
            width: 250px;
            font-size: 24px;
            cursor: pointer;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            transition: all 0.3s;
            font-weight: bold;
            text-shadow: none;
            box-shadow: none;
            flex-shrink: 0;
            margin-bottom: 20px;
            align-self: center;
        }
        
        button:hover:not(:disabled) {
            background: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(33, 150, 243, 0.4);
        }
        
        button:disabled {
            background: #424242;
            color: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        #log {
            text-align: left;
            background: #000000;
            width: 700px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            font-family: 'Ubuntu';
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            align-self: center;
            margin-bottom: 20px;
        }
        
        .success {
            color: #4caf50;
            font-weight: bold;
        }
        
        .highlight {
            color: #ffd700;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .info {
            color: #64b5f6;
        }
        
        .warn {
            color: #ffab40;
        }
        
        .dim {
            color: #888;
        }
        
        .separator {
            border-top: 1px dashed #333;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <a href="./perftests" id="homeButton">← Go Back</a>

    <div class="container">
        <h1 class="gradient-text" id="main-title">GPU Throughput Test</h1>
        <div class="subtitle" id="main-subtitle">Test the peak FP16, FP32, and INT32 performance of your GPU.</div>
        <button id="runBtn" onclick="runBenchmark()">Start Benchmark</button>
        <div id="log">
            <span class="dim">Ready to test.</span>
        </div>
    </div>

    <script>
    const logDiv = document.getElementById('log');
    
    function log(msg, type = 'normal') {
        const span = document.createElement('div');
        span.textContent = msg;
        span.className = type;
        logDiv.appendChild(span);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function getRobustGPUName(adapter) {
        let name = "Generic GPU";
        if (adapter.info && adapter.info.description && !adapter.info.description.includes("Generic")) {
            name = adapter.info.description;
        } else {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        const webglName = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        if (webglName) {
                            name = webglName;
                        }
                    }
                }
            } catch (e) {
                
            }
        }
        if (name.startsWith("ANGLE (")) {
            let raw = name.substring(7, name.length - 1);
            let firstComma = raw.indexOf(',');
            if (firstComma !== -1) {
                raw = raw.substring(firstComma + 1).trim();
            }
            let deviceIdIndex = raw.indexOf('(0x');
            if (deviceIdIndex !== -1) {
                name = raw.substring(0, deviceIdIndex).trim();
            } else {
                let trailerComma = raw.indexOf(',');
                if (trailerComma !== -1) {
                    name = raw.substring(0, trailerComma).trim();
                } else {
                    name = raw;
                }
            }
        }
        return name;
    }

    function getShaderCode(type) {
        let code = "";
        
        if (type === 'FP16') {
            code += "enable f16;\n";
        }

        code += `
        struct Constants { 
            c0_f: vec4<f32>,
            c1_f: vec4<f32>,
            c2_f: vec4<f32>,
            c3_f: vec4<f32>,
            c0_u: vec4<u32>,
            c1_u: vec4<u32>,
            c2_u: vec4<u32>,
            c3_u: vec4<u32>,
        }
        @group(0) @binding(1) var<uniform> consts: Constants;
        `;
        
        if (type === 'FP16') {
            code += `
            @group(0) @binding(0) var<storage, read_write> out_buf : array<vec2<f16>>;
            @compute @workgroup_size(256)
            fn main(
                @builtin(global_invocation_id) global_id : vec3<u32>,
                @builtin(local_invocation_id) local_id : vec3<u32>
            ) {
                let id = f16(global_id.x);
                
                var v0 = vec2<f16>(id+0.0h, id+0.1h);
                var v1 = vec2<f16>(id+0.2h, id+0.3h);
                var v2 = vec2<f16>(id+0.4h, id+0.5h);
                var v3 = vec2<f16>(id+0.6h, id+0.7h);
                var v4 = vec2<f16>(id+0.8h, id+0.9h);
                var v5 = vec2<f16>(id+1.0h, id+1.1h);
                var v6 = vec2<f16>(id+1.2h, id+1.3h);
                var v7 = vec2<f16>(id+1.4h, id+1.5h);
                var v8 = vec2<f16>(id+1.6h, id+1.7h);
                var v9 = vec2<f16>(id+1.8h, id+1.9h);
                var v10 = vec2<f16>(id+2.0h, id+2.1h);
                var v11 = vec2<f16>(id+2.2h, id+2.3h);
                var v12 = vec2<f16>(id+2.4h, id+2.5h);
                var v13 = vec2<f16>(id+2.6h, id+2.7h);
                var v14 = vec2<f16>(id+2.8h, id+2.9h);
                var v15 = vec2<f16>(id+3.0h, id+3.1h);

                let c0 = vec2<f16>(f16(consts.c0_f.x), f16(consts.c0_f.y));
                let c1 = vec2<f16>(f16(consts.c1_f.x), f16(consts.c1_f.y));
                let c2 = vec2<f16>(f16(consts.c2_f.x), f16(consts.c2_f.y));
                let c3 = vec2<f16>(f16(consts.c3_f.x), f16(consts.c3_f.y));

                for(var i = 0u; i < 2000u; i++) {
                    v0 = fma(v0, c0, c1);
                    v1 = fma(v1, c0, c1);
                    v2 = fma(v2, c0, c1);
                    v3 = fma(v3, c0, c1);
                    v4 = fma(v4, c0, c1);
                    v5 = fma(v5, c0, c1);
                    v6 = fma(v6, c0, c1);
                    v7 = fma(v7, c0, c1);
                    v8 = fma(v8, c0, c1);
                    v9 = fma(v9, c0, c1);
                    v10 = fma(v10, c0, c1);
                    v11 = fma(v11, c0, c1);
                    v12 = fma(v12, c0, c1);
                    v13 = fma(v13, c0, c1);
                    v14 = fma(v14, c0, c1);
                    v15 = fma(v15, c0, c1);

                    v0 = fma(v0, c2, c3);
                    v1 = fma(v1, c2, c3);
                    v2 = fma(v2, c2, c3);
                    v3 = fma(v3, c2, c3);
                    v4 = fma(v4, c2, c3);
                    v5 = fma(v5, c2, c3);
                    v6 = fma(v6, c2, c3);
                    v7 = fma(v7, c2, c3);
                    v8 = fma(v8, c2, c3);
                    v9 = fma(v9, c2, c3);
                    v10 = fma(v10, c2, c3);
                    v11 = fma(v11, c2, c3);
                    v12 = fma(v12, c2, c3);
                    v13 = fma(v13, c2, c3);
                    v14 = fma(v14, c2, c3);
                    v15 = fma(v15, c2, c3);
                }
                
                out_buf[local_id.x] = v0 + v1 + v2 + v3 + v4 + v5 + v6 + v7 + v8 + v9 + v10 + v11 + v12 + v13 + v14 + v15;
            }`;
        } else if (type === 'FP32') {
            code += `
            @group(0) @binding(0) var<storage, read_write> out_buf : array<vec2<f32>>;
            @compute @workgroup_size(256)
            fn main(
                @builtin(global_invocation_id) global_id : vec3<u32>,
                @builtin(local_invocation_id) local_id : vec3<u32>
            ) {
                let id = f32(global_id.x);
                
                var v0 = vec2<f32>(id+0.0, id+0.1);
                var v1 = vec2<f32>(id+0.2, id+0.3);
                var v2 = vec2<f32>(id+0.4, id+0.5);
                var v3 = vec2<f32>(id+0.6, id+0.7);
                var v4 = vec2<f32>(id+0.8, id+0.9);
                var v5 = vec2<f32>(id+1.0, id+1.1);
                var v6 = vec2<f32>(id+1.2, id+1.3);
                var v7 = vec2<f32>(id+1.4, id+1.5);
                var v8 = vec2<f32>(id+1.6, id+1.7);
                var v9 = vec2<f32>(id+1.8, id+1.9);
                var v10 = vec2<f32>(id+2.0, id+2.1);
                var v11 = vec2<f32>(id+2.2, id+2.3);
                var v12 = vec2<f32>(id+2.4, id+2.5);
                var v13 = vec2<f32>(id+2.6, id+2.7);
                var v14 = vec2<f32>(id+2.8, id+2.9);
                var v15 = vec2<f32>(id+3.0, id+3.1);

                let c0 = consts.c0_f.xy;
                let c1 = consts.c1_f.xy;
                let c2 = consts.c2_f.xy;
                let c3 = consts.c3_f.xy;

                for(var i = 0u; i < 2000u; i++) {
                    v0 = fma(v0, c0, c1);
                    v1 = fma(v1, c0, c1);
                    v2 = fma(v2, c0, c1);
                    v3 = fma(v3, c0, c1);
                    v4 = fma(v4, c0, c1);
                    v5 = fma(v5, c0, c1);
                    v6 = fma(v6, c0, c1);
                    v7 = fma(v7, c0, c1);
                    v8 = fma(v8, c0, c1);
                    v9 = fma(v9, c0, c1);
                    v10 = fma(v10, c0, c1);
                    v11 = fma(v11, c0, c1);
                    v12 = fma(v12, c0, c1);
                    v13 = fma(v13, c0, c1);
                    v14 = fma(v14, c0, c1);
                    v15 = fma(v15, c0, c1);

                    v0 = fma(v0, c2, c3);
                    v1 = fma(v1, c2, c3);
                    v2 = fma(v2, c2, c3);
                    v3 = fma(v3, c2, c3);
                    v4 = fma(v4, c2, c3);
                    v5 = fma(v5, c2, c3);
                    v6 = fma(v6, c2, c3);
                    v7 = fma(v7, c2, c3);
                    v8 = fma(v8, c2, c3);
                    v9 = fma(v9, c2, c3);
                    v10 = fma(v10, c2, c3);
                    v11 = fma(v11, c2, c3);
                    v12 = fma(v12, c2, c3);
                    v13 = fma(v13, c2, c3);
                    v14 = fma(v14, c2, c3);
                    v15 = fma(v15, c2, c3);
                }
                
                out_buf[local_id.x] = v0 + v1 + v2 + v3 + v4 + v5 + v6 + v7 + v8 + v9 + v10 + v11 + v12 + v13 + v14 + v15;
            }`;
        } else {
            code += `
            @group(0) @binding(0) var<storage, read_write> out_buf : array<vec4<u32>>;
            @compute @workgroup_size(256)
            fn main(
                @builtin(global_invocation_id) global_id : vec3<u32>,
                @builtin(local_invocation_id) local_id : vec3<u32>
            ) {
                let id = global_id.x;
                
                var v0 = vec4<u32>(id+0u, id+1u, id+2u, id+3u);
                var v1 = vec4<u32>(id+4u, id+5u, id+6u, id+7u);
                var v2 = vec4<u32>(id+8u, id+9u, id+10u, id+11u);
                var v3 = vec4<u32>(id+12u, id+13u, id+14u, id+15u);
                var v4 = vec4<u32>(id+16u, id+17u, id+18u, id+19u);
                var v5 = vec4<u32>(id+20u, id+21u, id+22u, id+23u);
                var v6 = vec4<u32>(id+24u, id+25u, id+26u, id+27u);
                var v7 = vec4<u32>(id+28u, id+29u, id+30u, id+31u);

                let c0 = consts.c0_u;
                let c1 = consts.c1_u;
                let c2 = consts.c2_u;
                let c3 = consts.c3_u;

                for(var i = 0u; i < 2000u; i++) {
                    v0 = v0 + c0;
                    v1 = v1 + c0;
                    v2 = v2 + c0;
                    v3 = v3 + c0;
                    v4 = v4 + c0;
                    v5 = v5 + c0;
                    v6 = v6 + c0;
                    v7 = v7 + c0;

                    v0 = v0 ^ c1;
                    v1 = v1 ^ c1;
                    v2 = v2 ^ c1;
                    v3 = v3 ^ c1;
                    v4 = v4 ^ c1;
                    v5 = v5 ^ c1;
                    v6 = v6 ^ c1;
                    v7 = v7 ^ c1;

                    v0 = v0 - c2;
                    v1 = v1 - c2;
                    v2 = v2 - c2;
                    v3 = v3 - c2;
                    v4 = v4 - c2;
                    v5 = v5 - c2;
                    v6 = v6 - c2;
                    v7 = v7 - c2;

                    v0 = v0 | c3;
                    v1 = v1 | c3;
                    v2 = v2 | c3;
                    v3 = v3 | c3;
                    v4 = v4 | c3;
                    v5 = v5 | c3;
                    v6 = v6 | c3;
                    v7 = v7 | c3;
                }
                
                out_buf[local_id.x] = v0 + v1 + v2 + v3 + v4 + v5 + v6 + v7;
            }`;
        }
        
        return code;
    }

    function formatPerformance(teraValue, type) {
        const isFloat = type !== 'INT32';
        const unitT = isFloat ? "TFLOPS" : "TIOPS";
        const unitG = isFloat ? "GFLOPS" : "GIOPS";
        
        if (teraValue < 1.0) {
            return `${(teraValue * 1000.0).toPrecision(4)} ${unitG}`;
        }
        
        return `${teraValue.toFixed(3)} ${unitT}`;
    }

    async function runComputeTest(device, type) {
        const LOOPS = 2000;
        let OPS_PER_THREAD;

        if (type === 'INT32') {
            OPS_PER_THREAD = LOOPS * 128 * 2; 
        } else {
            OPS_PER_THREAD = LOOPS * 128;
        }

        const OPS_PER_WORKGROUP = 256 * OPS_PER_THREAD; 

        const buffer = device.createBuffer({
            size: 4096, 
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC
        });

        const uniformBuffer = device.createBuffer({
            size: 128, 
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });
        
        const uniformArray = new ArrayBuffer(128);
        const floatView = new Float32Array(uniformArray);
        const uintView = new Uint32Array(uniformArray);
        
        floatView.set([0.999, 0.999, 0.999, 0.999], 0);
        floatView.set([0.001, 0.001, 0.001, 0.001], 4);
        floatView.set([0.998, 0.998, 0.998, 0.998], 8);
        floatView.set([0.002, 0.002, 0.002, 0.002], 12);
        
        uintView.set([3, 5, 7, 11], 16);
        uintView.set([13, 17, 19, 23], 20);
        uintView.set([29, 31, 37, 41], 24);
        uintView.set([43, 47, 53, 59], 28);
        
        device.queue.writeBuffer(uniformBuffer, 0, uniformArray);

        const shaderModule = device.createShaderModule({ 
            code: getShaderCode(type) 
        });
        
        const pipeline = device.createComputePipeline({ 
            layout: 'auto', 
            compute: { 
                module: shaderModule, 
                entryPoint: 'main' 
            }
        });
        
        const bindGroup = device.createBindGroup({
            layout: pipeline.getBindGroupLayout(0),
            entries: [ 
                { 
                    binding: 0, 
                    resource: { 
                        buffer: buffer 
                    } 
                }, 
                { 
                    binding: 1, 
                    resource: { 
                        buffer: uniformBuffer 
                    } 
                } 
            ],
        });

        log(`[${type}] Running Warm-up...`, 'dim');
        
        {
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginComputePass();
            pass.setPipeline(pipeline);
            pass.setBindGroup(0, bindGroup);
            pass.dispatchWorkgroups(1000); 
            pass.end();
            device.queue.submit([encoder.finish()]);
            await device.queue.onSubmittedWorkDone();
        }

        let targetGroups = 1000;
        
        {
            const calStart = performance.now();
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginComputePass();
            pass.setPipeline(pipeline); 
            pass.setBindGroup(0, bindGroup);
            pass.dispatchWorkgroups(2000); 
            pass.end();
            device.queue.submit([encoder.finish()]);
            await device.queue.onSubmittedWorkDone();
            const dt = performance.now() - calStart;
            
            const groupsPerMs = 2000 / dt;
            targetGroups = Math.floor(groupsPerMs * 100);
            
            if (targetGroups < 500) {
                targetGroups = 500;
            }
        }

        const BATCH_COUNT = 10;
        log(`[${type}] Running ${BATCH_COUNT} batches...`, 'info');

        let maxTeraOps = 0;
        
        for (let b = 0; b < BATCH_COUNT; b++) {
            const encoder = device.createCommandEncoder();
            const pass = encoder.beginComputePass();
            pass.setPipeline(pipeline); 
            pass.setBindGroup(0, bindGroup);
            
            let groupsLeft = targetGroups;
            
            while (groupsLeft > 0) {
                let d = Math.min(groupsLeft, 65000);
                pass.dispatchWorkgroups(d);
                groupsLeft -= d;
            }
            
            pass.end();
            const cmdBuffer = encoder.finish();

            const t0 = performance.now();
            device.queue.submit([cmdBuffer]);
            await device.queue.onSubmittedWorkDone();
            const t1 = performance.now();

            const dtSec = (t1 - t0) / 1000.0;
            const totalOps = targetGroups * OPS_PER_WORKGROUP;
            const currentTeraOps = (totalOps / dtSec) / 1e12;
            
            if (currentTeraOps > maxTeraOps) {
                maxTeraOps = currentTeraOps;
            }
        }

        log('------------------------------------------------', 'success');
        log(`${type} Peak Performance: ${formatPerformance(maxTeraOps, type)}`, 'highlight');
        
        buffer.destroy(); 
        uniformBuffer.destroy();
    }
    
    async function runBenchmark() {
        const btn = document.getElementById('runBtn');
        btn.disabled = true; 
        btn.textContent = "Running..."; 
        const topSep = document.createElement('div');
        topSep.className = 'separator';
        logDiv.appendChild(topSep);
        
        try {
            if (!navigator.gpu) {
                throw new Error("WebGPU not supported!");
            }
            
            const adapter = await navigator.gpu.requestAdapter();
            
            if (!adapter) {
                throw new Error("No GPU adapter found.");
            }
            
            const hasF16 = adapter.features.has('shader-f16');
            
            let requiredFeatures = [];
            if (hasF16) {
                requiredFeatures.push('shader-f16');
            }
            
            const device = await adapter.requestDevice({ 
                requiredFeatures: requiredFeatures 
            });
            
            log(`GPU: ${getRobustGPUName(adapter)}`, 'info');

            const tests = [
                { 
                    type: 'FP16', 
                    supported: hasF16 
                },
                { 
                    type: 'FP32', 
                    supported: true 
                },
                { 
                    type: 'INT32', 
                    supported: true 
                }
            ];

            for (const t of tests) {
                if (!t.supported) { 
                    log(`${t.type} Peak Performance: Skipped`, 'warn'); 
                    continue; 
                }
                
                await runComputeTest(device, t.type);
                log('------------------------------------------------', 'success');
            }
            
            log('All tests completed successfully.', 'dim');
            
        } catch (err) {
            log(`Error: ${err.message}`, 'warn'); 
            console.error(err);
        } finally {
            btn.disabled = false; 
            btn.textContent = "Start Benchmark";
        }
