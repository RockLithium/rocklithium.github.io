<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool list</title>
    <link rel="stylesheet" href="./shared/nav-cards.css">
</head>
<body>

    <a href="../" id="homeButton" class="home-button-interactive">← 返回主页</a>

    <div class="main-wrapper">
        <h1>选择项目</h1>

        <div id="button-container" class="card-grid">
            <div class="tool-button" data-href="../bitratecalculator" data-desc="集成码率、文件体积、录制时长及压缩比计算的数据工具。">
                码率计算器
            </div>

            <div class="tool-button" data-href="../fileconverter" data-desc="将视频、文档或音频一键封装为独立 HTML 网页的工具，支持离线预览与原件下载。">
                文件转HTML
            </div>

            <div class="tool-button" data-href="../colortemp" data-desc="色温可视化工具。支持 HDR 和广色域显示。">
                色温生成器
            </div>

            <div class="tool-button" data-href="../freqanalyzer" data-desc="可视化音频频谱分析工具，支持本地文件和实时分析。本地文件支持导出最低频和峰值频率的 SRT 。">
                频谱分析器
            </div>

            <div class="tool-button" data-href="../pitchshifter" data-desc="音频音调调整工具。支持导出偏移后的 WAV 文件。">
                音频变调器
            </div>

            <div class="tool-button" data-href="../freqshifter" data-desc="音频频率线性偏移工具。支持导出偏移后的 WAV 文件。">
                频率偏移器
            </div>

            <div class="tool-button" data-href="../encodingconverter" data-desc="将字符文本与多种字符编码格式进行双向互转。">
                编码转换器
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content" id="modal-box">
            <div class="modal-header" id="modal-title">标题</div>
            <div class="modal-body" id="modal-description">描述内容</div>
            <div class="modal-footer">
                <button class="modal-btn btn-cancel" id="modal-close">取消</button>
                <button class="modal-btn btn-confirm" id="modal-go">访问</button>
            </div>
        </div>
    </div>
    <script src="./shared/card-modal.js"></script>

</body>
</html>
