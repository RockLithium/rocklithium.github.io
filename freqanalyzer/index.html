<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Frequency Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Unispace Custom';
            src: url('Unispace Bd.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        body {
            background-color: #1a1a1a;
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 16px;
            color: #e0e0e0;
            background-color: #2A2A2A;
            border: 0.5px solid #505050;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            z-index: 100;
        }
        #homeButton:hover {
            background-color: #333333;
            border-color: #FF7E00;
            box-shadow: 0 0 5px rgba(255, 126, 0, 0.5);
        }
        h1 {
            font-family: 'Ubuntu Condensed', sans-serif;
            font-size: 44px;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 0;
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }
        .container {
            max-width: 800px;
            width: 90%;
            padding: 20px;
            margin-top: 50px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            position: relative;
        }
        .input-group {
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }
        .input-title {
            font-family: 'Ubuntu Condensed', sans-serif;
            font-size: 18px;
            color: #E0E0E0;
            margin-bottom: 5px;
            text-align: left;
        }
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 60px;
            background-color: #2A2A2A;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .file-upload-wrapper.drag-active {
            background-color: #333;
            border-color: #FF7E00;
            border-style: dashed;
            box-shadow: 0 0 15px rgba(255, 126, 0, 0.3);
            z-index: 50;
        }
        .file-upload-wrapper.drag-active .file-upload-text {
            color: #FF7E00;
        }
        .file-upload-wrapper:hover {
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
        }
        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 100; 
        }
        .file-upload-text {
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 18px;
            color: #888;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 20px;
            transition: color 0.3s;
        }
        .options-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .option-btn {
            background-color: #2A2A2A;
            height: 50px;
            flex: 1; 
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: #888;
            border: 0.5px solid #555;
            transition: all 0.2s;
            user-select: none;
        }
        .option-btn:hover {
            border-color: #888;
        }
        .option-btn.active {
            background: #222;
            border-color: #FF7E00;
            color: #E0E0E0;
            box-shadow: 0 0 8px rgba(255, 126, 0, 0.3);
            text-shadow: 0 0 1px #FF7E00;
        }
        .option-btn.active::before {
            content: "✔ ";
            color: #FF7E00;
            margin-right: 5px;
        }
        
        /* New Styles for Real Time Mode */
        #optRealTime.active::before {
            content: "" !important;
            margin: 0;
        }
        .hidden {
            display: none !important;
        }
        
        .param-box {
            background-color: #2A2A2A;
            height: 50px;
            flex: 1; 
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border: 0.5px solid #555;
            transition: border-color 0.2s;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
        }
        .param-box:focus-within {
            border-color: #888;
        }
        .param-label {
            color: #888;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
            white-space: nowrap;
        }
        .param-input {
            background: transparent;
            border: none;
            color: #E0E0E0;
            font-family: 'Unispace Custom', monospace;
            font-size: 16px;
            text-align: right;
            width: 100%; 
            outline: none;
            font-weight: bold;
        }
        .param-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            color: #666;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .process-btn-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        .main-btn {
            width: 100%;
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            color: #E0E0E0;
            border: none;
            border-radius: 4px;
            font-family: 'Ubuntu Condensed', sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: none; 
            box-shadow: none;
        }
        .process-button {
            background: linear-gradient(45deg, #2E8B57 0%, #3CB371 100%);
        }
        .process-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .process-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .process-button.is-processing {
            background: linear-gradient(45deg, #8B0000 0%, #B22222 100%);
            animation: pulse 2s infinite;
        }
        .process-button.is-complete {
            background: linear-gradient(45deg, #1E90FF 0%, #00BFFF 100%);
            cursor: default;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(178, 34, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0); }
        }
        .download-button {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            width: 100%;
            max-width: 600px;
        }
        .download-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .download-button:active {
            transform: scale(0.98);
        }
        .preview-box {
            background-color: #2A2A2A;
            border: 1px dashed #505050;
            border-radius: 4px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        .preview-placeholder {
            color: #555;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            text-align: center;
        }
        .status-text {
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }
        
        /* Canvas Visualizer Styles */
        .visualizer-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .vis-overlay {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        .vis-controls {
            pointer-events: auto;
            background: rgba(20, 20, 20, 0.9);
            padding: 5px 15px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #555;
            width: 80%;
            max-width: 500px;
            transition: transform 0.5s ease, opacity 0.5s ease;
            opacity: 1;
            transform: translateY(0);
        }
        .vis-controls.hide-ui {
            transform: translateY(150%);
            opacity: 0;
        }
        .visualizer-container.hide-cursor {
            cursor: none;
        }
        .vis-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
            padding: 0;
        }
        .vis-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: block;
        }
        .vis-btn:hover { color: #FF7E00; background: rgba(255,255,255,0.1); }
        
        /* Progress Bar Styles */
        .vis-progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #FF7E00;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }
        input[type=range]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #FF7E00;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        .vis-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            color: rgba(255,255,255,0.3);
            font-family: 'Unispace Custom', monospace;
            font-size: 10px;
            pointer-events: none;
        }

        @media (max-width: 820px) {
            #homeButton { top: 10px; left: 10px; padding: 8px 12px; }
            h1 { font-size: 36px; margin-top: 20px; }
            .container { margin-top: 40px; }
            .main-btn { font-size: 20px; }
        }

        @media (max-width: 600px) {
            .options-grid {
                flex-direction: column;
            }
            
            .param-box, .option-btn {
                flex: none;
                width: 100%;
                box-sizing: border-box;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <a href="../tools" id="homeButton">← Go Back</a>
    <div class="container">
        <h1>Audio Frequency Analyzer</h1>
        <div class="subtitle">Extract low & peak frequencies, export as SRT.</div>
        
        <div class="input-group">
             <div class="options-grid">
                <div class="option-btn" id="optRealTime">Real-Time Analysis</div>
            </div>
        </div>

        <div class="input-group" id="fileInputGroup">
            <div class="input-title">SELECT MEDIA FILE</div>
            <div class="file-upload-wrapper" id="dropZone">
                <span class="file-upload-text" id="fileNameDisplay">Click or drop file here...</span>
                <input type="file" id="fileInput" accept=".wav, .mp3, .flac, .aac, .m4a, .ogg, .wma, .mp4, .mov, .mkv, .webm, .avi">
            </div>
            <div class="status-text" id="statusText">Waiting for input...</div>
        </div>
        
        <div class="input-group" style="margin-bottom: 10px;">
            <div class="input-title">ALGORITHM OPTIONS</div>
            
            <div class="options-grid" style="margin-bottom: 10px;" id="optionsRow1">
                <div class="param-box" id="boxRate">
                    <span class="param-label">Sampling Rate (Hz)</span>
                    <input type="number" id="inputRate" value="10" min="1" step="1" class="param-input">
                </div>
                <div class="param-box" id="boxDB">
                    <span class="param-label">dB Below Peak</span>
                    <input type="number" id="inputDB" value="15" min="0" step="0.5" class="param-input">
                </div>
            </div>

            <div class="options-grid" style="margin-bottom: 10px;" id="optionsRow2">
                <div class="param-box" id="boxWindow">
                    <span class="param-label">Window (ms)</span>
                    <input type="number" id="inputWindow" value="500" min="10" max="1000" step="10" class="param-input">
                </div>
                <div class="param-box" id="boxHighPass">
                    <span class="param-label">High Pass (Hz)</span>
                    <input type="number" id="inputHighPass" value="20" min="0" step="1" class="param-input">
                </div>
            </div>

            <div class="options-grid" id="genSpectrumBtnGroup">
                <div class="option-btn" id="optVideo">Generate Spectrum</div>
            </div>
        </div>

        <div class="process-btn-container" id="processBtnContainer">
            <button id="processBtn" class="main-btn process-button" disabled>Start Analysis</button>
        </div>
        
        <div class="input-group">
            <div class="input-title">PREVIEW</div>
            <div class="preview-box" id="previewArea">
                <span class="preview-placeholder">No media loaded</span>
            </div>
        </div>
        <div class="input-group" style="text-align: center;" id="downloadGroup">
            <button id="downloadBtn" class="main-btn download-button" disabled>DOWNLOAD SRT</button>
        </div>
    </div>
    <script>
        // --- FFT Logic for Main Thread (Visualization) ---
        function transform(real, imag) {
            const n = real.length;
            if (n <= 1) return;
            let i = 0, j = 0;
            for (i = 0; i < n; i++) {
                if (i < j) { [real[i], real[j]] = [real[j], real[i]]; [imag[i], imag[j]] = [imag[j], imag[i]]; }
                let m = n >> 1; while (m >= 1 && j >= m) { j -= m; m >>= 1; } j += m;
            }
            for (let m = 2; m <= n; m <<= 1) {
                const mh = m >> 1; const phi = (2 * Math.PI) / m; 
                const w_real_m = Math.cos(phi); const w_imag_m = -Math.sin(phi);
                for (let k = 0; k < n; k += m) {
                    let w_real = 1; let w_imag = 0;
                    for (let r = 0; r < mh; r++) {
                        const t_index = k + r + mh; const u_index = k + r;
                        const t_real = w_real * real[t_index] - w_imag * imag[t_index];
                        const t_imag = w_real * imag[t_index] + w_imag * real[t_index];
                        const u_real = real[u_index]; const u_imag = imag[u_index];
                        real[u_index] = u_real + t_real; imag[u_index] = u_imag + t_imag;
                        real[t_index] = u_real - t_real; imag[t_index] = u_imag - t_imag;
                        const w_temp = w_real; w_real = w_real * w_real_m - w_imag * w_imag_m; w_imag = w_temp * w_imag_m + w_imag * w_real_m;
                    }
                }
            }
        }

        // --- WORKER SCRIPT DEFINITION ---
        const workerScript = `
            self.onmessage = function(e) {
                const { paddedChunk, sampleRate, globalStartSampleIndex, rateVal, dbThreshold, hopSamples, windowSec } = e.data;
                const sr = sampleRate;
                const windowSamples = Math.floor(sr * windowSec);
                const hopSec = 1.0 / rateVal;

                let n_fft = 1;
                while (n_fft < windowSamples * 4) n_fft *= 2; 

                const results = [];
                let localIndex = 0;
                const maxLocalI = paddedChunk.length - windowSamples;

                for (let i = 0; i <= maxLocalI; i += hopSamples) {
                    if (localIndex % 50 === 0) { self.postMessage({ type: 'progress', progress: i / maxLocalI }); }

                    const chunk = paddedChunk.slice(i, i + windowSamples);
                    const currentGlobalSample = globalStartSampleIndex + i;
                    const startTime = currentGlobalSample / sr;
                    const endTime = startTime + hopSec;

                    const result = getFreqData(chunk, sr, n_fft, dbThreshold);
                    
                    let text = "[Silence]";
                    if (result.low > 0 || result.peak > 0) {
                        const lowStr = result.low > 0 ? \`Low: \${result.low.toFixed(1)} Hz\` : "";
                        const peakStr = result.peak > 0 ? \`Peak: \${result.peak.toFixed(1)} Hz\` : "";
                        if (lowStr && peakStr) text = \`\${lowStr} | \${peakStr}\`;
                        else if (lowStr) text = lowStr;
                        else if (peakStr) text = peakStr;
                    }

                    results.push({ startTime: startTime, endTime: endTime, text: text });
                    localIndex++;
                }
                self.postMessage({ type: 'done', results: results });
            };

            function getFreqData(y, sr, n_fft, dbThreshold) {
                let sumSq = 0;
                for (let k = 0; k < y.length; k++) sumSq += y[k] * y[k];
                const rms = Math.sqrt(sumSq / y.length);
                if (rms < 0.003) return { low: 0, peak: 0 };

                const n_samples = y.length;
                const windowed = new Float32Array(n_samples);
                for (let k = 0; k < n_samples; k++) {
                    const multiplier = 0.5 * (1 - Math.cos(2 * Math.PI * k / (n_samples - 1)));
                    windowed[k] = y[k] * multiplier;
                }

                const real = new Float32Array(n_fft); 
                const imag = new Float32Array(n_fft);
                real.set(windowed);
                
                // Iterative Cooley-Tukey
                const n = real.length;
                let i = 0, j = 0;
                for (i = 0; i < n; i++) {
                    if (i < j) { [real[i], real[j]] = [real[j], real[i]]; [imag[i], imag[j]] = [imag[j], imag[i]]; }
                    let m = n >> 1; while (m >= 1 && j >= m) { j -= m; m >>= 1; } j += m;
                }
                for (let m = 2; m <= n; m <<= 1) {
                    const mh = m >> 1; const phi = (2 * Math.PI) / m; 
                    const w_real_m = Math.cos(phi); const w_imag_m = -Math.sin(phi);
                    for (let k = 0; k < n; k += m) {
                        let w_real = 1; let w_imag = 0;
                        for (let r = 0; r < mh; r++) {
                            const t_index = k + r + mh; const u_index = k + r;
                            const t_real = w_real * real[t_index] - w_imag * imag[t_index];
                            const t_imag = w_real * imag[t_index] + w_imag * real[t_index];
                            const u_real = real[u_index]; const u_imag = imag[u_index];
                            real[u_index] = u_real + t_real; imag[u_index] = u_imag + t_imag;
                            real[t_index] = u_real - t_real; imag[t_index] = u_imag - t_imag;
                            const w_temp = w_real; w_real = w_real * w_real_m - w_imag * w_imag_m; w_imag = w_temp * w_imag_m + w_imag * w_real_m;
                        }
                    }
                }

                let global_max_db = -Infinity;
                let peak_freq_bin = 0;
                const magnitudes = [];
                const binWidth = sr / n_fft;
                const minBin = Math.floor(20 / binWidth); 
                const maxBin = Math.floor(n_fft / 2);

                for (let k = 0; k <= maxBin; k++) {
                    const mag = Math.sqrt(real[k]*real[k] + imag[k]*imag[k]);
                    const db = 20 * Math.log10(mag + 1e-9);
                    magnitudes[k] = db;
                    if (k >= minBin && db > global_max_db) {
                        global_max_db = db;
                        peak_freq_bin = k;
                    }
                }

                const relative_threshold = global_max_db - dbThreshold;
                const absolute_noise_floor = -40;
                const final_threshold = Math.max(relative_threshold, absolute_noise_floor);

                let low_freq = 0;
                for (let k = minBin; k <= maxBin; k++) {
                    if (magnitudes[k] > final_threshold) {
                        low_freq = k * binWidth;
                        break; 
                    }
                }
                const peak_freq = peak_freq_bin * binWidth;
                return { low: low_freq, peak: peak_freq };
            }
        `;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        const previewArea = document.getElementById('previewArea');
        const processBtn = document.getElementById('processBtn');
        
        const inputHighPass = document.getElementById('inputHighPass');
        const inputRate = document.getElementById('inputRate');
        const inputDB = document.getElementById('inputDB');
        const inputWindow = document.getElementById('inputWindow');
        const optVideo = document.getElementById('optVideo');
        
        // --- UI Groups for Toggling ---
        const optRealTime = document.getElementById('optRealTime');
        const fileInputGroup = document.getElementById('fileInputGroup');
        const genSpectrumBtnGroup = document.getElementById('genSpectrumBtnGroup');
        const processBtnContainer = document.getElementById('processBtnContainer');
        const downloadGroup = document.getElementById('downloadGroup');
        
        const optionsRow1 = document.getElementById('optionsRow1');
        const optionsRow2 = document.getElementById('optionsRow2');
        const boxRate = document.getElementById('boxRate');
        const boxDB = document.getElementById('boxDB');
        const boxWindow = document.getElementById('boxWindow');
        const boxHighPass = document.getElementById('boxHighPass');
        
        let selectedFile = null;
        let isProcessing = false;
        let currentObjectUrl = null;
        let generatedSrtContent = "";
        let audioCtx = null;
        let activeWorkers = [];
        
        // Visualizer globals (File Mode)
        let visualizerCtx = null;
        let visSource = null;
        let visAnalyser = null;
        let visAnimationId = null;
        let visSpaceListener = null;
        
        // Visualizer globals (Real Time Mode)
        let rtContext = null;
        let rtStream = null;
        let rtSource = null;
        let rtAnalyser = null;
        let rtAnimationId = null;
        let savedParams = {};

        // --- Real Time Logic ---
        optRealTime.addEventListener('click', () => {
            const isActive = optRealTime.classList.toggle('active');

        function stopRealTimeVisualizer() {
            if (rtAnimationId) cancelAnimationFrame(rtAnimationId);
            if (rtSource) { rtSource.disconnect(); rtSource = null; }
            if (rtStream) {
                rtStream.getTracks().forEach(track => track.stop());

            if (rtContext && rtContext.state !== 'closed') rtContext.close();

        function startRealTimeVisualizer(stream) {
            stopRealTimeVisualizer();
            rtStream = stream;

            previewArea.innerHTML = `
                <div class="visualizer-container" id="visContainer">
                    <canvas id="visCanvas"></canvas>
                    <div class="vis-hint">Double-Click/F: Fullscreen</div>
                </div>
            `;
            
            const canvas = document.getElementById('visCanvas');
            const visContainer = document.getElementById('visContainer');
            const ctx = canvas.getContext('2d');

            rtContext = new (window.AudioContext || window.webkitAudioContext)();
            rtSource = rtContext.createMediaStreamSource(stream);
            rtAnalyser = rtContext.createAnalyser();

            rtAnalyser.fftSize = 4096; 
            rtAnalyser.minDecibels = -140;
            rtAnalyser.smoothingTimeConstant = 0.3; 
            rtSource.connect(rtAnalyser);

            const dataArray = new Float32Array(rtAnalyser.frequencyBinCount);

            // Double click fullscreen logic
            visContainer.addEventListener('dblclick', () => {
                if (!document.fullscreenElement) {
                    visContainer.requestFullscreen().catch(err => console.log(err));
                } else {
                    document.exitFullscreen();
                }
            });

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                const superSample = 2;
                canvas.width = visContainer.clientWidth * dpr * superSample;
                canvas.height = visContainer.clientHeight * dpr * superSample;
                ctx.scale(dpr * superSample, dpr * superSample);
            }
            window.addEventListener('resize', resize);
            resize();

            function draw() {
                rtAnimationId = requestAnimationFrame(draw);
                
                const winVal = parseFloat(inputWindow.value);
                if (!isNaN(winVal)) {
                    let s = 0.3; 
                    if (s < 0) s = 0; if (s > 0.95) s = 0.95;
                    rtAnalyser.smoothingTimeConstant = s;
                }

                rtAnalyser.getFloatFrequencyData(dataArray);

                const width = visContainer.clientWidth;
                const height = visContainer.clientHeight;
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);

                const minFreq = 10;
                const sampleRate = rtContext.sampleRate;
                const maxFreq = sampleRate / 2;
                const logMin = Math.log10(minFreq);
                const logMax = Math.log10(maxFreq);
                const scale = width / (logMax - logMin);

                function getX(f) {
                    if (f < minFreq) return 0;
                    return (Math.log10(f) - logMin) * scale;
                }

                function getY(db) {
                    const minDb = -140;
                    const maxDb = 0;
                    let norm = (db - minDb) / (maxDb - minDb);
                    if (norm < 0) norm = 0;
                    if (norm > 1) norm = 1;
                    return height - (norm * height);
                }

                // Grid
                ctx.font = "16px 'Unispace Custom', monospace";
                ctx.textAlign = "center";
                const powers = [10, 100, 1000, 10000];
                const multipliers = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                powers.forEach(p => {
                    multipliers.forEach(m => {
                        const freq = p * m;
                        if (freq > maxFreq) return;
                        const x = getX(freq);
                        const isMajor = (m === 1 && freq !== 10); 
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        if (isMajor) {
                            ctx.lineWidth = 1.5; ctx.strokeStyle = '#888888'; ctx.stroke();
                            ctx.fillStyle = '#E0E0E0';
                            let label = freq >= 1000 ? (freq/1000) + "k" : freq;
                            ctx.fillText(label, x + 2, height - 5);
                        } else {
                            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(136, 136, 136, 0.5)'; ctx.stroke();
                        }
                    });
                });

                // Y-Axis Grid
                ctx.textAlign = "left";
                for (let db = -140; db <= 0; db += 4) {
                    const y = getY(db);
                    const isMajor = (db % 20 === 0 && db !== 0 && db !== -140);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y); 
                    if (isMajor) {
                        ctx.lineWidth = 1.5; ctx.strokeStyle = '#888888'; ctx.stroke();
                        ctx.fillStyle = '#E0E0E0'; ctx.fillText(db, 5, y - 3);
                    } else {
                        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(136, 136, 136, 0.5)'; ctx.stroke();
                    }
                }

                // Spectrum Curve
                const bufferLength = dataArray.length;
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#A52A2A');
                gradient.addColorStop(0.5, '#FF7E00');
                gradient.addColorStop(1, '#DAA520');
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let hasStarted = false;
                for(let i = 0; i < bufferLength; i++) {
                    const freq = i * sampleRate / (2 * bufferLength); 
                    if (freq < minFreq) continue;
                    if (freq > maxFreq) break;
                    const x = getX(freq);
                    const y = getY(dataArray[i]);
                    if (!hasStarted) { ctx.moveTo(x, y); hasStarted = true; } else { ctx.lineTo(x, y); }
                }
                ctx.stroke();

                // Peak Detection
                const peaks = [];
                const noiseFloor = -100;
                // Simple peak picking
                for (let i = 2; i < bufferLength - 2; i++) {
                    const val = dataArray[i];
                    if (val > noiseFloor) {
                        if (val > dataArray[i-1] && val > dataArray[i-2] && val > dataArray[i+1] && val > dataArray[i+2]) {
                            const freq = i * sampleRate / (bufferLength * 2);
                            if (freq > minFreq) peaks.push({ freq, db: val });
                        }
                    }
                }
                
                // Filtering based on UI
                let frameMaxDB = -Infinity;
                peaks.forEach(p => frameMaxDB = Math.max(frameMaxDB, p.db));
                const dbThresholdVal = parseFloat(inputDB.value) || 15;
                const cutoffDB = frameMaxDB - dbThresholdVal;
                
                const validPeaks = peaks.filter(p => p.db >= cutoffDB);
                validPeaks.sort((a, b) => a.freq - b.freq); 
                const lowPeak = validPeaks.length > 0 ? validPeaks[0] : null;

                // Visualizing Peaks
                peaks.sort((a, b) => b.db - a.db); 
                let displayPeaks = peaks.slice(0, 10);
                if (lowPeak) {
                    const exists = displayPeaks.find(p => Math.abs(p.freq - lowPeak.freq) < 1);
                    if (!exists) displayPeaks.push(lowPeak);
                }

                ctx.textAlign = "center";
                ctx.font = "14px 'Unispace Custom', monospace";
                displayPeaks.forEach(p => {
                    const x = getX(p.freq);
                    const y = getY(p.db);
                    ctx.fillStyle = (p === lowPeak) ? '#FF7E00' : '#FFF';
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI*2);
                    ctx.fill();
                    
                    const text = Math.round(p.freq) + "Hz";
                    const tw = ctx.measureText(text).width;
                    ctx.fillStyle = "rgba(0,0,0,0.7)";
                    ctx.fillRect(x - tw/2 - 2, y - 20, tw + 4, 16);
                    ctx.fillStyle = (p === lowPeak) ? '#FF7E00' : '#FFF';
                    ctx.fillText(text, x, y - 8);
                });
            }
            draw();
        }

        async function startProcessing() {
            if (!selectedFile) return;
            
            let rateVal = parseFloat(inputRate.value);
            let dbVal = parseFloat(inputDB.value);
            let winMs = parseFloat(inputWindow.value);
            let hpFreq = parseFloat(inputHighPass.value);

            if (isNaN(rateVal) || rateVal < 1) { alert("Sampling Rate must be >= 1"); inputRate.value = 10; return; }
            if (isNaN(dbVal) || dbVal < 0) { alert("dB Below Peak must be >= 0"); inputDB.value = 15; return; }
            if (isNaN(winMs) || winMs < 10 || winMs > 1000) { alert("Window must be between 10ms and 1000ms"); inputWindow.value = 500; return; }
            if (isNaN(hpFreq) || hpFreq < 0) { hpFreq = 0; inputHighPass.value = 0; }

            const windowSec = winMs / 1000;
            const minRequiredRate = 1 / windowSec;

            if (rateVal < minRequiredRate) {
                alert(`Error: Sampling Rate is too slow for this Window Size.\nWith a ${winMs}ms window, you need at least ${minRequiredRate.toFixed(2)} Hz sampling rate to avoid gaps.`);
                return;
            }

            isProcessing = true;
            processBtn.textContent = "STOP ANALYSIS";
            processBtn.className = "main-btn process-button is-processing";
            statusText.textContent = "Loading media data...";
            downloadBtn.disabled = true;
            inputRate.disabled = true;
            inputDB.disabled = true;
            inputWindow.disabled = true;
            inputHighPass.disabled = true;
            
            try {
                const arrayBuffer = await readFileAsArrayBuffer(selectedFile);
                if (!isProcessing) return; 

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                statusText.textContent = "Decoding audio track (Main Thread)...";
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                if (!isProcessing) return; 

                const nyquist = audioBuffer.sampleRate / 2;
                if (hpFreq > nyquist) {
                    hpFreq = nyquist;
                    inputHighPass.value = nyquist; 
                    statusText.textContent = `High Pass clamped to Nyquist (${nyquist}Hz)`;
                }

                let processingBuffer = audioBuffer;
                if (hpFreq > 0) {
                    statusText.textContent = `Applying High Pass Filter (${hpFreq}Hz)...`;
                    processingBuffer = await applyHighPassFilter(audioBuffer, hpFreq);
                }

                if (!isProcessing) return; 

                const maxThreads = 16;
                const logicalCores = navigator.hardwareConcurrency || 4;
                const threadCount = Math.min(logicalCores, maxThreads);

                statusText.textContent = `Analyzing with ${threadCount} threads...`;
                
                generatedSrtContent = await runParallelAnalysis(processingBuffer, threadCount, rateVal, dbVal, windowSec);
                
                if (!generatedSrtContent) return;

                isProcessing = false;
                statusText.textContent = "Analysis complete.";
                processBtn.textContent = "PROCESSING COMPLETE";
                processBtn.className = "main-btn process-button is-complete";
                downloadBtn.disabled = false;
                downloadBtn.textContent = "DOWNLOAD SRT";
                inputRate.disabled = false;
                inputDB.disabled = false;
                inputWindow.disabled = false;
                inputHighPass.disabled = false;

                if (optVideo.classList.contains('active')) {
                    statusText.textContent = "Analysis complete. Loading Visualization...";
                    initVisualizer(selectedFile, processingBuffer);
                }

            } catch (err) {
                console.error(err);
                statusText.textContent = "Error: " + err.message;
                stopProcessingState();
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(file);
            });
        }

        async function applyHighPassFilter(inputBuffer, frequency) {
            const offlineCtx = new OfflineAudioContext(
                inputBuffer.numberOfChannels,
                inputBuffer.length,
                inputBuffer.sampleRate
            );
            const source = offlineCtx.createBufferSource();
            source.buffer = inputBuffer;
            const filter1 = offlineCtx.createBiquadFilter();
            filter1.type = 'highpass'; filter1.frequency.value = frequency; filter1.Q.value = 0.707;
            const filter2 = offlineCtx.createBiquadFilter();
            filter2.type = 'highpass'; filter2.frequency.value = frequency; filter2.Q.value = 0.707;
            source.connect(filter1); filter1.connect(filter2); filter2.connect(offlineCtx.destination);
            source.start();
            return await offlineCtx.startRendering();
        }

        function runParallelAnalysis(buffer, threadCount, rateVal, dbVal, windowSec) {
            return new Promise((resolve, reject) => {
                const channelData = buffer.getChannelData(0); 
                const originalLength = channelData.length;
                const sr = buffer.sampleRate;
                const windowSamples = Math.floor(sr * windowSec);
                const halfWindow = Math.floor(windowSamples / 2);
                const hopSec = 1.0 / rateVal;
                const hopSamples = Math.floor(sr * hopSec);
                const paddedLength = originalLength + (2 * halfWindow);
                const paddedData = new Float32Array(paddedLength);
                paddedData.set(channelData, halfWindow);
                const validStartIndices = [];
                for (let i = 0; i < originalLength; i += hopSamples) {
                    if (i + windowSamples <= paddedData.length) validStartIndices.push(i);
                }
                const totalTasks = validStartIndices.length;
                const tasksPerWorker = Math.ceil(totalTasks / threadCount);
                const blob = new Blob([workerScript], {type: 'application/javascript'});
                const workerUrl = URL.createObjectURL(blob);
                
                activeWorkers = [];
                let completedWorkers = 0;
                let allResults = [];
                let progressMap = new Array(threadCount).fill(0);

                for (let w = 0; w < threadCount; w++) {
                    const worker = new Worker(workerUrl);
                    activeWorkers.push(worker);
                    const startTaskIndex = w * tasksPerWorker;
                    const endTaskIndex = Math.min((w + 1) * tasksPerWorker, totalTasks);
                    
                    if (startTaskIndex >= endTaskIndex) {
                        completedWorkers++; worker.terminate(); continue;
                    }
                    const firstSampleIndex = validStartIndices[startTaskIndex];
                    const lastSampleIndex = validStartIndices[endTaskIndex - 1];
                    const sliceStart = firstSampleIndex; 
                    const sliceEnd = lastSampleIndex + windowSamples;
                    const chunk = paddedData.slice(sliceStart, sliceEnd);
                    
                    worker.postMessage({
                        paddedChunk: chunk, sampleRate: sr, globalStartSampleIndex: firstSampleIndex,
                        rateVal: rateVal, dbThreshold: dbVal, hopSamples: hopSamples, windowSec: windowSec
                    }, [chunk.buffer]);

                    worker.onmessage = function(e) {
                        if (e.data.type === 'progress') {
                            progressMap[w] = e.data.progress;
                            const totalProgress = progressMap.reduce((a, b) => a + b, 0) / threadCount;
                            statusText.textContent = `Analyzing: ${Math.round(totalProgress * 100)}%`;
                        } else if (e.data.type === 'done') {
                            allResults.push(...e.data.results);
                            completedWorkers++;
                            worker.terminate();
                            if (completedWorkers === activeWorkers.length) {
                                URL.revokeObjectURL(workerUrl);
                                activeWorkers = []; 
                                finishAggregation(allResults, resolve);
                            }
                        }
                    };
                    worker.onerror = function(e) { reject(new Error(`Worker error: ${e.message}`)); };
                }
                if (activeWorkers.length === 0 && totalTasks === 0) resolve(""); 
            });
        }

        function finishAggregation(allResults, resolve) {
            allResults.sort((a, b) => a.startTime - b.startTime);
            let srtOutput = [];
            let index = 1;
            allResults.forEach(item => {
                const timeStr = `${secondsToSrtTime(item.startTime)} --> ${secondsToSrtTime(item.endTime)}`;
                srtOutput.push(`${index}\n${timeStr}\n${item.text}\n`);
                index++;
            });
            resolve(srtOutput.join('\n'));
        }

        function secondsToSrtTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const secs = Math.floor(totalSeconds % 60);
            const millis = Math.round((totalSeconds % 1) * 1000);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')},${String(millis).padStart(3, '0')}`;
        }

                    showUI();
                    if (idleTimer) clearTimeout(idleTimer);
                } else {
                    resetIdleTimer();
                }
            });

            visContainer.addEventListener('click', (e) => {
                if (e.target.closest('.vis-controls')) {
                    resetIdleTimer();
                    return;
                }

                if (visControls.classList.contains('hide-ui')) {
                    resetIdleTimer();
                } else {
                    hideUI();
                }
            });

            function updateScrub(time) {
                if (!decodedBuffer) return;
                const sr = decodedBuffer.sampleRate;
                const fftSize = 8192; 
                const sampleIndex = Math.floor(time * sr);
                const channelData = decodedBuffer.getChannelData(0);
                if (sampleIndex + fftSize >= channelData.length) return;
                
                const rawChunk = channelData.slice(sampleIndex, sampleIndex + fftSize);
                const windowed = new Float32Array(fftSize);
                for(let i=0; i<fftSize; i++) {
                    const alpha = 0.42 - 0.5 * Math.cos(2*Math.PI*i/(fftSize-1)) + 0.08 * Math.cos(4*Math.PI*i/(fftSize-1));
                    windowed[i] = rawChunk[i] * alpha;
                }
                
                const real = new Float32Array(fftSize);
                const imag = new Float32Array(fftSize);
                real.set(windowed);
                transform(real, imag);
                
                if (!dataArray) dataArray = new Float32Array(fftSize/2);
                const normalizationFactor = fftSize * 0.42 / 2;

                for(let i=0; i<dataArray.length; i++) {
                    const mag = Math.sqrt(real[i]*real[i] + imag[i]*imag[i]);
                    let val = mag / normalizationFactor;
                    let db = 20 * Math.log10(val + 1e-9);
                    dataArray[i] = db;
                }
                const smoothed = new Float32Array(dataArray.length);
                for(let i=1; i<dataArray.length-1; i++) {
                    smoothed[i] = (dataArray[i-1] + dataArray[i] + dataArray[i+1]) / 3;
                }
                dataArray.set(smoothed);
            }

            function togglePlay() {
                if (visAudio.paused) {
                    if(!visualizerCtx) setupAudioContext();
                    else if(visualizerCtx.state === 'suspended') visualizerCtx.resume();
                    visAudio.play();
                    toggleBtn.innerHTML = iconPause;
                    resetIdleTimer();
                } else {
                    visAudio.pause();
                    toggleBtn.innerHTML = iconPlay;
                    showUI();
                }
            }

            toggleBtn.onclick = togglePlay;
            
            visAudio.onended = () => {
                toggleBtn.innerHTML = iconPlay;
                progressBar.value = 100;
                showUI();
            };

            progressBar.addEventListener('mousedown', () => isDragging = true);
            progressBar.addEventListener('mouseup', () => {
                isDragging = false;
                const seekTime = (progressBar.value / 100) * visAudio.duration;
                visAudio.currentTime = seekTime;
            });
            progressBar.addEventListener('input', () => {
                const seekTime = (progressBar.value / 100) * visAudio.duration;
                visAudio.currentTime = seekTime;
                resetIdleTimer();
                if (visAudio.paused) {
                    if(!visualizerCtx) setupAudioContext(); 
                    updateScrub(seekTime);
                }
            });
            
            visContainer.addEventListener('dblclick', (e) => {
                if (e.target.closest('.vis-controls')) return;
                toggleFullscreen();
            });

            visContainer.addEventListener('mousemove', (e) => {
                if (e.movementX === 0 && e.movementY === 0) return;
                resetIdleTimer();
            });

            visSpaceListener = (e) => {
                const tag = document.activeElement.tagName;
                
                if (e.code === 'KeyF' || e.key.toLowerCase() === 'f') {
                    if (tag === 'INPUT' && document.activeElement.type !== 'range') return;
                    e.preventDefault();
                    toggleFullscreen();
                    return;
                }

                if (e.code === 'Space') {
                    if (tag === 'INPUT' && document.activeElement.type === 'range') {
                        e.preventDefault();
                        togglePlay();
                        return;
                    }
                    if (tag === 'BUTTON') return; 
                    if (tag === 'INPUT') return; 
                    
                    e.preventDefault();
                    togglePlay();
                }
            };
            document.addEventListener('keydown', visSpaceListener);

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                const superSample = 2;
                
                canvas.width = visContainer.clientWidth * dpr * superSample;
                canvas.height = visContainer.clientHeight * dpr * superSample;
                
                ctx.scale(dpr * superSample, dpr * superSample);
            }
            window.addEventListener('resize', resize);
            resize();

            function setupAudioContext() {
                visualizerCtx = new (window.AudioContext || window.webkitAudioContext)();
                visSource = visualizerCtx.createMediaElementSource(visAudio);
                visAnalyser = visualizerCtx.createAnalyser();
                
                visAnalyser.fftSize = 8192; 
                visAnalyser.smoothingTimeConstant = 0.3;
                
                visSource.connect(visAnalyser);
                visAnalyser.connect(visualizerCtx.destination);

                dataArray = new Float32Array(visAnalyser.frequencyBinCount);
                draw(performance.now());
            }

            const fpsInterval = 1000 / 60;
            let lastDrawTime = performance.now();

            function draw(timestamp) {
                visAnimationId = requestAnimationFrame(draw);

                const elapsed = timestamp - lastDrawTime;
                if (elapsed < fpsInterval) return;
                lastDrawTime = timestamp - (elapsed % fpsInterval);

                if (!isDragging && visAudio.duration) {
                    const progress = (visAudio.currentTime / visAudio.duration) * 100;
                    progressBar.value = progress;
                }

                if (visAnalyser && !visAudio.paused) {
                    visAnalyser.getFloatFrequencyData(dataArray);
                } else if (!dataArray && visAnalyser) {
                    visAnalyser.getFloatFrequencyData(dataArray);
                }

                if (!dataArray) return; 

                const width = visContainer.clientWidth;
                const height = visContainer.clientHeight;
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);

                const minFreq = 10;
                const sampleRate = visualizerCtx ? visualizerCtx.sampleRate : 44100;
                const maxFreq = sampleRate / 2;
                const logMin = Math.log10(minFreq);
                const logMax = Math.log10(maxFreq);
                const scale = width / (logMax - logMin);

                function getX(f) {
                    if (f < minFreq) return 0;
                    return (Math.log10(f) - logMin) * scale;
                }

                function getY(db) {
                    const minDb = -100;
                    const maxDb = 0;
                    let norm = (db - minDb) / (maxDb - minDb);
                    if (norm < 0) norm = 0;
                    if (norm > 1) norm = 1;
                    return height - (norm * height);
                }

                // Grid drawing logic (X-Axis)
                ctx.font = "16px 'Unispace Custom', monospace";
                ctx.textAlign = "center";
                const powers = [10, 100, 1000, 10000];
                const multipliers = [1, 2, 3, 4, 5, 6, 7, 8, 9];
                powers.forEach(p => {
                    multipliers.forEach(m => {
                        const freq = p * m;
                        if (freq > maxFreq) return;
                        const x = getX(freq);
                        const isMajor = (m === 1 && freq !== 10); 
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, height);
                        if (isMajor) {
                            ctx.lineWidth = 1.5; ctx.strokeStyle = '#888888'; ctx.stroke();
                            ctx.fillStyle = '#E0E0E0';
                            let label = freq >= 1000 ? (freq/1000) + "k" : freq;
                            ctx.fillText(label, x + 2, height - 5);
                        } else {
                            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(136, 136, 136, 0.5)'; ctx.stroke();
                        }
                    });
                });

                // Grid drawing logic (Y-Axis)
                ctx.textAlign = "left";
                for (let db = -100; db <= 0; db += 4) {
                    const y = getY(db);
                    const isMajor = (db % 20 === 0 && db !== 0 && db !== -100);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y); 
                    if (isMajor) {
                        ctx.lineWidth = 1.5; ctx.strokeStyle = '#888888'; ctx.stroke();
                        ctx.fillStyle = '#E0E0E0'; ctx.fillText(db, 5, y - 3);
                    } else {
                        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(136, 136, 136, 0.5)'; ctx.stroke();
                    }
                }

                // Spectrum Curve
                const bufferLength = dataArray.length;
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#A52A2A');
                gradient.addColorStop(0.5, '#FF7E00');
                gradient.addColorStop(1, '#DAA520');
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let hasStarted = false;
                for(let i = 0; i < bufferLength; i++) {
                    const freq = i * sampleRate / (2 * bufferLength); 
                    if (freq < minFreq) continue;
                    if (freq > maxFreq) break;
                    const x = getX(freq);
                    const y = getY(dataArray[i]);
                    if (!hasStarted) { ctx.moveTo(x, y); hasStarted = true; } else { ctx.lineTo(x, y); }
                }
                ctx.stroke();

                // Peaks
                const peaks = [];
                const noiseFloor = -80;
                for (let i = 2; i < bufferLength - 2; i++) {
                    const freq = i * sampleRate / (bufferLength * 2);
                    if (freq < minFreq) continue; 
                    const val = dataArray[i];
                    if (val > noiseFloor) {
                        if (val > dataArray[i-1] && val > dataArray[i-2] && val > dataArray[i+1] && val > dataArray[i+2]) {
                            peaks.push({ freq, db: val });
                        }
                    }
                }
                let frameMaxDB = -Infinity;
                peaks.forEach(p => frameMaxDB = Math.max(frameMaxDB, p.db));
                const dbThresholdVal = parseFloat(document.getElementById('inputDB').value) || 15;
                const cutoffDB = frameMaxDB - dbThresholdVal;
                const validPeaks = peaks.filter(p => p.db >= cutoffDB);
                validPeaks.sort((a, b) => a.freq - b.freq); 
                const lowPeak = validPeaks.length > 0 ? validPeaks[0] : null;

                peaks.sort((a, b) => b.db - a.db); 
                let displayPeaks = peaks.slice(0, 10);
                if (lowPeak) {
                    const exists = displayPeaks.find(p => Math.abs(p.freq - lowPeak.freq) < 1);
                    if (!exists) displayPeaks.push(lowPeak);
                }

                ctx.textAlign = "center";
                ctx.font = "14px 'Unispace Custom', monospace";
                displayPeaks.forEach(p => {
                    const x = getX(p.freq);
                    const y = getY(p.db);
                    ctx.fillStyle = (p === lowPeak) ? '#FF7E00' : '#FFF';
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI*2);
                    ctx.fill();
                    const text = Math.round(p.freq) + "Hz";
                    const tw = ctx.measureText(text).width;
                    ctx.fillStyle = "rgba(0,0,0,0.7)";
                    ctx.fillRect(x - tw/2 - 2, y - 20, tw + 4, 16);
                    ctx.fillStyle = (p === lowPeak) ? '#FF7E00' : '#FFF';
                    ctx.fillText(text, x, y - 8);
                });
            }
        }
    </script>
</body>
</html>
