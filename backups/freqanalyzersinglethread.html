<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Frequency Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Unispace Custom';
            src: url('Unispace Bd.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        body {
            background-color: #1a1a1a;
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 16px;
            color: #e0e0e0;
            background-color: #2A2A2A;
            border: 0.5px solid #505050;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            z-index: 100;
        }
        #homeButton:hover {
            background-color: #333333;
            border-color: #FF7E00;
            box-shadow: 0 0 5px rgba(255, 126, 0, 0.5);
        }
        h1 {
            font-family: 'Ubuntu Condensed', sans-serif;
            font-size: 44px;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 0;
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }
        .container {
            max-width: 800px;
            width: 90%;
            padding: 20px;
            margin-top: 50px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            position: relative;
        }
        .input-group {
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }
        .input-title {
            font-family: 'Ubuntu Condensed', sans-serif;
            font-size: 18px;
            color: #E0E0E0;
            margin-bottom: 5px;
            text-align: left;
        }
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 60px;
            background-color: #2A2A2A;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .file-upload-wrapper.drag-active {
            background-color: #333;
            border-color: #FF7E00;
            border-style: dashed;
            box-shadow: 0 0 15px rgba(255, 126, 0, 0.3);
            z-index: 50;
        }
        .file-upload-wrapper.drag-active .file-upload-text {
            color: #FF7E00;
        }
        .file-upload-wrapper:hover {
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
        }
        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 100; 
        }
        .file-upload-text {
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 18px;
            color: #888;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 20px;
            transition: color 0.3s;
        }
        
        /* Grid Layout */
        .options-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        /* Parameter Input Styling */
        .param-box {
            background-color: #2A2A2A;
            height: 50px;
            flex: 1; 
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border: 0.5px solid #555;
            transition: border-color 0.2s;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
        }
        
        .param-box:focus-within {
            border-color: #888;
        }
        .param-label {
            color: #888;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
        }
        .param-input {
            background: transparent;
            border: none;
            color: #E0E0E0;
            font-family: 'Unispace Custom', monospace;
            font-size: 16px;
            text-align: right;
            width: 80px;
            outline: none;
            font-weight: bold;
        }
        /* Hide number spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .option-btn {
            background-color: #2A2A2A;
            height: 50px;
            flex: 1; 
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: #888;
            border: 0.5px solid #555;
            transition: all 0.2s;
            user-select: none;
        }
        .option-btn:hover {
            border-color: #888;
        }
        .option-btn.active {
            background: #222;
            border-color: #FF7E00;
            color: #E0E0E0;
            box-shadow: 0 0 8px rgba(255, 126, 0, 0.3);
            text-shadow: 0 0 1px #FF7E00;
        }
        .option-btn.active::before {
            content: "✔ ";
            color: #FF7E00;
            margin-right: 5px;
        }
        .process-btn-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        .main-btn {
            width: 100%;
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            color: #E0E0E0;
            border: none;
            border-radius: 4px;
            font-family: 'Ubuntu Condensed', sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: none; 
            box-shadow: none;
        }
        .process-button {
            background: linear-gradient(45deg, #2E8B57 0%, #3CB371 100%);
        }
        .process-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .process-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .process-button.is-processing {
            background: linear-gradient(45deg, #8B0000 0%, #B22222 100%);
            animation: pulse 2s infinite;
        }
        .process-button.is-complete {
            background: linear-gradient(45deg, #1E90FF 0%, #00BFFF 100%);
            cursor: default;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(178, 34, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0); }
        }
        .download-button {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            width: 100%;
            max-width: 600px;
        }
        .download-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .download-button:active {
            transform: scale(0.98);
        }
        .preview-box {
            background-color: #2A2A2A;
            border: 1px dashed #505050;
            border-radius: 4px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        .preview-placeholder {
            color: #555;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            text-align: center;
        }
        .status-text {
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }
        @media (max-width: 820px) {
            #homeButton {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
            }
            h1 {
                font-size: 36px;
                margin-top: 20px;
            }
            .container {
                margin-top: 40px;
            }
            .main-btn {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="../tools" id="homeButton">← Go Back</a>
    <div class="container">
        <h1>Audio Frequency Analyzer</h1>
        <div class="subtitle">Extract low & peak frequencies in the input audio, export as SRT.</div>
        <div class="input-group">
            <div class="input-title">SELECT AUDIO FILE</div>
            <div class="file-upload-wrapper" id="dropZone">
                <span class="file-upload-text" id="fileNameDisplay">Click or Drop audio here...</span>
                <input type="file" id="fileInput" accept="audio/*, .wav, .mp3, .flac, .aac, .m4a, .ogg, .wma">
            </div>
            <div class="status-text" id="statusText">Waiting for input...</div>
        </div>
        
        <div class="input-group" style="margin-bottom: 10px;">
            <div class="input-title">ALGORITHM OPTIONS</div>
            
            <div class="options-grid" style="margin-bottom: 10px;">
                <div class="param-box">
                    <span class="param-label">Sampling Rate (Hz)</span>
                    <input type="number" id="inputRate" value="10" min="1" step="1" class="param-input">
                </div>
                <div class="param-box">
                    <span class="param-label">dB Below Peak</span>
                    <input type="number" id="inputDB" value="15" min="0" step="0.5" class="param-input">
                </div>
            </div>

            <div class="options-grid">
                <div class="option-btn active" id="optHighPass">High Pass Filter (20Hz)</div>
                <div class="option-btn active" id="optSilence">Exclude Silence</div>
            </div>
        </div>

        <div class="process-btn-container">
            <button id="processBtn" class="main-btn process-button" disabled>Start Analysis</button>
        </div>
        <div class="input-group">
            <div class="input-title">PREVIEW</div>
            <div class="preview-box" id="previewArea">
                <span class="preview-placeholder">No audio loaded</span>
            </div>
        </div>
        <div class="input-group" style="text-align: center;">
            <button id="downloadBtn" class="main-btn download-button" disabled>DOWNLOAD SRT</button>
        </div>
    </div>
    <script>
        // --- UI Variables ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        const previewArea = document.getElementById('previewArea');
        const processBtn = document.getElementById('processBtn');
        const optHighPass = document.getElementById('optHighPass');
        const optSilence = document.getElementById('optSilence');
        const inputRate = document.getElementById('inputRate');
        const inputDB = document.getElementById('inputDB');
        
        let selectedFile = null;
        let isProcessing = false;
        let currentObjectUrl = null;
        let generatedSrtContent = "";
        let audioCtx = null;
        let abortController = null;

        function resetUIOnOptionChange() {
            if (generatedSrtContent || isProcessing || processBtn.textContent.includes("COMPLETE")) {
                generatedSrtContent = "";
                isProcessing = false;
                downloadBtn.disabled = true;
                processBtn.textContent = "START ANALYSIS";
                processBtn.className = "main-btn process-button";
                processBtn.disabled = false;
                statusText.textContent = "Parameters changed. Please re-analyze.";
            }
        }

        optHighPass.addEventListener('click', () => { optHighPass.classList.toggle('active'); resetUIOnOptionChange(); });
        optSilence.addEventListener('click', () => { optSilence.classList.toggle('active'); resetUIOnOptionChange(); });
        inputRate.addEventListener('input', resetUIOnOptionChange);
        inputDB.addEventListener('input', resetUIOnOptionChange);

        // --- Drag & Drop ---
        let dragCounter = 0; 
        dropZone.addEventListener('dragenter', (e) => { e.preventDefault(); e.stopPropagation(); dragCounter++; dropZone.classList.add('drag-active'); }, false);
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); if (!dropZone.classList.contains('drag-active')) dropZone.classList.add('drag-active'); }, false);
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); e.stopPropagation(); dragCounter--; if (dragCounter <= 0) { dropZone.classList.remove('drag-active'); dragCounter = 0; } }, false);
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation(); dragCounter = 0; dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            }
        }, false);

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            fileNameDisplay.style.color = "#E0E0E0";
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            statusText.textContent = `Selected: ${file.name} (${sizeMB} MB). Ready to analyze.`;
            
            resetProcessButton();
            processBtn.disabled = false;
            downloadBtn.disabled = true;
            generatedSrtContent = "";

            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(file);
            
            previewArea.innerHTML = '';
            const audio = document.createElement('audio'); 
            audio.src = currentObjectUrl; 
            audio.controls = true; 
            audio.style.width = "90%"; 
            audio.style.height = "50px"; 
            audio.style.marginTop = "10px";
            
            const wrapper = document.createElement('div');
            wrapper.style.textAlign = "center";
            wrapper.style.width = "100%"; 
            wrapper.innerHTML = `<div style="font-size:48px; margin-bottom:5px;">🎵</div>`;
            wrapper.appendChild(audio);
            previewArea.appendChild(wrapper);
        });

        processBtn.addEventListener('click', async function() {
            if (isProcessing) {
                if (abortController) abortController.abort();
                stopProcessingState();
                statusText.textContent = "Analysis aborted by user.";
            } else if (selectedFile) {
                startProcessing();
            }
        });

        function resetProcessButton() {
            isProcessing = false; 
            processBtn.textContent = "START ANALYSIS"; 
            processBtn.className = "main-btn process-button"; 
            processBtn.disabled = true;
        }

        function stopProcessingState() {
            isProcessing = false;
            processBtn.textContent = "START ANALYSIS";
            processBtn.className = "main-btn process-button";
            processBtn.disabled = false;
        }

        async function startProcessing() {
            if (!selectedFile) return;
            
            let rateVal = parseFloat(inputRate.value);
            let dbVal = parseFloat(inputDB.value);

            if (isNaN(rateVal) || rateVal < 1) { alert("Sampling Rate must be >= 1"); inputRate.value = 10; return; }
            if (isNaN(dbVal) || dbVal < 0) { alert("dB Below Peak must be >= 0"); inputDB.value = 15; return; }

            isProcessing = true;
            processBtn.textContent = "STOP ANALYSIS";
            processBtn.className = "main-btn process-button is-processing";
            statusText.textContent = "Loading audio data...";
            downloadBtn.disabled = true;
            
            abortController = new AbortController();
            const signal = abortController.signal;

            try {
                const arrayBuffer = await readFileAsArrayBuffer(selectedFile);
                if (signal.aborted) throw new Error("Aborted");

                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                statusText.textContent = "Decoding audio...";
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                if (signal.aborted) throw new Error("Aborted");

                let processingBuffer = audioBuffer;
                if (optHighPass.classList.contains('active')) {
                    statusText.textContent = "Applying High Pass Filter (20Hz)...";
                    processingBuffer = await applyHighPassFilter(audioBuffer, 20);
                }
                if (signal.aborted) throw new Error("Aborted");

                statusText.textContent = `Analyzing (${rateVal}Hz sampling, Center Aligned)...`;
                
                generatedSrtContent = await analyzeAudioSliding(processingBuffer, signal, rateVal, dbVal);
                
                isProcessing = false;
                statusText.textContent = "Analysis complete.";
                processBtn.textContent = "PROCESSING COMPLETE";
                processBtn.className = "main-btn process-button is-complete";
                downloadBtn.disabled = false;
                downloadBtn.textContent = "DOWNLOAD SRT";

            } catch (err) {
                if (err.message === "Aborted") {
                    console.log("Processing stopped.");
                } else {
                    console.error(err);
                    statusText.textContent = "Error: " + err.message;
                    stopProcessingState();
                }
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(file);
            });
        }

        async function applyHighPassFilter(inputBuffer, frequency) {
            const offlineCtx = new OfflineAudioContext(
                inputBuffer.numberOfChannels,
                inputBuffer.length,
                inputBuffer.sampleRate
            );
            const source = offlineCtx.createBufferSource();
            source.buffer = inputBuffer;
            const filter1 = offlineCtx.createBiquadFilter();
            filter1.type = 'highpass'; filter1.frequency.value = frequency; filter1.Q.value = 0.707;
            const filter2 = offlineCtx.createBiquadFilter();
            filter2.type = 'highpass'; filter2.frequency.value = frequency; filter2.Q.value = 0.707;
            source.connect(filter1); filter1.connect(filter2); filter2.connect(offlineCtx.destination);
            source.start();
            return await offlineCtx.startRendering();
        }

        // --- Padded Sliding Window Algorithm ---
        async function analyzeAudioSliding(buffer, signal, sampleRateHz, dbThreshold) {
            const channelData = buffer.getChannelData(0); 
            const sr = buffer.sampleRate;
            
            const windowSec = 1.0; 
            const windowSamples = Math.floor(sr * windowSec);
            const halfWindow = Math.floor(windowSamples / 2);
            
            const hopSec = 1.0 / sampleRateHz;
            const hopSamples = Math.floor(sr * hopSec);

            let n_fft = 1;
            while (n_fft < windowSamples) n_fft *= 2;

            // --- PADDING LOGIC ---
            const paddedLength = channelData.length + (2 * halfWindow);
            const paddedData = new Float32Array(paddedLength);
            paddedData.set(channelData, halfWindow);
            
            let srtOutput = [];
            let index = 1;
            const excludeSilence = optSilence.classList.contains('active');
            
            const originalLength = channelData.length;

            for (let i = 0; i < originalLength; i += hopSamples) {
                if (signal.aborted) throw new Error("Aborted");
                
                if (index % 100 === 0) {
                    const progress = Math.round((i / originalLength) * 100);
                    statusText.textContent = `Analyzing: ${progress}%`;
                    await new Promise(r => setTimeout(r, 0));
                }

                if (i + windowSamples > paddedData.length) break;

                const chunk = paddedData.slice(i, i + windowSamples);
                
                const startTime = i / sr;
                const endTime = startTime + hopSec;

                const result = getFreqData(chunk, sr, n_fft, dbThreshold);
                
                let text = "[Silence]";
                if (result.low > 0 || result.peak > 0) {
                    const lowStr = result.low > 0 ? `Low: ${result.low.toFixed(1)} Hz` : "";
                    const peakStr = result.peak > 0 ? `Peak: ${result.peak.toFixed(1)} Hz` : "";
                    
                    if (lowStr && peakStr) text = `${lowStr} | ${peakStr}`;
                    else if (lowStr) text = lowStr;
                    else if (peakStr) text = peakStr;
                }

                if (text !== "[Silence]" || !excludeSilence) {
                    const timeStr = `${secondsToSrtTime(startTime)} --> ${secondsToSrtTime(endTime)}`;
                    srtOutput.push(`${index}\n${timeStr}\n${text}\n`);
                    index++;
                }
            }
            return srtOutput.join('\n');
        }

        function getFreqData(y, sr, n_fft, dbThreshold) {
            let sumSq = 0;
            for (let k = 0; k < y.length; k++) sumSq += y[k] * y[k];
            const rms = Math.sqrt(sumSq / y.length);

            if (rms < 0.003) return { low: 0, peak: 0 };

            const n_samples = y.length;
            const windowed = new Float32Array(n_samples);
            for (let k = 0; k < n_samples; k++) {
                const multiplier = 0.5 * (1 - Math.cos(2 * Math.PI * k / (n_samples - 1)));
                windowed[k] = y[k] * multiplier;
            }

            const real = new Float32Array(n_fft); 
            const imag = new Float32Array(n_fft);
            real.set(windowed);
            transform(real, imag); 

            let global_max_db = -Infinity;
            let peak_freq_bin = 0;
            
            const magnitudes = [];
            const binWidth = sr / n_fft;
            const minBin = Math.floor(20 / binWidth); 
            const maxBin = Math.floor(n_fft / 2);

            for (let k = 0; k <= maxBin; k++) {
                const mag = Math.sqrt(real[k]*real[k] + imag[k]*imag[k]);
                const db = 20 * Math.log10(mag + 1e-9);
                
                magnitudes[k] = db;

                if (k >= minBin) {
                    if (db > global_max_db) {
                        global_max_db = db;
                        peak_freq_bin = k;
                    }
                }
            }

            const relative_threshold = global_max_db - dbThreshold;
            const absolute_noise_floor = -40;
            const final_threshold = Math.max(relative_threshold, absolute_noise_floor);

            let low_freq = 0;
            for (let k = minBin; k <= maxBin; k++) {
                if (magnitudes[k] > final_threshold) {
                    low_freq = k * binWidth;
                    break; 
                }
            }
            
            const peak_freq = peak_freq_bin * binWidth;
            return { low: low_freq, peak: peak_freq };
        }

        function transform(real, imag) {
            const n = real.length;
            if (n <= 1) return;
            let i = 0, j = 0;
            for (i = 0; i < n; i++) {
                if (i < j) { [real[i], real[j]] = [real[j], real[i]]; [imag[i], imag[j]] = [imag[j], imag[i]]; }
                let m = n >> 1; while (m >= 1 && j >= m) { j -= m; m >>= 1; } j += m;
            }
            for (let m = 2; m <= n; m <<= 1) {
                const mh = m >> 1; const phi = (2 * Math.PI) / m; 
                const w_real_m = Math.cos(phi); const w_imag_m = -Math.sin(phi);
                for (let k = 0; k < n; k += m) {
                    let w_real = 1; let w_imag = 0;
                    for (let r = 0; r < mh; r++) {
                        const t_index = k + r + mh; const u_index = k + r;
                        const t_real = w_real * real[t_index] - w_imag * imag[t_index];
                        const t_imag = w_real * imag[t_index] + w_imag * real[t_index];
                        const u_real = real[u_index]; const u_imag = imag[u_index];
                        real[u_index] = u_real + t_real; imag[u_index] = u_imag + t_imag;
                        real[t_index] = u_real - t_real; imag[t_index] = u_imag - t_imag;
                        const w_temp = w_real; w_real = w_real * w_real_m - w_imag * w_imag_m; w_imag = w_temp * w_imag_m + w_imag * w_real_m;
                    }
                }
            }
        }

        function secondsToSrtTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const secs = Math.floor(totalSeconds % 60);
            const millis = Math.round((totalSeconds % 1) * 1000);
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');
            const ss = String(secs).padStart(2, '0');
            const ms = String(millis).padStart(3, '0');
            return `${hh}:${mm}:${ss},${ms}`;
        }

        downloadBtn.addEventListener('click', function() {
            if (!generatedSrtContent || !selectedFile) return;
            const originalName = selectedFile.name;
            const namePart = originalName.substring(0, originalName.lastIndexOf('.')) || originalName;
            const fileName = `${namePart}.srt`;
            const blob = new Blob([generatedSrtContent], { type: 'text/srt' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });
    </script>
</body>
</html>
