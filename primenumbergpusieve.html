<body onload="initializeUI()">

            </label>

        <div style="text-align: center;">
            <button id="downloadButton" onclick="window.downloadPrimes()">下载质数列表 (.txt)</button>
        </div>

    <script id="webgpu-shader-32" type="text/plain">
struct Params { start_num:u32, limit:u32 };
@group(0) @binding(0) var<uniform> params:Params;
@group(0) @binding(1) var<storage,read_write> output_data:array<u32>;
@group(0) @binding(2) var<storage,read> primes:array<vec4<u32>>;
struct U64 { lo:u32, hi:u32 };
fn add(a:U64,b:u32)->U64 {let lo=a.lo+b;return U64(lo,a.hi+select(0u,1u,lo<a.lo));}
fn le(a:U64,b:U64)->bool {return a.hi<b.hi||(a.hi==b.hi&&a.lo<=b.lo);}
var<workgroup> marks:array<atomic<u32>,240>;
@compute @workgroup_size(64)
fn main(@builtin(workgroup_id) group:vec3<u32>,@builtin(local_invocation_index) lane:u32) {
    let origin=add(U64(params.start_num,0u),group.x*15360u);
    let oddStart=add(origin,1u);
    let end=add(origin,15359u);
    for(var w=lane;w<240u;w+=64u) {atomicStore(&marks[w],0u);}
    workgroupBarrier();
    for(var j=lane;j<arrayLength(&primes);j+=64u) {
        let record=primes[j];let p=record.x;let square=U64(record.z,record.w);
        if (!le(square,end)) {continue;}
        // hi <= 256 throughout the current 2^40 limit; this product fits u32.
        let rem=((oddStart.hi%p)*record.y+oddStart.lo%p)%p;
        var delta=(p-rem)%p;
        if((delta&1u)!=0u) {delta+=p;}
        if(le(oddStart,square)) {delta=square.lo-oddStart.lo;}
        for(var idx=delta/2u;idx<7680u;idx+=p) {atomicOr(&marks[idx/32u],1u<<(idx%32u));}
    }
    workgroupBarrier();
    let offsets=array<u32,8>(1u,7u,11u,13u,17u,19u,23u,29u);
    for(var local=lane;local<4096u;local+=64u) {
        let offset=(local/8u)*30u+offsets[local%8u];
        let n=add(origin,offset);let idx=(offset-1u)/2u;
        let valid=le(n,U64(params.limit,0u))&&le(U64(params.start_num,0u),n)&&(n.hi!=0u||n.lo>=7u);
        let prime=valid&&((atomicLoad(&marks[idx/32u])&(1u<<(idx%32u)))==0u);
        output_data[group.x*4096u+local]=select(0u,n.lo,prime);
    }
}

</script>

    <script id="webgpu-shader-64" type="text/plain">
struct Params { start_num_lo:u32, start_num_hi:u32, limit_lo:u32, limit_hi:u32 };
@group(0) @binding(0) var<uniform> params:Params;
@group(0) @binding(1) var<storage,read_write> output_data:array<vec2<u32>>;
@group(0) @binding(2) var<storage,read> primes:array<vec4<u32>>;
struct U64 { lo:u32, hi:u32 };
fn add(a:U64,b:u32)->U64 {let lo=a.lo+b;return U64(lo,a.hi+select(0u,1u,lo<a.lo));}
fn le(a:U64,b:U64)->bool {return a.hi<b.hi||(a.hi==b.hi&&a.lo<=b.lo);}
var<workgroup> marks:array<atomic<u32>,240>;
@compute @workgroup_size(64)
fn main(@builtin(workgroup_id) group:vec3<u32>,@builtin(local_invocation_index) lane:u32) {
    let origin=add(U64(params.start_num_lo,params.start_num_hi),group.x*15360u);
    let oddStart=add(origin,1u);
    let end=add(origin,15359u);
    for(var w=lane;w<240u;w+=64u) {atomicStore(&marks[w],0u);}
    workgroupBarrier();
    for(var j=lane;j<arrayLength(&primes);j+=64u) {
        let record=primes[j];let p=record.x;let square=U64(record.z,record.w);
        if (!le(square,end)) {continue;}
        // hi <= 256 throughout the current 2^40 limit; this product fits u32.
        let rem=((oddStart.hi%p)*record.y+oddStart.lo%p)%p;
        var delta=(p-rem)%p;
        if((delta&1u)!=0u) {delta+=p;}
        if(le(oddStart,square)) {delta=square.lo-oddStart.lo;}
        for(var idx=delta/2u;idx<7680u;idx+=p) {atomicOr(&marks[idx/32u],1u<<(idx%32u));}
    }
    workgroupBarrier();
    let offsets=array<u32,8>(1u,7u,11u,13u,17u,19u,23u,29u);
    for(var local=lane;local<4096u;local+=64u) {
        let offset=(local/8u)*30u+offsets[local%8u];
        let n=add(origin,offset);let idx=(offset-1u)/2u;
        let valid=le(n,U64(params.limit_lo,params.limit_hi))&&le(U64(params.start_num_lo,params.start_num_hi),n)&&(n.hi!=0u||n.lo>=7u);
        let prime=valid&&((atomicLoad(&marks[idx/32u])&(1u<<(idx%32u)))==0u);
        output_data[group.x*4096u+local]=select(vec2<u32>(0u,0u),vec2<u32>(n.lo,n.hi),prime);
    }
}

</script>

    <script>
        const MIN_EXPONENT = 1; 
        const MAX_EXPONENT = 40;
        const MAX_VALUE_NUM = 1099511627776n;
        const GPU_BATCH_SIZE = 1 << 21;
        const SAVE_CHUNK_SIZE = 1 << 28; 

        let STAGE_MAX_NUMBER = 0n;
        let isRunning = false;
        let outputGeneration = 0;
        const pendingFormatCancels = new Set();
        let isExponentMode = true;
        let currentExponent = 24;
        
        let startTime = 0;
        let totalSearchTime = 0;
        let timerInterval = null;
        
        let totalPrimeCount = 0;
        let accumulatedPrimesBlobs = [];
        let currentRawResults = []; 

        let useRealtimeSave = false;
        let writableStream = null;
        
        window.finalPrimesContentParts = [];

        const workerCode = `
            self.onmessage = function(e) {
                const { batches, index } = e.data;
                let count = 0, used = 0;
                let bytes = new Uint8Array(65536);
                const scratch = new Uint8Array(16);
                function appendNumber(n) {
                    if (used + 14 > bytes.length) {
                        const next = new Uint8Array(bytes.length * 2);
                        next.set(bytes.subarray(0, used)); bytes = next;
                    }
                    let digits = 0;
                    do {
                        const q = Math.floor(n / 10);
                        scratch[digits++] = 48 + (n - q * 10);
                        n = q;
                    } while (n > 0);
                    while (digits > 0) bytes[used++] = scratch[--digits];
                    bytes[used++] = 32;
                    count++;
                }
                for (let b of batches) {
                    const offsets = [1, 7, 11, 13, 17, 19, 23, 29];
                    for (let word = 0; word < b.data.length; word++) {
                        const mask = b.data[word];
                        if (mask === 0) continue;
                        for (let bit = 0; bit < 32; bit++) {
                            const index = word * 32 + bit;
                            if (index >= b.count) break;
                            if ((mask & (1 << bit)) !== 0) {
                                appendNumber(b.start + Math.floor(index / 8) * 30 + offsets[index % 8]);
                            }
                        }
                    }
                }
                
                const output = bytes.slice(0, used);
                self.postMessage({buffer:output.buffer, count, index}, [output.buffer]);
            };
        `;

        function initializeUI() {
            exponentInput = document.getElementById('exponentInput');
            limitLabel = document.getElementById('limitLabel');
            limitDisplay = document.getElementById('limitDisplay');
            stageButton = document.getElementById('stageButton');
            stageMessage = document.getElementById('stageMessage');
            currentStage = document.getElementById('currentStage');
            currentProgress = document.getElementById('currentProgress');
            progressFill = document.getElementById('progressFill');
            elapsedTimeDisplay = document.getElementById('elapsedTime');
            resultArea = document.getElementById('resultArea');
            resultSummary = document.getElementById('resultSummary');

            exponentInput.oninput = window.updateLimitDisplay;
            window.updateLimitDisplay();
        }

        window.toggleMode = function() {
            const currentLimit = parseLimitInput(exponentInput.value);
            isExponentMode = !isExponentMode;
            if (isExponentMode) {
                limitLabel.textContent = '质数查找上限 (2^N), N=';
                exponentInput.type = 'number';
                exponentInput.classList.remove('numerical');
                currentExponent = Math.min(MAX_EXPONENT, Math.max(MIN_EXPONENT, Math.round(Math.log2(Number(currentLimit) || 1))));
                exponentInput.value = currentExponent;
            } else {
                limitLabel.textContent = '质数查找上限 (数值)=';
                exponentInput.type = 'text';
                exponentInput.classList.add('numerical');
                exponentInput.value = currentLimit.toLocaleString();
            }
            window.updateLimitDisplay();
        }

        function parseLimitInput(value) {
            let limit = 0n;
            if (isExponentMode) {
                let exp = parseInt(value);
                if (isNaN(exp)) exp = currentExponent;
                let clampedExp = Math.min(MAX_EXPONENT, Math.max(MIN_EXPONENT, exp));
                if (exp !== clampedExp) exponentInput.value = clampedExp;
                
                limit = (1n << BigInt(clampedExp));
                currentExponent = clampedExp;
            } else {
                try {
                    limit = BigInt(value.replace(/,/g, ''));
                    if (limit > MAX_VALUE_NUM) {
                        limit = MAX_VALUE_NUM;
                        exponentInput.value = MAX_VALUE_NUM.toLocaleString();
                    }
                    if (limit < 1n) {
                        limit = 1n;
                        exponentInput.value = "1";
                    }
                } catch (e) { limit = 1n; }
            }
            return limit;
        }

        window.updateLimitDisplay = function() {
            STAGE_MAX_NUMBER = parseLimitInput(exponentInput.value);

            const THRESHOLD_32 = 1n << 32n;
            const realtimeGroup = document.getElementById('realtimeSaveGroup');
            if (STAGE_MAX_NUMBER >= THRESHOLD_32) {
                realtimeGroup.style.display = 'flex';
            } else {
                realtimeGroup.style.display = 'none';
            }

            const formattedLimit = STAGE_MAX_NUMBER.toLocaleString('en-US');
            limitDisplay.innerHTML = `上限 ${isExponentMode ? '(2^' + currentExponent + ')' : '(数值)'}：<span class="value">${formattedLimit}</span>`;
            if (!isRunning) {
                stageMessage.textContent = `点击“开始计算”：将使用 WebGPU 并行测试 2 到 ${formattedLimit} 的所有数字。`;
            }
        }

        window.handleStageControl = async function() {
            if (isRunning) {
                await stopStressTest();
            } else {
                window.updateLimitDisplay();
                
                const THRESHOLD_WARN = 1n << 36n;
                const checkbox = document.getElementById('realtimeSaveCheckbox');
                useRealtimeSave = checkbox && checkbox.checked && document.getElementById('realtimeSaveGroup').style.display !== 'none';

                if (STAGE_MAX_NUMBER > THRESHOLD_WARN && !useRealtimeSave) {
                    if (!confirm("如果不使用实时落盘，可能由于缓存占用过大而无法存盘或导致页面崩溃。是否确认强制开始？")) {
                        return;
                    }
                }

                if (useRealtimeSave) {
                    try {
                        const fileHandle = await window.showSaveFilePicker({
                            suggestedName: `primes_up_to_${STAGE_MAX_NUMBER.toLocaleString('en-US')}.txt`,
                            types: [{
                                description: 'Text Files',
                                accept: {'text/plain': ['.txt']},
                            }],
                        });
                        writableStream = await fileHandle.createWritable();
                    } catch (e) {
                        console.error("用户取消了文件选择或发生错误:", e);
                        return;
                    }
                }

                startSearch();
            }
        }

        async function stopStressTest() {
            outputGeneration++;
            for (const cancel of pendingFormatCancels) cancel();
            pendingFormatCancels.clear();
            isRunning = false;
            clearInterval(timerInterval);
            if (startTime > 0) {
                const frozenTime = ((Date.now() - startTime) / 1000).toFixed(3);
                elapsedTimeDisplay.innerHTML = `<span class="monospace-value">${frozenTime}s</span> <span class="status-text">(已停止)</span>`;
            }
            stageButton.textContent = '开始计算';
            stageButton.className = 'start-btn';
            exponentInput.disabled = false;
            document.getElementById('modeSwitchButton').disabled = false;
            stageMessage.textContent = '程序已停止。您可以修改配置后再次点击“开始计算”。';

            if (useRealtimeSave && writableStream) {
                try { await writableStream.close(); } catch(e){}
                writableStream = null;
            }
        }

        async function startSearch() {
            const searchGeneration = ++outputGeneration;
            if (!navigator.gpu) { alert("此浏览器不支持 WebGPU"); return; }
            
            isRunning = true;
            totalPrimeCount = 0;
            accumulatedPrimesBlobs = [];
            window.finalPrimesContentParts = [];
            let currentRawResults = [];
            totalSearchTime = 0;
            startTime = Date.now();
            
            resultArea.style.display = 'none';
            stageButton.textContent = '停止计算';
            stageButton.className = 'stop-btn';
            exponentInput.disabled = true;
            document.getElementById('modeSwitchButton').disabled = true;
            currentStage.textContent = "并行查找 (GPU 分段筛)";

            timerInterval = setInterval(() => {
                elapsedTimeDisplay.innerHTML = `<span class="monospace-value">${((Date.now() - startTime) / 1000).toFixed(3)}s</span>`;
            }, 50);

            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            
            const shader32 = device.createShaderModule({ code: document.getElementById('webgpu-shader-32').textContent });
            const pipeline32 = device.createComputePipeline({ layout: 'auto', compute: { module: shader32, entryPoint: 'main' } });

            const shader64 = device.createShaderModule({ code: document.getElementById('webgpu-shader-64').textContent });
            const pipeline64 = device.createComputePipeline({ layout: 'auto', compute: { module: shader64, entryPoint: 'main' } });

            const packModule = device.createShaderModule({ code: `
                struct PackParams { count: u32, stride: u32 };
                @group(0) @binding(0) var<storage, read> source: array<u32>;
                @group(0) @binding(1) var<storage, read_write> bits: array<u32>;
                @group(0) @binding(2) var<uniform> config: PackParams;
                @compute @workgroup_size(64)
                fn main(@builtin(global_invocation_id) id: vec3<u32>) {
                    let first = id.x * 32u;
                    if (first >= config.count) { return; }
                    var mask = 0u;
                    for (var bit = 0u; bit < 32u; bit++) {
                        let candidate = first + bit;
                        if (candidate >= config.count) { break; }
                        let index = candidate * config.stride;
                        var value = source[index];
                        if (config.stride == 2u) { value |= source[index + 1u]; }
                        if (value != 0u) { mask |= 1u << bit; }
                    }
                    bits[id.x] = mask;
                }
            ` });
            const packPipeline = device.createComputePipeline({ layout: 'auto', compute: { module: packModule, entryPoint: 'main' } });
            const bitBuffer = device.createBuffer({ size: GPU_BATCH_SIZE / 8, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
            const packUniform = device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
            function packAndCopy(encoder, source, target, count, stride) {
                device.queue.writeBuffer(packUniform, 0, new Uint32Array([count, stride]));
                const bind = device.createBindGroup({ layout: packPipeline.getBindGroupLayout(0), entries: [
                    { binding: 0, resource: { buffer: source } },
                    { binding: 1, resource: { buffer: bitBuffer } },
                    { binding: 2, resource: { buffer: packUniform } }
                ] });
                const pack = encoder.beginComputePass();
                pack.setPipeline(packPipeline);
                pack.setBindGroup(0, bind);
                pack.dispatchWorkgroups(Math.ceil(count / (32 * 64)));
                pack.end();
                encoder.copyBufferToBuffer(bitBuffer, 0, target, 0, Math.ceil(count / 32) * 4);
            }


            // One small base table per run. Records: p, 2^32 mod p, low/high p^2.
            function baseRecords(limit) {
                const composite = new Uint8Array(limit + 1), values = [];
                for (let p = 2; p <= limit; p++) {
                    if (composite[p]) continue;
                    if (p * p <= limit) for (let n = p*p; n <= limit; n += p) composite[n] = 1;
                    if (p >= 7) {const square=p*p; values.push(p,4294967296 % p,square >>> 0,Math.floor(square/4294967296));}
                }
                return new Uint32Array(values);
            }
            const baseData = baseRecords(Math.max(7,Math.floor(Math.sqrt(Number(STAGE_MAX_NUMBER)))));
            const baseBuffer = device.createBuffer({size: Math.max(16,baseData.byteLength),usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
            if (baseData.length) device.queue.writeBuffer(baseBuffer,0,baseData);

            let current = 0n;
            const max = STAGE_MAX_NUMBER;

            let initialPrimesStr = "";
            if (max >= 2n) { initialPrimesStr += "2 "; totalPrimeCount++; }
            if (max >= 3n) { initialPrimesStr += "3 "; totalPrimeCount++; }
            if (max >= 5n) { initialPrimesStr += "5 "; totalPrimeCount++; }

            if (initialPrimesStr !== "") {
                const initialU8 = new TextEncoder().encode(initialPrimesStr);
                if (useRealtimeSave && writableStream) {
                    await writableStream.write(initialU8);
                } else {
                    accumulatedPrimesBlobs.push(new Blob([initialU8], { type: 'text/plain' }));
                }
            }

            const outputBuf32 = device.createBuffer({ size: GPU_BATCH_SIZE * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
            const readBuf32 = [
                device.createBuffer({ size: GPU_BATCH_SIZE / 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }),
                device.createBuffer({ size: GPU_BATCH_SIZE / 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST })
            ];
            const uniformBuf32 = device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

            const outputBuf64 = device.createBuffer({ size: GPU_BATCH_SIZE * 8, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
            const readBuf64 = [
                device.createBuffer({ size: GPU_BATCH_SIZE / 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST }),
                device.createBuffer({ size: GPU_BATCH_SIZE / 8, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST })
            ];
            const uniformBuf64 = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

            const bindGroup32 = device.createBindGroup({
                layout: pipeline32.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuf32 } }, { binding: 1, resource: { buffer: outputBuf32 } }, { binding: 2, resource: { buffer: baseBuffer } }]
            });
            const bindGroup64 = device.createBindGroup({
                layout: pipeline64.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuf64 } }, { binding: 1, resource: { buffer: outputBuf64 } }, { binding: 2, resource: { buffer: baseBuffer } }]
            });

            let formatting = Promise.resolve();
            let formattingFailure = null;
            let processedInRange = 0n;
            const MAX_PENDING_READBACKS = 2;
            const pendingReadbacks = [];
            let readbackSlot32 = 0;
            let readbackSlot64 = 0;

            function beginMappedReadback(buffer, byteLength, type, start, count) {
                return buffer.mapAsync(GPUMapMode.READ).then(() => {
                    const mapped = buffer.getMappedRange(0, byteLength);
                    const res = new Uint32Array(mapped.slice(0));
                    buffer.unmap();
                    return { type, data: res, start, count };
                });
            }

            async function drainOldestReadback() {
                if (pendingReadbacks.length === 0) return;
                const result = await pendingReadbacks.shift();
                currentRawResults.push(result);
            }

            async function drainAllReadbacks() {
                while (pendingReadbacks.length > 0) {
                    await drainOldestReadback();
                }
            }

            while (current <= max && isRunning && searchGeneration === outputGeneration) {
                const searchStepStart = performance.now();

                if (pendingReadbacks.length >= MAX_PENDING_READBACKS) {
                    await drainOldestReadback();
                }
                
                const BIT32_SAFE_ZONE = 4294967280n;
                let is64Bit = current >= BIT32_SAFE_ZONE;
                
                let processNow = Math.min(Number((max - current) * 8n / 30n) + 8, GPU_BATCH_SIZE);
                processNow = Math.ceil(processNow / 8) * 8;
                
                if (!is64Bit) {
                    let maxBlocks = (BIT32_SAFE_ZONE - current) / 30n;
                    if (BigInt(processNow / 8) > maxBlocks) {
                        processNow = Number(maxBlocks * 8n);
                        if (processNow <= 0) { 
                            is64Bit = true; 
                            processNow = Math.ceil(Math.min(Number((max - current) * 8n / 30n) + 8, GPU_BATCH_SIZE) / 8) * 8; 
                        }
                    }
                }

                if (!is64Bit) {
                    let shaderLimit = max < 4294967295n ? Number(max) : 4294967295;
                    const readBuffer = readBuf32[readbackSlot32];
                    readbackSlot32 = (readbackSlot32 + 1) % 2;

                    device.queue.writeBuffer(uniformBuf32, 0, new Uint32Array([Number(current), shaderLimit]));
                    const encoder = device.createCommandEncoder();
                    const pass = encoder.beginComputePass();
                    pass.setPipeline(pipeline32);
                    pass.setBindGroup(0, bindGroup32);
                    pass.dispatchWorkgroups(Math.ceil(processNow / 4096));
                    pass.end();
                    packAndCopy(encoder, outputBuf32, readBuffer, processNow, 1);
                    device.queue.submit([encoder.finish()]);
                    pendingReadbacks.push(beginMappedReadback(readBuffer, Math.ceil(processNow / 32) * 4, 'bits', Number(current), processNow));
                } else {
                    const startLo = Number(current & 0xFFFFFFFFn);
                    const startHi = Number(current >> 32n);
                    const maxLo = Number(max & 0xFFFFFFFFn);
                    const maxHi = Number(max >> 32n);
                    const readBuffer = readBuf64[readbackSlot64];
                    readbackSlot64 = (readbackSlot64 + 1) % 2;

                    device.queue.writeBuffer(uniformBuf64, 0, new Uint32Array([startLo, startHi, maxLo, maxHi]));
                    const encoder = device.createCommandEncoder();
                    const pass = encoder.beginComputePass();
                    pass.setPipeline(pipeline64);
                    pass.setBindGroup(0, bindGroup64);
                    pass.dispatchWorkgroups(Math.ceil(processNow / 4096));
                    pass.end();
                    packAndCopy(encoder, outputBuf64, readBuffer, processNow, 2);
                    device.queue.submit([encoder.finish()]);
                    pendingReadbacks.push(beginMappedReadback(readBuffer, Math.ceil(processNow / 32) * 4, 'bits', Number(current), processNow));
                }

                totalSearchTime += (performance.now() - searchStepStart);
                
                const rangeSize = BigInt(processNow) / 8n * 30n;
                processedInRange += rangeSize;
                current += rangeSize;
                updateUIProgress(current, max);

                if (processedInRange >= BigInt(SAVE_CHUNK_SIZE) || current > max) {
                    const drainStart = performance.now();
                    if (pendingReadbacks.length > 0) {
                        currentStage.textContent = "等待 GPU 回读中...";
                        await drainAllReadbacks();
                    }
                    totalSearchTime += (performance.now() - drainStart);

                    currentStage.textContent = "多线程转换与整理中...";
                    await formatting;
                    if (formattingFailure) throw formattingFailure;
                    if (!isRunning || searchGeneration !== outputGeneration) break;
                    const ready = currentRawResults;
                    currentRawResults = [];
                    formatting = parallelFormatAndFlush(ready).catch(error => { formattingFailure = error; });
                    processedInRange = 0n;
                    if (isRunning) currentStage.textContent = "并行查找 (GPU 分段筛)";
                }
            }

            if (!isRunning && pendingReadbacks.length > 0) {
                try { await drainAllReadbacks(); } catch (e) { console.warn("停止后清理回读失败:", e); }
            }

            await formatting;
            if (formattingFailure) throw formattingFailure;
            if (isRunning && searchGeneration === outputGeneration) finish();
        }

        async function parallelFormatAndFlush(results) {
            const generation = outputGeneration;
            if (results.length === 0) return;

            const numWorkers = navigator.hardwareConcurrency || 4;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);

            const tempResults = new Array(numWorkers).fill(null);
            const tempCounts = new Array(numWorkers).fill(0);
            
            const promises = [];
            const itemsPerWorker = Math.ceil(results.length / numWorkers);

            for (let i = 0; i < numWorkers; i++) {
                const batch = results.slice(i * itemsPerWorker, (i + 1) * itemsPerWorker);
                if (batch.length === 0) continue;

                promises.push(new Promise(resolve => {
                    const w = new Worker(workerUrl);
                    const workerIndex = i;
                    const cancel = () => { w.terminate(); resolve(); };
                    pendingFormatCancels.add(cancel);
                    
                    w.onmessage = (e) => {
                        pendingFormatCancels.delete(cancel);
                        tempResults[workerIndex] = e.data.buffer;
                        tempCounts[workerIndex] = e.data.count;
                        w.terminate();
                        resolve();
                    };
                    
                    const transferList = [];
                    for (const item of batch) {
                        transferList.push(item.data.buffer);
                    }
                    
                    w.postMessage({ batches: batch, index: workerIndex }, transferList);
                }));
            }

            await Promise.all(promises);
            if (generation !== outputGeneration) { URL.revokeObjectURL(workerUrl); return; }
            
            for (let i = 0; i < tempResults.length; i++) {
                if (tempResults[i] && tempCounts[i] > 0) {
                    const u8arr = new Uint8Array(tempResults[i]);
                    
                    if (generation !== outputGeneration) break;
                    if (useRealtimeSave && writableStream) {
                        await writableStream.write(u8arr);
                    } else {
                        accumulatedPrimesBlobs.push(new Blob([u8arr], { type: 'text/plain' }));
                    }
                    totalPrimeCount += tempCounts[i];
                }
            }

            results = [];
            URL.revokeObjectURL(workerUrl);
        }

        function updateUIProgress(cur, max) {
            let displayCur = Number(cur > max ? max : cur);
            let numMax = Number(max);

            function getEffort(x) {
                if (x <= 2) return 0;
                const I = (n) => n * Math.log(n) - n;
                const T1 = 4294967280;
                const M1 = 1.0;
                const M2 = 3.5;
                if (x <= T1) {
                    return M1 * I(x);
                } else {
                    return M1 * I(T1) + M2 * (I(x) - I(T1));
                }
            }

            const currentEffort = getEffort(displayCur);
            const totalEffort = getEffort(numMax);

            let percent = 0;
            if (totalEffort > 0) {
                percent = (currentEffort / totalEffort) * 100;
            } else {
                percent = 100;
            }

            currentProgress.textContent = `${displayCur.toLocaleString()} / ${numMax.toLocaleString()}`;
            progressFill.style.width = percent.toFixed(2) + "%";
            progressFill.textContent = percent.toFixed(2) + "%";
        }

        async function finish() {
            isRunning = false;
            clearInterval(timerInterval);
            
            const wallTimeTotal = (Date.now() - startTime) / 1000;
            const searchTimeSec = totalSearchTime / 1000;
            const formatTimeSec = wallTimeTotal - searchTimeSec;

            elapsedTimeDisplay.innerHTML = `<span class="monospace-value">${wallTimeTotal.toFixed(3)}s</span>`;

            currentStage.textContent = "已完成";
            stageMessage.textContent = "✅ 计算任务已完成！结果已准备好。";
            
            window.finalPrimesContentParts = accumulatedPrimesBlobs;

            resultSummary.textContent = `共发现 ${totalPrimeCount.toLocaleString()} 个质数，总耗时 ${wallTimeTotal.toFixed(3)} 秒。`
                                      + `查找/回读累计耗时 ${searchTimeSec.toFixed(3)} 秒，`
                                      + `关键路径剩余耗时 ${formatTimeSec.toFixed(3)} 秒。`
                                      + (useRealtimeSave ? " (已通过实时落盘保存到文件)" : "");
            
            resultArea.style.display = 'block';
            stageButton.textContent = '开始计算';
            stageButton.className = 'start-btn';
            exponentInput.disabled = false;
            document.getElementById('modeSwitchButton').disabled = false;
            progressFill.style.width = "100%";
            progressFill.textContent = "100.00%";

            if (useRealtimeSave && writableStream) {
                try { await writableStream.close(); } catch(e){}
                writableStream = null;
                document.getElementById('downloadButton').style.display = 'none';
            } else {
                document.getElementById('downloadButton').style.display = 'inline-block';
            }
        }

        window.downloadPrimes = function() {
            const contentParts = window.finalPrimesContentParts;
            if (!contentParts || contentParts.length === 0) {
                alert('没有质数可以下载。');
                return;
            }

            const blob = new Blob(contentParts, { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `primes_up_to_${Number(STAGE_MAX_NUMBER).toLocaleString('en-US')}.txt`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            a.remove();
        }
    </script>
</body>
</html>
