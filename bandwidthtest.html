<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=850, user-scalable=yes">
    <title>VRAM Bandwidth Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.3px;
        }
        
        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #homeButton:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.04);
        }

        #homeButton:active {
            transform: scale(0.96);
            transition: transform 0.05s;
        }

        .gradient-text {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent; 
        }

        .container {
            max-width: 800px;
            width: 90%;
            height: 80vh;
            padding: 10px 25px 25px 25px;
            margin-top: 70px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 40px;
            width: 250px;
            font-size: 24px;
            cursor: pointer;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            transition: all 0.3s;
            font-weight: bold;
            text-shadow: none; 
            box-shadow: none;
            flex-shrink: 0;
            margin-bottom: 20px;
            align-self: center;
        }

        button:hover:not(:disabled) {
            background: #1976d2;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(33, 150, 243, 0.4);
        }

        button:disabled {
            background: #424242;
            color: #aaa;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #log {
            text-align: left;
            background: #000000;
            width: 700px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            font-family: 'Ubuntu'; 
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
            overflow-y: auto; 
            min-height: 0;
            align-self: center;
            margin-bottom: 20px;
        }

        .success { color: #4caf50; font-weight: bold; }
        .highlight { color: #ffd700; font-weight: bold; font-size: 1.1em; }
        .info { color: #64b5f6; }
        .warn { color: #ffab40; }
        .dim { color: #888; }
        .separator { border-top: 1px dashed #333; margin: 10px 0; }
    </style>
</head>
<body>

    <a href="./perftests/" id="homeButton">← Go Back</a>

    <div class="container">
        <h1 class="gradient-text" id="main-title">VRAM Bandwidth Test</h1>

        <div class="subtitle" id="main-subtitle">Test the peak bandwidth of your VRAM.</div>
        
        <button id="runBtn" onclick="runBenchmark()">Start Benchmark</button>

        <div id="log"><span class="dim">Ready to test. (128MB Buffer)</span></div>
    </div>

    <script>
    const shaderCode = `
    struct Data { values: array<vec4<f32>> };
    @group(0) @binding(0) var<storage, read> src : Data;
    @group(0) @binding(1) var<storage, read_write> dst : Data;

    @compute @workgroup_size(256)
    fn main(@builtin(global_invocation_id) global_id : vec3<u32>) {
        let index = global_id.x;
        if (index < arrayLength(&src.values)) {
            dst.values[index] = src.values[index];
        }
    }
    `;

    const logDiv = document.getElementById('log');
    function log(msg, type = 'normal') {
        const span = document.createElement('div');
        span.textContent = msg;
        span.className = type;
        logDiv.appendChild(span);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function getRobustGPUName(adapter) {
        let name = "Generic GPU";
        
        if (adapter.info && adapter.info.description && !adapter.info.description.includes("Generic")) {
            name = adapter.info.description;
        } else {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        const webglName = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        if (webglName) name = webglName; 
                    }
                }
            } catch (e) {}
        }

        if (name.startsWith("ANGLE (")) {
            let raw = name.substring(7, name.length - 1); 

            let firstComma = raw.indexOf(',');
            if (firstComma !== -1) {
                raw = raw.substring(firstComma + 1).trim();
            }

            let deviceIdIndex = raw.indexOf('(0x');
            if (deviceIdIndex !== -1) {
                name = raw.substring(0, deviceIdIndex).trim();
            } else {
                let trailerComma = raw.indexOf(',');
                if (trailerComma !== -1) {
                    name = raw.substring(0, trailerComma).trim();
                } else {
                    name = raw;
                }
            }
        }

        return name;
    }
    
    async function runBenchmark() {
        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        btn.textContent = "Running...";
        
        const sep = document.createElement('div');
        sep.className = 'separator';
        logDiv.appendChild(sep);

        try {
            if (!navigator.gpu) throw new Error("WebGPU not supported!");
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) throw new Error("No GPU adapter found.");
            const device = await adapter.requestDevice();
            
            const gpuName = getRobustGPUName(adapter);
            log(`GPU: ${gpuName}`, 'info');

            const fixedMB = 128;
            const memSize = fixedMB * 1024 * 1024;
            const vec4Size = 16; 
            const numVecs = Math.floor(memSize / vec4Size);
            const actualSize = numVecs * vec4Size;

            log(`Allocating buffers: ${(actualSize / (1024**2)).toFixed(2)} MB each...`, 'dim');

            const srcBuffer = device.createBuffer({ size: actualSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
            const dstBuffer = device.createBuffer({ size: actualSize, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });

            const shaderModule = device.createShaderModule({ code: shaderCode });
            const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module: shaderModule, entryPoint: 'main' }});
            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [ { binding: 0, resource: { buffer: srcBuffer } }, { binding: 1, resource: { buffer: dstBuffer } } ],
            });

            const workgroupSize = 256;
            const dispatchCount = Math.ceil(numVecs / workgroupSize);

            log("Running Warm-up...", 'dim');
            {
                const encoder = device.createCommandEncoder();
                const pass = encoder.beginComputePass();
                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                pass.dispatchWorkgroups(dispatchCount);
                pass.end();
                device.queue.submit([encoder.finish()]);
                await device.queue.onSubmittedWorkDone();
            }

            const calIters = 50;
            const calStart = performance.now();
            {
                const encoder = device.createCommandEncoder();
                const pass = encoder.beginComputePass();
                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                for(let i=0; i<calIters; i++) pass.dispatchWorkgroups(dispatchCount);
                pass.end();
                device.queue.submit([encoder.finish()]);
                await device.queue.onSubmittedWorkDone();
            }
            const calEnd = performance.now();
            const avgTimePerIter = (calEnd - calStart) / calIters; 
            
            let targetIters = Math.floor(5000.0 / avgTimePerIter);
            
            const MAX_ITERS = 40000;
            if (targetIters > MAX_ITERS) {
                targetIters = MAX_ITERS;
            } else if (targetIters < 100) {
                targetIters = 100; 
            }
            
            log(`Scheduled total iterations: ${targetIters}`, 'info');

            const BATCH_COUNT = 100; 
            const itersPerBatch = Math.ceil(targetIters / BATCH_COUNT);
            
            log(`Running ${BATCH_COUNT} batches (sampling peak speed)...`, 'info');

            let maxBW = 0;

            for (let b = 0; b < BATCH_COUNT; b++) {
                const encoder = device.createCommandEncoder();
                const pass = encoder.beginComputePass();
                pass.setPipeline(pipeline);
                pass.setBindGroup(0, bindGroup);
                
                for(let i=0; i<itersPerBatch; i++) {
                    pass.dispatchWorkgroups(dispatchCount);
                }
                pass.end();
                const cmdBuffer = encoder.finish();

                const t0 = performance.now();
                device.queue.submit([cmdBuffer]);
                await device.queue.onSubmittedWorkDone();
                const t1 = performance.now();

                const dt = t1 - t0; 
                const batchBytes = actualSize * 2 * itersPerBatch; 
                const batchGB = batchBytes / 1e9; 
                const currentBW = (batchGB / (dt / 1000.0)); 

                if (currentBW > maxBW) maxBW = currentBW;
            }

            log('------------------------------------------------', 'success');
            log(`Peak Bandwidth: ${maxBW.toFixed(2)} GB/s`, 'highlight');
            log(`(Sampled from best batch of ${itersPerBatch} iterations)`, 'dim');
            log('------------------------------------------------', 'success');

            srcBuffer.destroy();
            dstBuffer.destroy();

        } catch (err) {
            log(`Error: ${err.message}`, 'warn');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.textContent = "Start Benchmark";
        }
    }
    </script>
</body>
</html>
