<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test list</title>
    <link rel="stylesheet" href="./shared/nav-cards.css">
</head>
<body class="card-list-page">

    <a href="../" id="homeButton" class="home-button-interactive">← 返回主页</a>

    <div class="main-wrapper">
        <h1>选择项目</h1> 

        <div id="button-container" class="card-grid">
            <div class="tool-button" data-href="../llt" data-desc="采用主从架构的 CPU 稳定性测试工具。使用 LLT 算法验证梅森素数，以对多核处理器整数单元进行持续满载施压。">
                梅森素数检验
            </div>

            <div class="tool-button" data-href="../primenumber" data-desc="侧重于并发吞吐量的 CPU 性能测试工具。使用 Miller-Rabin 概率算法在指定的大范围内并行查找质数，以压榨处理器的整数运算能力与多线程通信效率。">
                质数查找器
            </div>

            <div class="tool-button" data-href="../raytracingcpu" data-desc="基于 SDF 光线步进算法的纯 CPU 渲染演示。利用 Web Worker 施加多核负载，直观检测处理器在浮点运算密集型任务中的多线程并发效率。受限于 CPU 架构及 JavaScript 缺乏原生 SIMD 支持，其渲染效率在原理上显著低于 GPU 或软件光栅化管线，不可与着色器版本直接对比帧数。">
                软件光线追踪
            </div>

            <div class="tool-button" data-href="../throughputtest" data-desc="评估 GPU 理论峰值算力的基准测试。使用 WebGPU 计算着色器执行超大规模的 FMA 及整数位运算，分别测试显卡在 FP16、FP32 和 INT32 数据类型下的极限吞吐量表现。（需要 WebGPU 支持）">
                GPU 算力测试
            </div>

            <div class="tool-button" data-href="../primenumbergpu" data-desc="基于 WebGPU 的大范围质数查找工具。使用 GPU 并行执行 Miller–Rabin 素性检验，并通过位图回读、多线程 Web Worker 整理和异步流水线提高整体吞吐量。（需要 WebGPU 支持）">
                GPU 质数查找器
            </div>
            
            <div class="tool-button" data-href="../raytracing" data-desc="基于 SDF 光线步进算法，完全利用着色器而非硬件光追单元实现的 GPU 实时渲染演示。场景完全由数学公式动态构建，通过运行高复杂度着色器代码，对 GPU 的浮点运算单元施加巨大压力。支持 HDR 色调映射与多档画质调节，支持 WebGL 2.0 与 WebGPU 双后端热切换，支持实时帧率显示。">
                着色器光线追踪
            </div>

            <div class="tool-button" data-href="../bandwidthtest" data-desc="评估 GPU 显存带宽的基准测试。使用 WebGPU 直接对显存执行大规模的高强度读写拷贝操作，以衡量显存峰值带宽。（需要 WebGPU 支持）">
                显存带宽测试
            </div>

            <div class="tool-button" data-href="../primenumbersieve" data-desc="使用分段筛法的 CPU 质数枚举工具。相比 Miller-Rabin 算法，更适合快速列出大范围内的全部质数，且 CPU 压力更小。">
                筛法质数查找器
            </div>

            <div class="tool-button" data-href="../primenumbergpusieve" data-desc="使用 WebGPU 分段筛法的质数枚举工具。（需要 WebGPU 支持）">
                GPU 筛法质数
            </div>

            <div class="tool-button" data-href="../burntest" data-desc="一个双烤测试。通过同时压榨 CPU 的整数和浮点算力，并给予 GPU 极高负载，以将功耗推向功耗墙。">
                极限双烤测试
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content" id="modal-box">
            <div class="modal-header" id="modal-title">标题</div>
            <div class="modal-body" id="modal-description">描述内容</div>
            <div class="modal-footer">
                <button class="modal-btn btn-cancel" id="modal-close">取消</button>
                <button class="modal-btn btn-confirm" id="modal-go">访问</button>
            </div>
        </div>
    </div>
    <script src="./shared/card-modal.js"></script>

</body>
</html>
