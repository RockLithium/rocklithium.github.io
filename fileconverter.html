<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=850, user-scalable=yes">
    <title>File to HTML Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Unispace Bd';
            src: url('./fonts/Unispace Bd.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Dempster';
            src: url('./fonts/Dempster.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
            size-adjust: 120%;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.3px;
        }

        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #homeButton:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.04);
        }

        #homeButton:active {
            transform: scale(0.96);
            transition: transform 0.05s;
        }

        #langSelectorContainer {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .lang-select {
            padding: 10px 16px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px) saturate(120%);
            -webkit-backdrop-filter: blur(20px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            transition: all 0.3s ease;
        }

        .lang-select:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-select option {
            background-color: #1a1a1a;
            color: #E0E0E0;
        }

        .container {
            max-width: 800px;
            width: 90%;
            padding: 10px 0 40px 0;
            margin-top: 70px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            font-size: 48px;
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }

        .input-title {
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            font-size: 18px;
            color: #E0E0E0;
            margin-bottom: 5px;
            text-align: left;
        }

        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 60px;
            background-color: rgba(42, 42, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .file-upload-wrapper.drag-active {
            border-color: #FF7E00;
            box-shadow: 0 0 12px rgba(255, 126, 0, 0.2);
            background-color: rgba(50, 50, 50, 1);
            border-style: dashed;
            z-index: 50;
        }

        .file-upload-wrapper.drag-active .file-upload-text {
            color: #FF7E00;
        }

        .file-upload-wrapper:hover {
            border-color: #FF7E00;
            border-style: dashed;
        }

        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 100; 
        }

        .file-upload-text {
            font-family: 'Unispace Bd', 'Dempster', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 18px;
            color: #888;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 20px;
            transition: color 0.3s;
        }

        .options-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .option-btn {
            background-color: rgba(42, 42, 42, 0.5);
            height: 50px;
            flex: 1; 
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unispace Bd', 'Dempster', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: #888888;
            border: 1px solid rgba(88, 88, 88, 0.3);
            box-sizing: border-box;
            user-select: none;
        }

        .option-btn:hover {
            border-color: #FF7E00;
            color: #E0E0E0;
        }

        .option-btn.active {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent; 
            border: 1px solid #FF7E00; 
            box-shadow: 0 0 10px rgba(255, 126, 0, 0.3); 
        }

        .option-btn.active::before {
            content: "✔ ";
            color: #FF7E00;
            margin-right: 5px;
        }

        .process-btn-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .main-btn {
            width: 100%;
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            color: #E0E0E0;
            border: none;
            border-radius: 10px;
            font-family: 'Ubuntu Condensed', "PingFang SC", sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: none; 
            box-shadow: none;
        }

        .process-button {
            background: linear-gradient(45deg, #2E8B57 0%, #3CB371 100%);
        }

        .process-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .process-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .process-button.is-processing {
            background: linear-gradient(45deg, #8B0000 0%, #B22222 100%);
            animation: pulse 2s infinite;
        }

        .process-button.is-complete {
            background: linear-gradient(45deg, #1E90FF 0%, #00BFFF 100%);
            cursor: default;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(178, 34, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0); }
        }

        .download-button {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            width: 100%;
            max-width: 600px;
        }

        .download-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .download-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .download-button:active {
            transform: scale(0.98);
        }

        .preview-box {
            background-color: #2A2A2A;
            border: 1px dashed #505050;
            border-radius: 10px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .preview-box img, .preview-box video {
            max-width: 100%;
            max-height: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .preview-box iframe {
            width: 100%;
            height: 300px;
            border: none;
            background: #fff;
        }

        .preview-placeholder {
            color: #555;
            font-family: 'Unispace Bd', 'Dempster', "PingFang SC", sans-serif;
            font-weight: bold;
            text-align: center;
        }

        .status-text {
            font-family: 'Unispace Bd', 'Dempster', "PingFang SC", sans-serif;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }

    </style>
</head>
<body>
    <a href="./tools" id="homeButton">← Go Back</a>

    <div id="langSelectorContainer">
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en-US" selected>English</option>
            <option value="zh-Hans">简体中文</option>
            <option value="fr-FR">Français</option>
            <option value="ru-RU">Русский</option>
        </select>
    </div>

    <div class="container">
        <h1 id="main-title">File to HTML Converter</h1>
        <div class="subtitle" id="main-subtitle">Pack any file into a single HTML file for local viewing.</div>
        
        <div class="input-group">
            <div class="input-title" id="label-select-file">SELECT FILE</div>
            <div class="file-upload-wrapper" id="dropZone">
                <span class="file-upload-text" id="fileNameDisplay">Click or drop file here...</span>
                <input type="file" id="fileInput">
            </div>
            <div class="status-text" id="statusText">Waiting for input...</div>
        </div>

        <div class="input-group" style="margin-bottom: 10px;">
            <div class="input-title" id="label-options">PROCESSING OPTIONS</div>
            <div class="options-grid">
                <div class="option-btn" id="optDownload">Add Download Button</div>
                <div class="option-btn" id="optFPS">Add FPS Display</div>
            </div>
        </div>

        <div class="process-btn-container">
            <button id="processBtn" class="main-btn process-button" disabled>Start Processing</button>
        </div>

        <div class="input-group">
            <div class="input-title" id="label-preview">PREVIEW</div>
            <div class="preview-box" id="previewArea">
                <span class="preview-placeholder" id="preview-placeholder-text">No file loaded</span>
            </div>
        </div>

        <div class="input-group" style="text-align: center;">
            <button id="downloadBtn" class="main-btn download-button" disabled>DOWNLOAD HTML</button>
        </div>
    </div>

    <script>
        let currentLang = 'en-US';
        const translations = {
            'en-US': {
                goBack: "← Go Back",
                title: "File to HTML Converter",
                subtitle: "Pack any file into a single HTML file for local viewing.",
                selectFile: "SELECT FILE",
                dropText: "Click or drop file here...",
                options: "PROCESSING OPTIONS",
                optBtnDl: "Add Download Button",
                optBtnFps: "Add FPS Display",
                startProc: "Start Processing",
                stopProc: "Stop Processing",
                procComp: "Processing Complete",
                preview: "PREVIEW",
                noFile: "No file loaded",
                dlHtml: "DOWNLOAD HTML",
                dlFile: "DOWNLOAD FILE",
                waitInput: "Waiting for input...",
                selected: "Selected: ",
                period: ".",
                converting: "Converting file... Please wait.",
                convComplete: "Conversion complete.",
                errRead: "Error reading file.",
                procAborted: "Processing aborted.",
                optChanged: "Options changed. Please re-process.",
                unsupported: "Unsupported Format.<br>Preview skipped.",
                errLarge: "File too large to generate HTML download.",
                pdfNoInline: "PDF cannot be displayed inline.",
                loading: "Loading...",
                fpsPaused: "FPS: Paused",
                fpsEnded: "FPS: Ended",
                fpsBuffering: "FPS: Buffering",
                unsupportedTitle: "Unsupported Format"
            },
            'zh-Hans': {
                goBack: "← 返回",
                title: "文件转 HTML 转换器",
                subtitle: "将文件打包成 HTML 文件以供本地浏览。",
                selectFile: "选择文件",
                dropText: "点击选择或拖拽文件至此...",
                options: "处理选项",
                optBtnDl: "添加下载按钮",
                optBtnFps: "添加 FPS 显示",
                startProc: "开始转换",
                stopProc: "停止转换",
                procComp: "转换完成",
                preview: "预览",
                noFile: "未加载文件",
                dlHtml: "下载 HTML 文件",
                dlFile: "下载源文件",
                waitInput: "等待输入文件...",
                selected: "已选择：",
                period: "。",
                converting: "文件转换中，请稍候...",
                convComplete: "转换完成。",
                errRead: "读取文件错误。",
                procAborted: "处理已中止。",
                optChanged: "选项已更改。请重新处理。",
                unsupported: "不支持的格式。<br>跳过预览。",
                errLarge: "文件过大，无法生成 HTML 下载。",
                pdfNoInline: "PDF 无法直接显示。",
                loading: "加载中...",
                fpsPaused: "FPS: 已暂停",
                fpsEnded: "FPS: 已结束",
                fpsBuffering: "FPS: 缓冲中",
                unsupportedTitle: "不支持的格式"
            },
            'fr-FR': {
                goBack: "← Retour",
                title: "Convertisseur de fichier en HTML",
                subtitle: "Encapsulez n'importe quel fichier dans un HTML pour une lecture locale.",
                selectFile: "CHOISIR UN FICHIER",
                dropText: "Cliquez ou glissez le fichier ici...",
                options: "OPTIONS DE TRAITEMENT",
                optBtnDl: "Bouton de téléchargement",
                optBtnFps: "Affichage des FPS",
                startProc: "Lancer la conversion",
                stopProc: "Arrêter",
                procComp: "Terminé",
                preview: "APERÇU",
                noFile: "Aucun fichier",
                dlHtml: "TÉLÉCHARGER L'HTML",
                dlFile: "TÉLÉCHARGER LE FICHIER",
                waitInput: "En attente d'un fichier...",
                selected: "Sélectionné : ",
                period: ".",
                converting: "Conversion en cours...",
                convComplete: "Conversion réussie.",
                errRead: "Erreur de lecture.",
                procAborted: "Annulé.",
                optChanged: "Options modifiées. Relancer?",
                unsupported: "Format non supporté.<br>Aperçu ignoré.",
                errLarge: "Fichier trop volumineux.",
                pdfNoInline: "L'affichage PDF n'est pas possible ici.",
                loading: "Chargement...",
                fpsPaused: "FPS : En pause",
                fpsEnded: "FPS : Fin",
                fpsBuffering: "FPS : Buffer",
                unsupportedTitle: "Format non supporté"
            },
            'ru-RU': {
                goBack: "← Назад",
                title: "Конвертер файлов в HTML",
                subtitle: "Упакуйте любой файл в HTML для локального просмотра.",
                selectFile: "ВЫБРАТЬ ФАЙЛ",
                dropText: "Нажмите или перетащите файл...",
                options: "НАСТРОЙКИ ОБРАБОТКИ",
                optBtnDl: "Кнопка скачивания",
                optBtnFps: "Показать FPS",
                startProc: "Запустить",
                stopProc: "Остановить",
                procComp: "Готово",
                preview: "ПРЕДПРОСМОТР",
                noFile: "Файл не выбран",
                dlHtml: "СКАЧАТЬ HTML",
                dlFile: "СКАЧАТЬ ФАЙЛ",
                selected: "Выбрано: ",
                period: ".",
                waitInput: "Ожидание файла...",
                converting: "Преобразование...",
                convComplete: "Готово.",
                errRead: "Ошибка чтения.",
                procAborted: "Отменено.",
                optChanged: "Настройки изменены.",
                unsupported: "Формат не поддерживается.<br>Предпросмотр пропущен.",
                errLarge: "Файл слишком велик.",
                pdfNoInline: "PDF нельзя просмотреть здесь.",
                loading: "Загрузка...",
                fpsPaused: "FPS: Пауза",
                fpsEnded: "FPS: Завершено",
                fpsBuffering: "FPS: Буфер",
                unsupportedTitle: "Не поддерживается"
            }
        };

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        const previewArea = document.getElementById('previewArea');
        const processBtn = document.getElementById('processBtn');
        const optDownload = document.getElementById('optDownload');
        const optFPS = document.getElementById('optFPS');

        let loadedDataURI = null; 
        let originalFileName = "";
        let fileType = "";
        let selectedFile = null;
        let fileReader = null;
        let isProcessing = false;
        let currentObjectUrl = null; 
        let forceTextMode = false;

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            if (!t) return;

            document.getElementById('homeButton').textContent = t.goBack;
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('main-subtitle').textContent = t.subtitle;
            document.getElementById('label-select-file').textContent = t.selectFile;
            document.getElementById('label-options').textContent = t.options;
            document.getElementById('label-preview').textContent = t.preview;
            document.getElementById('optDownload').textContent = t.optBtnDl;
            document.getElementById('optFPS').textContent = t.optBtnFps;
            downloadBtn.textContent = t.dlHtml;
            
            const placeholder = document.getElementById('preview-placeholder-text');
            if (placeholder) placeholder.textContent = t.noFile;
            
            const unsupportedText = previewArea.querySelector('.preview-placeholder');
            if (unsupportedText && selectedFile) {
                const check = checkFileSupport(selectedFile.name, selectedFile.type);
                if (check.mode === 'unsupported') unsupportedText.innerHTML = t.unsupported;
            }

            if (!selectedFile) {
                fileNameDisplay.textContent = t.dropText;
                statusText.textContent = t.waitInput;
                processBtn.textContent = t.startProc;
            } else if (isProcessing) {
                statusText.textContent = t.converting;
                processBtn.textContent = t.stopProc;
            } else if (loadedDataURI) {
                statusText.textContent = t.convComplete;
                processBtn.textContent = t.procComp;
            } else {
                const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(2);
                statusText.textContent = `${t.selected}${selectedFile.name} (${sizeMB} MB)${t.period}`;
                processBtn.textContent = t.startProc;
            }

            resetUIOnOptionChange();
        }

        function resetUIOnOptionChange() {
            const t = translations[currentLang];
            if (loadedDataURI || isProcessing || processBtn.className.includes('is-complete')) {
                loadedDataURI = null;
                isProcessing = false;
                downloadBtn.disabled = true;
                processBtn.textContent = t.startProc;
                processBtn.className = "main-btn process-button";
                processBtn.disabled = (selectedFile === null);
                statusText.textContent = t.optChanged;
            }
        }

        optDownload.addEventListener('click', () => {
            optDownload.classList.toggle('active');
            resetUIOnOptionChange();
        });
        optFPS.addEventListener('click', () => {
            optFPS.classList.toggle('active');
            resetUIOnOptionChange();
        });

        let dragCounter = 0; 
        dropZone.addEventListener('dragenter', (e) => { e.preventDefault(); e.stopPropagation(); dragCounter++; dropZone.classList.add('drag-active'); }, false);
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); if (!dropZone.classList.contains('drag-active')) dropZone.classList.add('drag-active'); }, false);
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); e.stopPropagation(); dragCounter--; if (dragCounter <= 0) { dropZone.classList.remove('drag-active'); dragCounter = 0; } }, false);
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation(); dragCounter = 0; dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
        }, false);

        function checkFileSupport(filename, type) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'dng') return { mode: 'unsupported' };
            const textExts = ['txt', 'json', 'py', 'js', 'html', 'css', 'md', 'xml', 'log', 'c', 'cpp', 'h', 'java', 'sql', 'bat', 'sh', 'ini', 'yaml'];
            if (textExts.includes(ext) || (type && type.startsWith('text/'))) return { mode: 'text' };
            const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'ico', 'avif'];
            if (imgExts.includes(ext) || (type && type.startsWith('image/'))) return { mode: 'image' };
            const audExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'weba'];
            if (audExts.includes(ext) || (type && type.startsWith('audio/'))) return { mode: 'audio' };
            const vidExts = ['mp4', 'webm', 'ogv', 'mov']; 
            if (vidExts.includes(ext) || (type && (type === 'video/mp4' || type === 'video/webm'))) return { mode: 'video' };
            if (ext === 'pdf' || type === 'application/pdf') return { mode: 'pdf' };
            return { mode: 'unsupported' };
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const t = translations[currentLang];
            selectedFile = file;
            originalFileName = file.name;
            fileType = file.type || "application/octet-stream";
            const check = checkFileSupport(originalFileName, fileType);
            const mode = check.mode;
            forceTextMode = (mode === 'text');
            fileNameDisplay.textContent = file.name;
            fileNameDisplay.style.color = "#E0E0E0";
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            statusText.textContent = `${t.selected}${file.name} (${sizeMB} MB)${t.period}`;
            resetProcessButton();
            processBtn.disabled = false;
            downloadBtn.disabled = true;
            loadedDataURI = null; 
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(file);
            previewArea.innerHTML = '';
            if (mode === 'unsupported') {
                let icon = "📄";
                if (originalFileName.match(/\.(xls|xlsx|csv)$/i)) icon = "📊";
                if (originalFileName.match(/\.(ppt|pptx)$/i)) icon = "📽️";
                if (originalFileName.match(/\.(zip|rar|7z)$/i)) icon = "📦";
                previewArea.innerHTML = `<div style="text-align:center;"><div style="font-size:40px;">${icon}</div><br><span class="preview-placeholder">${t.unsupported}</span></div>`;
            } else if (mode === 'image') {
                const img = document.createElement('img'); img.src = currentObjectUrl; previewArea.appendChild(img);
            } else if (mode === 'video') {
                const video = document.createElement('video'); video.src = currentObjectUrl; video.controls = true; video.style.maxWidth = "100%"; previewArea.appendChild(video);
            } else if (mode === 'audio') {
                const audio = document.createElement('audio'); audio.src = currentObjectUrl; audio.controls = true; audio.style.width = "90%"; audio.style.height = "50px"; audio.style.marginTop = "10px";
                const wrapper = document.createElement('div'); wrapper.style.textAlign = "center"; wrapper.style.width = "100%"; wrapper.innerHTML = `<div style="font-size:48px; margin-bottom:5px;">🎵</div>`; wrapper.appendChild(audio); previewArea.appendChild(wrapper);
            } else if (mode === 'pdf') {
                const iframe = document.createElement('iframe'); iframe.src = currentObjectUrl; previewArea.appendChild(iframe);
            } else if (mode === 'text') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const pre = document.createElement('pre');
                    pre.style.cssText = "text-align:left; width:100%; height:300px; overflow:auto; background:#000; color:#FFF; padding:15px; font-family:sans-serif; font-size:14px; white-space:pre-wrap; margin:0; border:none;";
                    pre.textContent = e.target.result; previewArea.appendChild(pre);
                };
                reader.readAsText(file);
            }
        });

        processBtn.addEventListener('click', function() { if (isProcessing) stopProcessing(); else if (selectedFile) startProcessing(); });

        function startProcessing() {
            if (!selectedFile) return;
            const t = translations[currentLang];
            isProcessing = true;
            fileReader = new FileReader();
            processBtn.textContent = t.stopProc;
            processBtn.className = "main-btn process-button is-processing";
            statusText.textContent = t.converting;
            downloadBtn.disabled = true;
            fileReader.onload = function(readerEvent) {
                let result = readerEvent.target.result;
                if (forceTextMode && !result.startsWith('data:text/')) { const base64Data = result.split(',')[1]; result = `data:text/plain;base64,${base64Data}`; }
                loadedDataURI = result;
                finishProcessing(true);
            };
            fileReader.onerror = () => { statusText.textContent = t.errRead; finishProcessing(false); };
            fileReader.onabort = () => { statusText.textContent = t.procAborted; resetProcessButton(); processBtn.disabled = false; };
            fileReader.readAsDataURL(selectedFile);
        }

        function stopProcessing() { if (fileReader) fileReader.abort(); isProcessing = false; }
        
        function finishProcessing(success) {
            const t = translations[currentLang];
            isProcessing = false;
            if (success) {
                statusText.textContent = t.convComplete;
                processBtn.textContent = t.procComp;
                processBtn.className = "main-btn process-button is-complete";
                downloadBtn.disabled = false;
                downloadBtn.textContent = t.dlHtml;
            } else { resetProcessButton(); processBtn.disabled = false; }
        }

        function resetProcessButton() {
            const t = translations[currentLang];
            isProcessing = false; processBtn.textContent = t.startProc; processBtn.className = "main-btn process-button"; processBtn.disabled = true;
        }

        downloadBtn.addEventListener('click', function() {
            if (!loadedDataURI) return;
            const t = translations[currentLang];
            const includeDownload = optDownload.classList.contains('active');
            const includeFPS = optFPS.classList.contains('active');
            const check = checkFileSupport(originalFileName, fileType);
            const mode = check.mode;
            const isVideo = (mode === 'video');

            const htmlHead = `<!DOCTYPE html>
<html lang="${currentLang}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>${originalFileName}</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0e0e0e; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #mediaContent { width: 100%; height: 100%; object-fit: contain; }
        iframe { width: 100vw; height: 100vh; border: none; background: #fff; }
        .unsupported-box { text-align: center; color: #E0E0E0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .unsupported-box .icon { font-size: 60px; margin-bottom: 10px; } 
        .fallback-btn { 
            display: inline-block; 
            margin-top: 15px; 
            color: #FF7E00; 
            border: 1px solid #FF7E00; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-family: "PingFang SC", sans-serif;
            transition: 0.2s; 
            text-transform: uppercase; 
        }
        .fallback-btn:hover { background: rgba(255, 126, 0, 0.2); }
        .overlay-container {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, auto));
            gap: 15px;
            pointer-events: none;
            justify-content: space-between;
        }
        .info-box {
            pointer-events: auto;
            background-color: rgba(0, 0, 0, 0.6);
            color: #FFFFFF;
            padding: 0 15px;
            height: 44px; 
            border-radius: 10px;
            font-family: "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(5px);
            white-space: nowrap;
            box-sizing: border-box;
            width: 100%;
        }
        #dl-btn { border-color: #fff; transition: 0.3s; }
        #dl-btn:hover { background-color: rgba(0, 0, 0, 0.9); border-color: #007bff; }
        @media (max-width: 600px) { .overlay-container { grid-template-columns: 1fr; justify-content: start; width: auto; } }
    </style>
</head>
<body>`;

            let overlayHTML = '';
            if (mode !== 'unsupported' && (includeFPS || includeDownload)) {
                overlayHTML = `<div class="overlay-container">`;
                if (includeFPS) overlayHTML += `<div class="info-box" id="fps-display">FPS: --</div>`;
                if (includeDownload) overlayHTML += `<a id="dl-overlay-btn" download="${originalFileName}" class="info-box" id="dl-btn" style="cursor:pointer">${t.dlFile}</a>`;
                overlayHTML += `</div>`;
            }

            let scriptContent = `
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const media = document.getElementById('mediaContent');
                    const dlBtn = document.getElementById('dl-overlay-btn');
                    
                    if (dlBtn) {
                        if (media && media.src) {
                            dlBtn.href = media.src;
                        } else if (document.getElementById('code-data-holder')) {
                            dlBtn.href = document.getElementById('code-data-holder').getAttribute('data-src');
                        } else if (document.querySelector('object')) {
                            dlBtn.href = document.querySelector('object').data;
                        }
                    }

                    if (media && media.tagName === 'IMG') {
                        let zoomed = false;
                        media.style.cursor = 'zoom-in';
                        media.addEventListener('click', () => {
                            zoomed = !zoomed;
                            media.style.maxWidth = zoomed ? 'none' : '100%';
                            media.style.maxHeight = zoomed ? 'none' : '100vh';
                            media.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
                        });
                    }

                    if (document.getElementById('codeContent')) {
                        const dataURI = document.getElementById('code-data-holder').getAttribute('data-src');
                        fetch(dataURI)
                            .then(r => r.text())
                            .then(text => document.getElementById('codeContent').textContent = text)
                            .catch(e => document.getElementById('codeContent').textContent = "Error displaying text.");
                    }

                    ${includeFPS ? `
                    const fpsDisplay = document.getElementById('fps-display');
                    let lastTime = performance.now();
                    let frameCount = 0;
                    const UPDATE_INTERVAL = 250; 

                    function updateDisplay(fps, textOverride) {
                        if (!fpsDisplay) return;
                        if (textOverride) fpsDisplay.textContent = textOverride;
                        else fpsDisplay.textContent = 'FPS: ' + fps.toFixed(1);
                    }

                    ${isVideo ? `
                    if (media && 'requestVideoFrameCallback' in media) {
                        let videoHandle = null;
                        const onFrame = (now, meta) => {
                            frameCount++;
                            const elapsed = now - lastTime;
                            if (elapsed >= UPDATE_INTERVAL) {
                                const fps = (frameCount * 1000) / elapsed;
                                updateDisplay(fps);
                                frameCount = 0;
                                lastTime = now;
                            }
                            videoHandle = media.requestVideoFrameCallback(onFrame);
                        };
                        media.addEventListener('play', () => { if (videoHandle) media.cancelVideoFrameCallback(videoHandle); frameCount = 0; lastTime = performance.now(); videoHandle = media.requestVideoFrameCallback(onFrame); });
                        media.addEventListener('pause', () => { if (videoHandle) media.cancelVideoFrameCallback(videoHandle); videoHandle = null; updateDisplay(0, '${t.fpsPaused}'); });
                        media.addEventListener('ended', () => { if (videoHandle) media.cancelVideoFrameCallback(videoHandle); videoHandle = null; updateDisplay(0, '${t.fpsEnded}'); });
                        media.addEventListener('waiting', () => { updateDisplay(0, '${t.fpsBuffering}'); });
                    } else { updateDisplay(0, 'FPS: N/A'); }
                    ` : `
                    const loop = (now) => {
                        frameCount++;
                        const elapsed = now - lastTime;
                        if (elapsed >= UPDATE_INTERVAL) {
                            const fps = (frameCount * 1000) / elapsed;
                            updateDisplay(fps);
                            frameCount = 0;
                            lastTime = now;
                        }
                        requestAnimationFrame(loop);
                    };
                    requestAnimationFrame(loop);
                    `}
                    ` : ''} 
                });
            <\/script>
</body>
</html>`;

            let blobParts = [];
            if (mode === 'unsupported') {
                 blobParts = [htmlHead, `<div class="unsupported-box"><div class="icon">📄</div><p style="font-size:24px; font-weight:bold; margin: 2px 0;">${t.unsupportedTitle}</p><p style="color:#888; margin: 2px 0;">${originalFileName}</p><a href="`, loadedDataURI, `" download="${originalFileName}" class="fallback-btn">${t.dlFile}</a></div>`, overlayHTML, scriptContent];
            } else if (mode === 'image') {
                blobParts = [htmlHead, `<img id="mediaContent" src="`, loadedDataURI, `" alt="Image">`, overlayHTML, scriptContent];
            } else if (mode === 'video') {
                blobParts = [htmlHead, `<video id="mediaContent" src="`, loadedDataURI, `" controls autoplay loop playsinline></video>`, overlayHTML, scriptContent];
            } else if (mode === 'audio') {
                blobParts = [htmlHead, `<div style="text-align:center; width: 100%;"><div style="font-size:80px; margin-bottom:20px;">🎵</div><audio id="mediaContent" controls src="`, loadedDataURI, `" style="width:80%; max-width:800px; display:block; margin: 20px auto;"></audio></div>`, overlayHTML, scriptContent];
            } else if (mode === 'pdf') {
                blobParts = [htmlHead, `<object data="`, loadedDataURI, `" type="application/pdf" style="width:100vw; height:100vh;"><div class="unsupported-box"><p>${t.pdfNoInline}</p><a href="`, loadedDataURI, `" download="${originalFileName}" class="fallback-btn">${t.dlFile}</a></div></object>`, overlayHTML, scriptContent];
            } else if (mode === 'text') {
                blobParts = [htmlHead, `<div id="code-data-holder" data-src="`, loadedDataURI, `" style="display:none;"></div><div style="width:100%; height:100vh; overflow:auto; background:#000; color:#FFF; padding:20px; box-sizing:border-box;"><pre id="codeContent" style="white-space:pre-wrap; word-wrap:break-word; font-family:sans-serif; font-size:16px; margin:0;">${t.loading}</pre></div>`, overlayHTML, scriptContent];
            }

            try {
                const blob = new Blob(blobParts, {type: 'text/html'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `View_${originalFileName}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (e) { alert(t.errLarge); }
        });

        changeLanguage('en-US');
    </script>
</body>
</html>
