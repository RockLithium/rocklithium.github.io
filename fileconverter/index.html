<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File to HTML Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Unispace Custom';
            src: url('Unispace Bd.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }
        body {
            background-color: #1a1a1a;
            color: #E0E0E0;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu Condensed', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 16px;
            color: #e0e0e0;
            background-color: #2A2A2A;
            border: 0.5px solid #505050;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            z-index: 100;
        }
        #homeButton:hover {
            background-color: #333333;
            border-color: #FF7E00;
            box-shadow: 0 0 5px rgba(255, 126, 0, 0.5);
        }
        h1 {
            font-family: 'Ubuntu Condensed', sans-serif;
            font-size: 44px;
            text-align: center;
            margin-bottom: 10px;
            margin-top: 0;
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
        .subtitle {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }
        .container {
            max-width: 800px;
            width: 90%;
            padding: 20px;
            margin-top: 50px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            position: relative;
        }
        .input-group {
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }
        .input-title {
            font-family: 'Ubuntu Condensed', sans-serif;
            font-size: 18px;
            color: #E0E0E0;
            margin-bottom: 5px;
            text-align: left;
        }
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 60px;
            background-color: #2A2A2A;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            border: 2px solid transparent;
        }
        .file-upload-wrapper.drag-active {
            background-color: #333;
            border-color: #FF7E00;
            border-style: dashed;
            box-shadow: 0 0 15px rgba(255, 126, 0, 0.3);
            z-index: 50;
        }
        .file-upload-wrapper.drag-active .file-upload-text {
            color: #FF7E00;
        }
        .file-upload-wrapper:hover {
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
        }
        .file-upload-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 100; 
        }
        .file-upload-text {
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 18px;
            color: #888;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 20px;
            transition: color 0.3s;
        }
        .options-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .option-btn {
            background-color: #2A2A2A;
            height: 50px;
            flex: 1; 
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            font-size: 16px;
            color: #888;
            border: 0.5px solid #555;
            transition: all 0.2s;
            user-select: none;
        }
        .option-btn:hover {
            border-color: #888;
        }
        .option-btn.active {
            background: #222;
            border-color: #FF7E00;
            color: #E0E0E0;
            box-shadow: 0 0 8px rgba(255, 126, 0, 0.3);
            text-shadow: 0 0 1px #FF7E00;
        }
        .option-btn.active::before {
            content: "✔ ";
            color: #FF7E00;
            margin-right: 5px;
        }
        .process-btn-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        .main-btn {
            width: 100%;
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            color: #E0E0E0;
            border: none;
            border-radius: 4px;
            font-family: 'Ubuntu Condensed', sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: none; 
            box-shadow: none;
        }
        .process-button {
            background: linear-gradient(45deg, #2E8B57 0%, #3CB371 100%);
        }
        .process-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .process-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .process-button.is-processing {
            background: linear-gradient(45deg, #8B0000 0%, #B22222 100%);
            animation: pulse 2s infinite;
        }
        .process-button.is-complete {
            background: linear-gradient(45deg, #1E90FF 0%, #00BFFF 100%);
            cursor: default;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(178, 34, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0); }
        }
        .download-button {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            width: 100%;
            max-width: 600px;
        }
        .download-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .download-button:active {
            transform: scale(0.98);
        }
        .preview-box {
            background-color: #2A2A2A;
            border: 1px dashed #505050;
            border-radius: 4px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        .preview-box img, .preview-box video {
            max-width: 100%;
            max-height: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .preview-box iframe {
            width: 100%;
            height: 300px;
            border: none;
            background: #fff;
        }
        .preview-placeholder {
            color: #555;
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            text-align: center;
        }
        .status-text {
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }
        @media (max-width: 820px) {
            #homeButton {
                top: 10px;
                left: 10px;
                padding: 8px 12px;
            }
            h1 {
                font-size: 36px;
                margin-top: 20px;
            }
            .container {
                margin-top: 40px;
            }
            .main-btn {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" id="homeButton">← Go Back</a>
    <div class="container">
        <h1>File to HTML Converter</h1>
        <div class="subtitle">Pack any file into a single HTML file for local viewing.</div>
        <div class="input-group">
            <div class="input-title">SELECT FILE</div>
            <div class="file-upload-wrapper" id="dropZone">
                <span class="file-upload-text" id="fileNameDisplay">Click or Drop file here...</span>
                <input type="file" id="fileInput">
            </div>
            <div class="status-text" id="statusText">Waiting for input...</div>
        </div>
        <div class="input-group" style="margin-bottom: 10px;">
            <div class="input-title">PROCESSING OPTIONS</div>
            <div class="options-grid">
                <div class="option-btn" id="optDownload">Add Download Button</div>
                <div class="option-btn" id="optFPS">Add FPS Display</div>
            </div>
        </div>
        <div class="process-btn-container">
            <button id="processBtn" class="main-btn process-button" disabled>Start Processing</button>
        </div>
        <div class="input-group">
            <div class="input-title">PREVIEW</div>
            <div class="preview-box" id="previewArea">
                <span class="preview-placeholder">No file loaded</span>
            </div>
        </div>
        <div class="input-group" style="text-align: center;">
            <button id="downloadBtn" class="main-btn download-button" disabled>DOWNLOAD HTML</button>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('statusText');
        const previewArea = document.getElementById('previewArea');
        const processBtn = document.getElementById('processBtn');
        const optDownload = document.getElementById('optDownload');
        const optFPS = document.getElementById('optFPS');
        
        let loadedDataURI = null; 
        let originalFileName = "";
        let fileType = "";
        let selectedFile = null;
        let fileReader = null;
        let isProcessing = false;
        let currentObjectUrl = null; 
        let forceTextMode = false;

        function resetUIOnOptionChange() {
            if (loadedDataURI || isProcessing || processBtn.textContent === "PROCESSING COMPLETE") {
                loadedDataURI = null;
                isProcessing = false;
                downloadBtn.disabled = true;
                processBtn.textContent = "START PROCESSING";
                processBtn.className = "main-btn process-button";
                processBtn.disabled = false;
                statusText.textContent = "Options changed. Please re-process.";
            }
        }

        optDownload.addEventListener('click', () => {
            optDownload.classList.toggle('active');
            resetUIOnOptionChange();
        });
        optFPS.addEventListener('click', () => {
            optFPS.classList.toggle('active');
            resetUIOnOptionChange();
        });

        let dragCounter = 0; 
        dropZone.addEventListener('dragenter', (e) => {
            e.preventDefault(); e.stopPropagation(); dragCounter++; dropZone.classList.add('drag-active');
        }, false);
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault(); e.stopPropagation();
            if (!dropZone.classList.contains('drag-active')) dropZone.classList.add('drag-active');
        }, false);
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault(); e.stopPropagation(); dragCounter--;
            if (dragCounter <= 0) { dropZone.classList.remove('drag-active'); dragCounter = 0; }
        }, false);
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); e.stopPropagation(); dragCounter = 0; dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileInput.dispatchEvent(new Event('change'));
            }
        }, false);

        function checkFileSupport(filename, type) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'dng') return { mode: 'unsupported' };
            const textExts = ['txt', 'json', 'py', 'js', 'html', 'css', 'md', 'xml', 'log', 'c', 'cpp', 'h', 'java', 'sql', 'bat', 'sh', 'ini', 'yaml'];
            if (textExts.includes(ext) || (type && type.startsWith('text/'))) return { mode: 'text' };
            const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'ico', 'avif'];
            if (imgExts.includes(ext) || (type && type.startsWith('image/'))) return { mode: 'image' };
            const audExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'weba'];
            if (audExts.includes(ext) || (type && type.startsWith('audio/'))) return { mode: 'audio' };
            const vidExts = ['mp4', 'webm', 'ogv', 'mov']; 
            if (vidExts.includes(ext) || (type && (type === 'video/mp4' || type === 'video/webm'))) return { mode: 'video' };
            if (ext === 'pdf' || type === 'application/pdf') return { mode: 'pdf' };
            return { mode: 'unsupported' };
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            selectedFile = file;
            originalFileName = file.name;
            fileType = file.type || "application/octet-stream";
            
            const check = checkFileSupport(originalFileName, fileType);
            const mode = check.mode;
            forceTextMode = (mode === 'text');
            
            fileNameDisplay.textContent = file.name;
            fileNameDisplay.style.color = "#E0E0E0";
            const sizeMB = (file.size / 1024 / 1024).toFixed(2);
            statusText.textContent = `Selected: ${file.name} (${sizeMB} MB).`;
            
            resetProcessButton();
            processBtn.disabled = false;
            downloadBtn.disabled = true;
            loadedDataURI = null; 

            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = URL.createObjectURL(file);
            previewArea.innerHTML = '';
            
            if (mode === 'unsupported') {
                let icon = "📄";
                if (originalFileName.match(/\.(xls|xlsx|csv)$/i)) icon = "📊";
                if (originalFileName.match(/\.(ppt|pptx)$/i)) icon = "📽️";
                if (originalFileName.match(/\.(zip|rar|7z)$/i)) icon = "📦";
                previewArea.innerHTML = `<div style="text-align:center;"><div style="font-size:40px;">${icon}</div><br><span class="preview-placeholder">Unsupported Format.<br>Preview skipped.</span></div>`;
            } else if (mode === 'image') {
                const img = document.createElement('img'); img.src = currentObjectUrl; previewArea.appendChild(img);
            } else if (mode === 'video') {
                const video = document.createElement('video'); video.src = currentObjectUrl; video.controls = true; video.style.maxWidth = "100%"; previewArea.appendChild(video);
            } else if (mode === 'audio') {
                const audio = document.createElement('audio'); 
                audio.src = currentObjectUrl; 
                audio.controls = true; 
                audio.style.width = "90%"; 
                audio.style.height = "50px"; 
                audio.style.marginTop = "10px";
                const wrapper = document.createElement('div');
                wrapper.style.textAlign = "center";
                wrapper.style.width = "100%"; 
                wrapper.innerHTML = `<div style="font-size:48px; margin-bottom:5px;">🎵</div>`;
                wrapper.appendChild(audio);
                previewArea.appendChild(wrapper);
            } else if (mode === 'pdf') {
                const iframe = document.createElement('iframe'); iframe.src = currentObjectUrl; previewArea.appendChild(iframe);
            } else if (mode === 'text') {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const pre = document.createElement('pre');
                    pre.style.cssText = "text-align:left; width:100%; height:300px; overflow:auto; background:#000; color:#FFF; padding:15px; font-family:sans-serif; font-size:14px; white-space:pre-wrap; margin:0; border:none;";
                    pre.textContent = e.target.result;
                    previewArea.appendChild(pre);
                };
                reader.readAsText(file);
            }
        });

        processBtn.addEventListener('click', function() {
            if (isProcessing) stopProcessing();
            else if (selectedFile) startProcessing();
        });

        function startProcessing() {
            if (!selectedFile) return;
            isProcessing = true;
            fileReader = new FileReader();

            processBtn.textContent = "STOP PROCESSING";
            processBtn.className = "main-btn process-button is-processing";
            statusText.textContent = "Converting file... Please wait.";
            downloadBtn.disabled = true;

            fileReader.onload = function(readerEvent) {
                let result = readerEvent.target.result;
                if (forceTextMode && !result.startsWith('data:text/')) {
                     const base64Data = result.split(',')[1];
                     result = `data:text/plain;base64,${base64Data}`;
                }
                loadedDataURI = result;
                finishProcessing(true);
            };

            fileReader.onerror = () => { statusText.textContent = "Error reading file."; finishProcessing(false); };
            fileReader.onabort = () => { statusText.textContent = "Processing aborted."; resetProcessButton(); processBtn.disabled = false; };
            fileReader.readAsDataURL(selectedFile);
        }

        function stopProcessing() { if (fileReader) fileReader.abort(); isProcessing = false; }
        function finishProcessing(success) {
            isProcessing = false;
            if (success) {
                statusText.textContent = "Conversion complete.";
                processBtn.textContent = "PROCESSING COMPLETE";
                processBtn.className = "main-btn process-button is-complete";
                downloadBtn.disabled = false;
                downloadBtn.textContent = "DOWNLOAD HTML";
            } else { resetProcessButton(); processBtn.disabled = false; }
        }
        function resetProcessButton() {
            isProcessing = false; processBtn.textContent = "START PROCESSING"; processBtn.className = "main-btn process-button"; processBtn.disabled = true;
        }

        downloadBtn.addEventListener('click', function() {
            if (!loadedDataURI) return;

            const includeDownload = optDownload.classList.contains('active');
            const includeFPS = optFPS.classList.contains('active');
            const check = checkFileSupport(originalFileName, fileType);
            const mode = check.mode;
            const isVideo = (mode === 'video');

            const htmlHead = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>${originalFileName}</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0e0e0e; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #mediaContent { width: 100%; height: 100%; object-fit: contain; }
        iframe { width: 100vw; height: 100vh; border: none; background: #fff; }
        .unsupported-box { text-align: center; color: #E0E0E0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .unsupported-box .icon { font-size: 60px; margin-bottom: 10px; } 
        .fallback-btn { 
            display: inline-block; 
            margin-top: 15px; 
            color: #FF7E00; 
            border: 1px solid #FF7E00; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-family: 'Unispace Custom', "PingFang SC", sans-serif;
            transition: 0.2s; 
            text-transform: uppercase; 
        }
        .fallback-btn:hover { background: rgba(255, 126, 0, 0.2); }
        .overlay-container {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, auto));
            gap: 15px;
            pointer-events: none;
            justify-content: space-between;
        }
        .info-box {
            pointer-events: auto;
            background-color: rgba(0, 0, 0, 0.6);
            color: #FFFFFF;
            padding: 0 15px;
            height: 44px; 
            border-radius: 5px;
            font-family: 'Unispace Custom', "PingFang SC", monospace, sans-serif;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(5px);
            white-space: nowrap;
            box-sizing: border-box;
            width: 100%;
        }
        #dl-btn { border-color: #fff; transition: 0.3s; }
        #dl-btn:hover { background-color: rgba(0, 0, 0, 0.9); border-color: #007bff; }
        @media (max-width: 600px) {
            .overlay-container {
                grid-template-columns: 1fr; 
                justify-content: start;
                width: auto;
            }
        }
    </style>
</head>
<body>`;

            let overlayHTML = '';
            if (mode !== 'unsupported' && (includeFPS || includeDownload)) {
                overlayHTML = `<div class="overlay-container">`;
                if (includeFPS) overlayHTML += `<div class="info-box" id="fps-display">FPS: --</div>`;
                if (includeDownload) overlayHTML += `<a id="dl-overlay-btn" download="${originalFileName}" class="info-box" id="dl-btn" style="cursor:pointer">DOWNLOAD FILE</a>`;
                overlayHTML += `</div>`;
            }

            let scriptContent = `
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const media = document.getElementById('mediaContent');
                    const dlBtn = document.getElementById('dl-overlay-btn');
                    
                    if (dlBtn) {
                        if (media && media.src) {
                            dlBtn.href = media.src;
                        } else if (document.getElementById('code-data-holder')) {
                            dlBtn.href = document.getElementById('code-data-holder').getAttribute('data-src');
                        } else if (document.querySelector('object')) {
                            dlBtn.href = document.querySelector('object').data;
                        }
                    }

                    if (media && media.tagName === 'IMG') {
                        let zoomed = false;
                        media.style.cursor = 'zoom-in';
                        media.addEventListener('click', () => {
                            zoomed = !zoomed;
                            media.style.maxWidth = zoomed ? 'none' : '100%';
                            media.style.maxHeight = zoomed ? 'none' : '100vh';
                            media.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
                        });
                    }

                    if (document.getElementById('codeContent')) {
                        const dataURI = document.getElementById('code-data-holder').getAttribute('data-src');
                        fetch(dataURI)
                            .then(r => r.text())
                            .then(text => document.getElementById('codeContent').textContent = text)
                            .catch(e => document.getElementById('codeContent').textContent = "Error displaying text.");
                    }

                    ${includeFPS ? `
                    const fpsDisplay = document.getElementById('fps-display');
                    let lastTime = performance.now();
                    let frameCount = 0;
                    const UPDATE_INTERVAL = 250; 

                    function updateDisplay(fps, textOverride) {
                        if (!fpsDisplay) return;
                        if (textOverride) fpsDisplay.textContent = textOverride;
                        else fpsDisplay.textContent = 'FPS: ' + fps.toFixed(1);
                    }

                    ${isVideo ? `
                    if (media && 'requestVideoFrameCallback' in media) {
                        let videoHandle = null;
                        
                        const onFrame = (now, meta) => {
                            frameCount++;
                            const elapsed = now - lastTime;
                            if (elapsed >= UPDATE_INTERVAL) {
                                const fps = (frameCount * 1000) / elapsed;
                                updateDisplay(fps);
                                frameCount = 0;
                                lastTime = now;
                            }
                            videoHandle = media.requestVideoFrameCallback(onFrame);
                        };

                        media.addEventListener('play', () => {
                            if (videoHandle) media.cancelVideoFrameCallback(videoHandle);
                            frameCount = 0;
                            lastTime = performance.now();
                            videoHandle = media.requestVideoFrameCallback(onFrame);
                        });

                        media.addEventListener('pause', () => {
                            if (videoHandle) media.cancelVideoFrameCallback(videoHandle);
                            videoHandle = null;
                            updateDisplay(0, 'FPS: Paused');
                        });

                        media.addEventListener('ended', () => {
                            if (videoHandle) media.cancelVideoFrameCallback(videoHandle);
                            videoHandle = null;
                            updateDisplay(0, 'FPS: Ended');
                        });

                        media.addEventListener('waiting', () => { 
                            updateDisplay(0, 'FPS: Buffering'); 
                        });
                    } else { updateDisplay(0, 'FPS: N/A'); }
                    ` : `
                    const loop = (now) => {
                        frameCount++;
                        const elapsed = now - lastTime;
                        if (elapsed >= UPDATE_INTERVAL) {
                            const fps = (frameCount * 1000) / elapsed;
                            updateDisplay(fps);
                            frameCount = 0;
                            lastTime = now;
                        }
                        requestAnimationFrame(loop);
                    };
                    requestAnimationFrame(loop);
                    `}
                    ` : ''} 
                });
            <\/script>
</body>
</html>`;

            let blobParts = [];
            
            if (mode === 'unsupported') {
                 blobParts = [
                     htmlHead,
                     `<div class="unsupported-box">
                        <div class="icon">📄</div>
                        <p style="font-size:24px; font-weight:bold; margin: 2px 0;">Unsupported Format</p>
                        <p style="color:#888; margin: 2px 0;">${originalFileName}</p>
                        <a href="`, loadedDataURI, `" download="${originalFileName}" class="fallback-btn">DOWNLOAD FILE</a>
                     </div>`,
                     overlayHTML,
                     scriptContent
                 ];
            } else if (mode === 'image') {
                blobParts = [htmlHead, `<img id="mediaContent" src="`, loadedDataURI, `" alt="Image">`, overlayHTML, scriptContent];
            } else if (mode === 'video') {
                blobParts = [htmlHead, `<video id="mediaContent" src="`, loadedDataURI, `" controls autoplay loop playsinline></video>`, overlayHTML, scriptContent];
            } else if (mode === 'audio') {
                blobParts = [
                    htmlHead, 
                    `<div style="text-align:center; width: 100%;">
                        <div style="font-size:80px; margin-bottom:20px;">🎵</div>
                        <audio controls src="`, loadedDataURI, `" style="width:80%; max-width:800px; display:block; margin: 20px auto;"></audio>
                    </div>`,
                    overlayHTML, 
                    scriptContent
                ];
            } else if (mode === 'pdf') {
                blobParts = [
                    htmlHead,
                    `<object data="`, loadedDataURI, `" type="application/pdf" style="width:100vw; height:100vh;">
                         <div class="unsupported-box"><p>PDF cannot be displayed inline.</p><a href="`, loadedDataURI, `" download="${originalFileName}" class="fallback-btn">DOWNLOAD FILE</a></div>
                    </object>`,
                    overlayHTML,
                    scriptContent
                ];
            } else if (mode === 'text') {
                blobParts = [
                    htmlHead,
                    `<div id="code-data-holder" data-src="`, loadedDataURI, `" style="display:none;"></div>
                     <div style="width:100%; height:100vh; overflow:auto; background:#000; color:#FFF; padding:20px; box-sizing:border-box;">
                        <pre id="codeContent" style="white-space:pre-wrap; word-wrap:break-word; font-family:sans-serif; font-size:16px; margin:0;">Loading...</pre>
                     </div>`,
                    overlayHTML,
                    scriptContent
                ];
            }

            try {
                const blob = new Blob(blobParts, {type: 'text/html'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `View_${originalFileName}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (e) {
                alert("File too large to generate HTML download.");
            }
        });
    </script>
</body>
</html>
