<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test List</title> 
    <style>
        body {
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #e0e0e0;
            text-align: center;
            overflow-x: hidden;
        }

        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 0.9em;
            color: #e0e0e0;
            background-color: #333333;
            border: 1px solid #778899;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            z-index: 100;
        }

        .main-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-10%);
            width: 100%;
        }

        h1 {
            color: #e0e0e0;
            margin-bottom: 40px;
            font-size: 2.5em;
            margin-top: 0;
        }

        #button-container {
            display: grid;
            /* 修改这里：改为3列布局 */
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            justify-items: center;
            position: relative;
            z-index: 10;
            /* 稍微增加最大宽度以适应3列 */
            max-width: 1200px;
            padding: 0 20px;
        }

        .tool-button {
            width: 160px;
            padding: 15px 10px;
            font-size: 1.2em;
            cursor: pointer;
            color: #e0e0e0; 
            background-color: #333333;
            border: 2px solid #505050;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none; 
        }

        .tool-button:hover {
            background-color: #444444;
            border-color: #e0e0e0; 
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
            transform: translateY(-3px);
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #2a2a2a;
            border: 1px solid #505050;
            border-radius: 12px;
            padding: 25px;
            width: 400px;
            max-width: 85%;
            text-align: left;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .modal-body {
            font-size: 1em;
            color: #ccc;
            line-height: 1.6;
            min-height: 60px;
            padding: 0 5px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-btn {
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-cancel {
            background-color: transparent;
            color: #aaa;
            border: 1px solid #444;
        }
        .btn-cancel:hover {
            color: #e0e0e0;
            border-color: #666;
        }

        .btn-confirm {
            background-color: #e0e0e0;
            color: #1a1a1a;
            font-weight: bold;
        }
        .btn-confirm:hover {
            background-color: #fff;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
                margin-bottom: 30px;
            }
            
            #button-container {
                grid-template-columns: 1fr; /* 移动端保持单列 */
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <a href="../" id="homeButton">← 返回主页</a>

    <div class="main-wrapper">
        <h1>选择项目</h1> 

        <div id="button-container">
            <div class="tool-button" data-href="../llt.html" data-desc="采用主从架构的 CPU 稳定性测试工具。使用 LLT 算法验证梅森素数，以对多核处理器整数单元进行持续满载施压。配备实时折线图监控每一轮计算耗时，能有效检测处理器在长时间高负载下的稳定性。">
                梅森素数检验
            </div>

            <div class="tool-button" data-href="../primenumber.html" data-desc="侧重于并发吞吐量的 CPU 性能测试工具。使用 Miller-Rabin 概率算法在指定的大范围内并行查找质数，以压榨处理器的整数运算能力与多线程通信效率。具备自动分块搜索及结果同步排序功能，适合评估 CPU 在混合高并发负载下的综合表现。">
                质数查找器
            </div>

            <div class="tool-button" data-href="../raytracingcpu.html" data-desc="基于 SDF 光线步进算法的纯 CPU 渲染演示。利用 Web Worker 施加多核负载，直观检测处理器在浮点运算密集型任务中的多线程并发效率。受限于 CPU 架构及 JavaScript 缺乏原生 SIMD 支持，其渲染效率在原理上显著低于 GPU 或软件光栅化管线，不可与着色器版本直接对比帧数。">
                软件光线追踪
            </div>

            <div class="tool-button" data-href="../bandwidthtest.html" data-desc="评估 GPU 显存带宽的基准测试。利用 WebGPU 直接对显存执行大规模的高强度读写拷贝操作，以衡量显存峰值带宽。包含自动预热、速率校准与分批峰值采样机制，以排除系统干扰。（需要 WebGPU 支持）">
                显存带宽测试
            </div>
            
            <div class="tool-button" data-href="../raytracing.html" data-desc="基于 SDF 光线步进算法，完全利用着色器而非硬件光追单元实现的 GPU 实时渲染演示。场景完全由数学公式动态构建，通过运行高复杂度着色器代码，对 GPU 的浮点运算单元施加巨大压力。支持 HDR 色调映射与多档画质调节，支持 WebGL 2.0 与 WebGPU 双后端热切换，支持实时帧率显示。">
                着色器光线追踪
            </div>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="modal-title">标题</div>
            <div class="modal-body" id="modal-description">描述内容</div>
            <div class="modal-footer">
                <button class="modal-btn btn-cancel" id="modal-close">取消</button>
                <button class="modal-btn btn-confirm" id="modal-go">访问</button>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.tool-button');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-description');
        const btnGo = document.getElementById('modal-go');
        const btnClose = document.getElementById('modal-close');

        let currentTargetUrl = '';

        function openModal(title, desc, url) {
            modalTitle.textContent = title;
            modalDesc.textContent = desc;
            currentTargetUrl = url;
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            currentTargetUrl = '';
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const title = button.innerText.trim(); 
                const desc = button.getAttribute('data-desc');
                const url = button.getAttribute('data-href');
                
                openModal(title, desc, url);
            });
        });

        btnGo.addEventListener('click', () => {
            if (currentTargetUrl) {
                window.location.href = currentTargetUrl;
            }
        });

        btnClose.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });
    </script>

</body>
</html>
