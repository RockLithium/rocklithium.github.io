<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=850, user-scalable=yes">
    <title>Audio Pitch Shifter</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Condensed&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./shared/audio-tool.css">
    <style>

        .param-box {
            background-color: rgba(42, 42, 42, 0.5);
            height: 50px;
            flex: 1; 
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            border: 1px solid rgba(88, 88, 88, 0.3);
            transition: border-color 0.2s;
            font-family: 'Ubuntu', "PingFang SC", sans-serif;
        }

        .param-box:focus-within {
            border-color: #FF7E00;
        }

        .param-label {
            color: #888;
            font-size: 16px;
            font-weight: bold;
            user-select: none;
            white-space: nowrap;
        }

        .param-input {
            background: transparent;
            border: none;
            color: #E0E0E0;
            font-family: 'Unispace Bd', monospace;
            font-size: 16px;
            text-align: right;
            width: 100%; 
            outline: none;
            font-weight: bold;
        }

        .param-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            color: #666;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .process-btn-container {
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .main-btn {
            width: 100%;
            padding: 10px 40px;
            font-size: 24px;
            cursor: pointer;
            color: #E0E0E0;
            border: none;
            border-radius: 10px;
            font-family: 'Ubuntu Condensed', sans-serif;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: none; 
            box-shadow: none;
        }

        .process-button {
            background: linear-gradient(45deg, #2E8B57 0%, #3CB371 100%);
        }

        .process-button:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .process-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .process-button.is-processing {
            background: linear-gradient(45deg, #8B0000 0%, #B22222 100%);
            animation: pulse 2s infinite;
        }

        .process-button.is-complete {
            background: linear-gradient(45deg, #1E90FF 0%, #00BFFF 100%);
            cursor: default;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(178, 34, 34, 0); }
            100% { box-shadow: 0 0 0 0 rgba(178, 34, 34, 0); }
        }

        .download-button {
            background: linear-gradient(45deg, #A52A2A 0%, #FF7E00 50%, #DAA520 100%);
            width: 100%;
            max-width: 600px;
        }

        .download-button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            display: none; 
        }

        .download-button:active {
            transform: scale(0.98);
        }

        .preview-box {
            background-color: rgba(42, 42, 42, 0.5);
            border: 1px dashed #505050;
            border-radius: 10px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        .preview-placeholder {
            color: #555;
            font-family: 'Ubuntu', "PingFang SC", sans-serif;
            font-weight: bold;
            text-align: center;
        }

        .status-text {
            font-family: 'Ubuntu Light', "PingFang SC", sans-serif;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }

        .visualizer-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #000;
            touch-action: manipulation;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .vis-overlay {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .vis-controls {
            pointer-events: auto;
            background: rgba(20, 20, 20, 0.9);
            padding: 5px 15px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #555;
            width: 80%;
            max-width: 500px;
            transition: transform 0.5s ease, opacity 0.5s ease;
            opacity: 1;
            transform: translateY(0);
        }

        .vis-controls.hide-ui {
            transform: translateY(150%);
            opacity: 0;
        }

        .visualizer-container.hide-cursor {
            cursor: none;
        }

        .vis-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
            padding: 0;
        }

        .vis-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: block;
        }

        .vis-btn:hover { color: #FF7E00; background: rgba(255,255,255,0.1); }

        .vis-pitch-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(42, 42, 42, 0.8);
            border: 1px solid #555;
            color: #888;
            padding: 4px 10px;
            font-family: 'Ubuntu', "PingFang SC", sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .vis-pitch-btn:hover {
            border-color: #888;
            color: #aaa;
        }

        .vis-pitch-btn.active {
            background: #222;
            border-color: #FF7E00;
            color: #FF7E00;
            box-shadow: 0 0 5px rgba(255, 126, 0, 0.3);
        }

        .vis-progress-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus { outline: none; }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #FF7E00;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        input[type=range]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #FF7E00;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        .vis-hint {
            position: absolute;
            top: 10px;
            right: 12px;
            color: rgba(255,255,255,0.3);
            font-family: 'Ubuntu', "PingFang SC", sans-serif;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>

        let currentLang = 'en-US';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.getElementById('homeButton').textContent = t.goBack;
            document.getElementById('tab-analyzer').textContent = t.tabAnalyzer;

            document.getElementById('tab-freq').textContent = t.tabFreq;
            document.getElementById('main-title').textContent = t.title;
            document.getElementById('main-subtitle').textContent = t.subtitle;
            document.getElementById('label-select-file').textContent = t.selectFile;
            document.getElementById('label-parameters').textContent = t.parameters;
            document.getElementById('label-shift').textContent = t.shift;
            
            if (isProcessing) {

            } else if (processBtn.classList.contains('is-complete')) {

            } else {

            }

            document.getElementById('downloadBtn').textContent = t.dlWav;
            
            const placeholder = document.getElementById('placeholder-text');
            if (placeholder) placeholder.textContent = t.noMedia;

            if (!selectedFile) {
                statusText.textContent = t.waitInput;
                fileNameDisplay.textContent = t.dropText;
            } else {
                switch (currentProcessingState.type) {
                    case 'loading': statusText.textContent = t.loading; break;
                    case 'decoding': statusText.textContent = t.decoding; break;
                    case 'processing': 
                        statusText.textContent = t.processing + Math.round(currentProcessingState.progress * 100) + "%"; 
                        break;
                    case 'complete': statusText.textContent = t.complete; break;
                    default:
                        if (processBtn.classList.contains('is-complete') === false && !isProcessing) {
                             statusText.textContent = t.optionsChanged;
                        } else if (!isProcessing && !processBtn.classList.contains('is-complete')) {
                             const sizeMB = (selectedFile.size / 1024 / 1024).toFixed(2);
                             statusText.textContent = `${t.selected}${selectedFile.name} (${sizeMB} MB)`;
                        }
                }
            }

            const visPitchBtn = document.getElementById('visPitchBtn');
            if (visPitchBtn) visPitchBtn.textContent = t.freqPitch;

            const visHint = document.querySelector('.vis-hint');
            if (visHint) {
                visHint.textContent = `${t.fsHint} | ${t.playPauseHint}`;
            }
        }

        function transform(real, imag) {
            const n = real.length;
            if (n <= 1) return;
            let i = 0, j = 0;
            for (i = 0; i < n; i++) {
                if (i < j) { [real[i], real[j]] = [real[j], real[i]]; [imag[i], imag[j]] = [imag[j], imag[i]]; }
                let m = n >> 1; while (m >= 1 && j >= m) { j -= m; m >>= 1; } j += m;
            }
            for (let m = 2; m <= n; m <<= 1) {
                const mh = m >> 1; const phi = (2 * Math.PI) / m; 
                const w_real_m = Math.cos(phi); const w_imag_m = -Math.sin(phi);
                for (let k = 0; k < n; k += m) {
                    let w_real = 1; let w_imag = 0;
                    for (let r = 0; r < mh; r++) {
                        const t_index = k + r + mh; const u_index = k + r;
                        const t_real = w_real * real[t_index] - w_imag * imag[t_index];
                        const t_imag = w_real * imag[t_index] + w_imag * real[t_index];
                        const u_real = real[u_index]; const u_imag = imag[u_index];
                        real[u_index] = u_real + t_real; imag[u_index] = u_imag + t_imag;
                        real[t_index] = u_real - t_real; imag[t_index] = u_imag - t_imag;
                        const w_temp = w_real; w_real = w_real * w_real_m - w_imag * w_imag_m; w_imag = w_temp * w_imag_m + w_imag * w_real_m;
                    }
                }
            }
        }

        const workerScript = `
            self.onmessage = function(e) {
                const { channelDataList, sampleRate, semitones } = e.data;
                const channelCount = channelDataList.length;
                const length = channelDataList[0].length;
                
                const fftSize = 2048; 
                const hopSize = 256;
                const winSize = fftSize;
                const halfSize = fftSize / 2;
                const binWidth = sampleRate / fftSize;
                
                const pitchRatio = Math.pow(2, semitones / 12);
                
                const window = new Float32Array(winSize);
                for(let i=0; i<winSize; i++) {
                    window[i] = 0.5 * (1 - Math.cos(2 * Math.PI * i / winSize));
                }

                const expectedPhaseAdv = new Float32Array(halfSize + 1);
                for (let k=0; k <= halfSize; k++) {
                     expectedPhaseAdv[k] = (2 * Math.PI * k * hopSize) / fftSize;
                }

                const processedChannels = [];
                const real = new Float32Array(fftSize);
                const imag = new Float32Array(fftSize);

                for (let c = 0; c < channelCount; c++) {
                    const inputData = channelDataList[c];
                    const outputData = new Float32Array(length);
                    const anaMagn = new Float32Array(halfSize + 1);
                    const anaFreq = new Float32Array(halfSize + 1);
                    const synMagn = new Float32Array(halfSize + 1);
                    const synFreq = new Float32Array(halfSize + 1);
                    const prevAnaPhase = new Float32Array(halfSize + 1);
                    const prevSynPhase = new Float32Array(halfSize + 1);
                    
                    const anaPhase = new Float32Array(halfSize + 1);
                    
                    prevAnaPhase.fill(0);
                    prevSynPhase.fill(0);

                    let processedSamples = 0;

                    for (let i = 0; i <= length - fftSize; i += hopSize) {
                        if (c === 0 && processedSamples % 50 === 0) {
                            self.postMessage({ type: 'progress', progress: i / length });
                        }
                        processedSamples++;

                        for(let j=0; j<winSize; j++) {
                            real[j] = inputData[i+j] * window[j];
                            imag[j] = 0;
                        }
                        performFFT(real, imag);

                        for(let k=0; k<=halfSize; k++) {
                            const mag = Math.sqrt(real[k]*real[k] + imag[k]*imag[k]);
                            const phase = Math.atan2(imag[k], real[k]);
                            
                            anaMagn[k] = mag;
                            anaPhase[k] = phase;
                            
                            let phaseDiff = phase - prevAnaPhase[k];
                            prevAnaPhase[k] = phase;
                            
                            phaseDiff -= expectedPhaseAdv[k];
                            let q = Math.round(phaseDiff / (2 * Math.PI));
                            phaseDiff -= q * 2 * Math.PI;
                            
                            const freqDev = (phaseDiff * sampleRate) / (2 * Math.PI * hopSize);
                            anaFreq[k] = (k * binWidth) + freqDev;
                        }

                        synMagn.fill(0);
                        synFreq.fill(0);
                        
                        for(let k=0; k<=halfSize; k++) {
                            const targetIndex = Math.floor(k * pitchRatio);
                            if (targetIndex > 0 && targetIndex < halfSize) {
                                synMagn[targetIndex] += anaMagn[k];
                                synFreq[targetIndex] = anaFreq[k] * pitchRatio;
                            }
                        }

                        real.fill(0);
                        imag.fill(0);

                        for(let k=0; k<=halfSize; k++) {
                            const mag = synMagn[k];
                            if (mag > 1e-5) {
                                const freq = synFreq[k];
                                const phaseAdv = (freq * 2 * Math.PI * hopSize) / sampleRate;
                                
                                let phase = prevSynPhase[k] + phaseAdv;
                                while (phase > Math.PI) phase -= 2 * Math.PI;
                                while (phase < -Math.PI) phase += 2 * Math.PI;

                                prevSynPhase[k] = phase;
        
                                real[k] = mag * Math.cos(phase);
                                imag[k] = mag * Math.sin(phase);
                            }
                        }

                        for(let k=1; k<halfSize; k++) {
                            real[fftSize-k] = real[k];
                            imag[fftSize-k] = -imag[k];
                        }
                        
                        performIFFT(real, imag);

                        const gain = 1.0 / (fftSize / hopSize) * 2.66; 

                        for(let j=0; j<winSize; j++) {
                            if (i + j < length) {
                                outputData[i+j] += real[j] * window[j] * gain; 
                            }
                        }
                    }
                    processedChannels.push(outputData);

                if (!isProcessing) return; 

                const TARGET_RATE = 48000;
                const tempCtx = new OfflineAudioContext(1, 1, TARGET_RATE);
                
                currentProcessingState.type = 'decoding';
                statusText.textContent = t.decoding;
                
                const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                if (!isProcessing) return; 

                currentProcessingState.type = 'processing';
                statusText.textContent = t.processing + "0%";

                const channelCount = audioBuffer.numberOfChannels;
                const channelDataList = [];
                for(let c=0; c<channelCount; c++) {
                    channelDataList.push(audioBuffer.getChannelData(c));
                }
                
                const processedChannels = await runWorkerProcessing(channelDataList, TARGET_RATE, shiftVal);
                if (!isProcessing) return;

                processedAudioBuffer = tempCtx.createBuffer(channelCount, processedChannels[0].length, TARGET_RATE);
                for(let c=0; c<channelCount; c++) {
                    processedAudioBuffer.copyToChannel(processedChannels[c], c);
                }

                processedBlob = encodeWAV(processedChannels, TARGET_RATE);

                const vizMonoBuffer = downmixBuffer(processedAudioBuffer);
                
                isProcessing = false;
                currentProcessingState.type = 'complete';
                statusText.textContent = t.complete;
                processBtn.textContent = t.procComp;
                processBtn.className = "main-btn process-button is-complete";

                            ctx.strokeStyle = '#888888';
                            ctx.stroke();
                            ctx.fillStyle = '#E0E0E0';
                            ctx.fillText("C" + octave, x + 2, height - 5);
                        } else {
                            const isNatural = [0, 2, 4, 5, 7, 9, 11].includes(noteIndex);
                            if (isNatural) {
                                ctx.lineWidth = 1;
                                ctx.strokeStyle = 'rgba(136, 136, 136, 0.5)';
                                ctx.stroke();
                            } else {
                                ctx.lineWidth = 1;
                                ctx.strokeStyle = 'rgba(136, 136, 136, 0.25)';
                                ctx.stroke();
                            }
                        }
                    }
                }

                ctx.textAlign = "left";
                for (let db = -100; db <= 0; db += 4) {
                    const rawY = getY(db);
                    const y = Math.floor(rawY) + 0.5;
                    const isMajor = (db % 20 === 0 && db !== 0 && db !== -100);
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    if (isMajor) {
                        ctx.lineWidth = 1.5;
                        ctx.strokeStyle = '#888888';
                        ctx.stroke();
                        ctx.fillStyle = '#E0E0E0';
                        ctx.fillText(db, 5, y - 3);
                    } else {
                        ctx.lineWidth = 1;
                        ctx.strokeStyle = 'rgba(136, 136, 136, 0.5)';
                        ctx.stroke();
                    }
                }

                const bufferLength = dataArray.length;
                const gradient = ctx.createLinearGradient(0, 0, width, 0);
                gradient.addColorStop(0, '#A52A2A');
                gradient.addColorStop(0.5, '#FF7E00');
                gradient.addColorStop(1, '#DAA520');
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.beginPath();
                let hasStarted = false;
                for (let i = 0; i < bufferLength; i++) {
                    const freq = i * sampleRate / (2 * bufferLength);
                    if (freq < minFreq) continue;
                    if (freq > maxFreq) break;
                    const x = getX(freq);
                    const y = getY(dataArray[i]);
                    if (!hasStarted) {
                        ctx.moveTo(x, y);
                        hasStarted = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.stroke();
                
                const peaks = [];
                const noiseFloor = -80;
                
                for (let i = 2; i < bufferLength - 2; i++) {
                    const freq = i * sampleRate / (bufferLength * 2);
                    if (freq < minFreq) continue;
                    const val = dataArray[i];
                    
                    if (val > noiseFloor) {
                        if (val > dataArray[i - 1] && val > dataArray[i - 2] && val > dataArray[i + 1] && val > dataArray[i + 2]) {
                            peaks.push({ freq, db: val });
                        }
                    }
                }
                
                let frameMaxDB = -Infinity;
                peaks.forEach(p => frameMaxDB = Math.max(frameMaxDB, p.db));
                
                const dbThresholdVal = 20; 
                const cutoffDB = frameMaxDB - dbThresholdVal;
                
                const validPeaks = peaks.filter(p => p.db >= cutoffDB);
                validPeaks.sort((a, b) => a.freq - b.freq);
                const lowPeak = validPeaks.length > 0 ? validPeaks[0] : null;

                peaks.sort((a, b) => b.db - a.db);
                let displayPeaks = peaks.slice(0, 10);

                if (lowPeak) {
                    const exists = displayPeaks.find(p => Math.abs(p.freq - lowPeak.freq) < 1);
                    if (!exists) displayPeaks.push(lowPeak);
                }

                ctx.textAlign = "center";
                ctx.font = "bold 14px 'Ubuntu', monospace";

                displayPeaks.forEach(p => {
                    const x = getX(p.freq);
                    const y = getY(p.db);
                    
                    ctx.fillStyle = (p === lowPeak) ? '#FF7E00' : '#FFF';
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    
                    const text = Math.round(p.freq) + "Hz";
                    const tw = ctx.measureText(text).width;
                    
                    ctx.fillStyle = "rgba(0,0,0,0.7)";
                    ctx.fillRect(x - tw / 2 - 2, y - 20, tw + 4, 16);
                    
                    ctx.fillStyle = (p === lowPeak) ? '#FF7E00' : '#FFF';
                    ctx.fillText(text, x, y - 8);
                });
            }
        }

        changeLanguage('en-US');
    </script>
