<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=850, user-scalable=yes">
    <title>溶液密度浓度计算</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #222222;
            --panel: #2b2b2b;
            --panel-2: #333333;
            --border: #666666;
            --border-soft: #4d4d4d;
            --text: #e0e0e0;
            --muted: #aeb7c2;
            --accent: #1a73e8;
            --accent-2: #46a0ff;
            --warn: #ffbe55;
            --bad: #ff6b6b;
            --good: #70d37b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto 44px;
            min-width: 850px;
            background-color: var(--bg);
            color: var(--text);
        }

        #homeButton {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 0.9em;
            color: var(--text);
            background-color: var(--panel-2);
            border: 1px solid #778899;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            z-index: 100;
        }

        #homeButton:hover {
            background-color: #444444;
        }

        h1 {
            color: var(--accent);
            margin-top: 40px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            margin: 0 0 22px;
            color: var(--muted);
            text-align: center;
            font-size: 15px;
        }

        .calculator {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: minmax(360px, 0.82fr) minmax(420px, 1.18fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            background-color: var(--panel);
            border: 3px solid #777777;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 16px;
            background-color: #444444;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
        }

        .panel-body {
            padding: 16px;
        }

        .field-grid {
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        input {
            width: 100%;
            min-height: 39px;
            padding: 8px 10px;
            color: var(--text);
            background-color: #1f1f1f;
            border: 1px solid var(--border);
            border-radius: 4px;
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.22);
        }

        .choice-buttons {
            display: grid;
            gap: 10px;
        }

        .category-buttons {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .item-buttons {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .global-btn {
            cursor: pointer;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-height: 38px;
            padding: 0 18px;
            color: var(--text);
            background-color: #666666;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .global-btn.primary {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
        }

        .global-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.45);
            font-weight: bold;
        }

        .global-btn:hover {
            background-color: #888888;
        }

        .global-btn.primary:hover {
            background-color: #2b82f0;
        }

        .result-card {
            border: 1px solid var(--border-soft);
            background-color: #242424;
            border-radius: 6px;
            padding: 16px;
        }

        .result-value {
            margin: 0;
            color: #ffffff;
            font-size: 40px;
            line-height: 1.1;
            font-weight: bold;
        }

        .result-value span {
            color: var(--accent-2);
        }

        .molarity-value {
            margin: 8px 0 0;
            color: #ffffff;
            font-size: 24px;
            line-height: 1.2;
            font-weight: bold;
        }

        .molarity-value span {
            color: var(--good);
        }

        .result-unit {
            color: #ffffff;
            font-size: 0.78em;
            font-style: normal;
        }

        .result-detail {
            margin: 9px 0 0;
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }

        .message {
            margin-top: 12px;
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }

        .message.warn {
            color: var(--warn);
        }

        .message.bad {
            color: var(--bad);
        }

        .message.good {
            color: var(--good);
        }

        .controls-table-container {
            width: 100%;
            max-height: 560px;
            overflow: auto;
            background-color: var(--bg);
        }

        .controls-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
            text-align: center;
            table-layout: fixed;
        }

        .controls-table th,
        .controls-table td {
            color: var(--text);
            font-size: 14px;
            border: 1px solid #555555;
            vertical-align: middle;
            text-align: center;
            padding: 9px 6px;
            background-color: #222222;
            line-height: 1.45;
        }

        .controls-table thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #444444;
            font-weight: bold;
        }

        .controls-table tbody tr.is-bracket td {
            background-color: rgba(26, 115, 232, 0.18);
        }

        .controls-table tbody tr.is-nearest td {
            color: #ffffff;
            font-weight: bold;
        }

        @media (max-width: 960px) {
            .calculator {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="./" id="homeButton">← 返回上一级</a>

    <h1>溶液密度浓度计算</h1>
    <p class="subtitle">输入密度和温度，按表格数据做线性插值，估算质量百分浓度。</p>

    <main class="calculator">
        <section class="panel">
            <div class="panel-header">计算参数</div>
            <div class="panel-body">
                <div class="field-grid">
                    <div>
                        <label>类别</label>
                        <div class="choice-buttons category-buttons" id="categoryButtons"></div>
                    </div>
                    <div>
                        <label>物质</label>
                        <div class="choice-buttons item-buttons" id="itemButtons"></div>
                    </div>
                    <div class="input-row">
                        <div>
                            <label for="densityInput">密度 kg/L</label>
                            <input id="densityInput" type="number" step="0.0001" inputmode="decimal">
                        </div>
                        <div>
                            <label for="temperatureInput">温度 °C</label>
                            <input id="temperatureInput" type="number" step="0.1" inputmode="decimal">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <span>计算结果</span>
            </div>
            <div class="panel-body">
                <div class="result-card">
                    <p class="result-value"><span id="primaryValue">--</span>% <em id="primaryUnit" class="result-unit">w/w</em></p>
                    <p class="molarity-value"><span id="molarityValue">--</span> mol/L</p>
                    <p class="result-detail" id="resultDetail">等待数据加载完成。</p>
                </div>
                <div id="message" class="message"></div>
            </div>
            <div class="controls-table-container">
                <table class="controls-table">
                    <thead>
                        <tr>
                            <th>浓度 %</th>
                            <th>插值密度 kg/L</th>
                            <th>与输入差值</th>
                            <th>使用状态</th>
                        </tr>
                    </thead>
                    <tbody id="sampleBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const DATA_URL = 'concentration.csv';
        const WATER_DENSITY_TABLE = new Map([
            [0, 0.99984283], [0.1, 0.9998493], [0.2, 0.9998558], [0.3, 0.9998622], [0.4, 0.9998683], [0.5, 0.9998743], [0.6, 0.9998801], [0.7, 0.9998857], [0.8, 0.9998912], [0.9, 0.9998964],
            [1, 0.9999015], [2, 0.9999429], [3, 0.9999672], [4, 0.9999750], [5, 0.9999668], [6, 0.9999430], [7, 0.9999043], [8, 0.9998509], [9, 0.9997834],
            [10, 0.9997021], [11, 0.9996074], [12, 0.9994996], [13, 0.9993792], [14, 0.9992464], [15, 0.9991016], [15.56, 0.9990153], [16, 0.9989450], [17, 0.9987769], [18, 0.9985976], [19, 0.9984073],
            [20, 0.9982063], [21, 0.9979948], [22, 0.9977730], [23, 0.9975412], [24, 0.9972994], [25, 0.9970480], [26, 0.9967870], [27, 0.9965166], [28, 0.9962371], [29, 0.9959486],
            [30, 0.9956511], [31, 0.9953450], [32, 0.9950302], [33, 0.9947071], [34, 0.9943756], [35, 0.9940359], [36, 0.9936883], [37, 0.9933328], [38, 0.9929695], [39, 0.9925987],
            [40, 0.9922204], [41, 0.99183], [42, 0.99144], [43, 0.99104], [44, 0.99063], [45, 0.99021], [46, 0.98979], [47, 0.98936], [48, 0.98893], [49, 0.98848],
            [50, 0.98804], [51, 0.98758], [52, 0.98712], [53, 0.98665], [54, 0.98617], [55, 0.98569], [56, 0.98521], [57, 0.98471], [58, 0.98421], [59, 0.98371],
            [60, 0.98320], [61, 0.98268], [62, 0.98216], [63, 0.98163], [64, 0.98109], [65, 0.98055], [66, 0.98000], [67, 0.97945], [68, 0.97890], [69, 0.97833],
            [70, 0.97776], [71, 0.97719], [72, 0.97661], [73, 0.97603], [74, 0.97544], [75, 0.97484], [76, 0.97424], [77, 0.97364], [78, 0.97303], [79, 0.97241],
            [80, 0.97179], [81, 0.97116], [82, 0.97053], [83, 0.96990], [84, 0.96926], [85, 0.96861], [86, 0.96796], [87, 0.96731], [88, 0.96664], [89, 0.96598],
            [90, 0.96531], [91, 0.96463], [92, 0.96396], [93, 0.96327], [94, 0.96258], [95, 0.96189], [96, 0.96119], [97, 0.96049], [98, 0.95978], [99, 0.95907]
        ]);
        const CATEGORY_ORDER = ['inorganic_acid', 'alcohol'];
        const ITEM_ORDER = {
            inorganic_acid: ['hydrochloric', 'sulfuric', 'nitric'],
            alcohol: ['methanol', 'ethanol', 'isopropanol']
        };
        const state = {
            solutions: new Map(),
            categories: new Map(),
            selectedCategory: 'inorganic_acid',
            selectedItemId: 'hydrochloric',
            currentResult: null
        };

        function parseCsv(text) {
            return text.trim().split(/\r?\n/).map(line => {
                const cells = [];
                let cell = '';
                let quoted = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (quoted && line[i + 1] === '"') {
                            cell += '"';
                            i++;
                        } else {
                            quoted = !quoted;
                        }
                    } else if (char === ',' && !quoted) {
                        cells.push(cell);
                        cell = '';
                    } else {
                        cell += char;
                    }
                }
                cells.push(cell);
                return cells;
            });
        }

        function formatNumber(value, digits = 4) {
            if (!Number.isFinite(value)) return '--';
            return value.toFixed(digits);
        }

        function formatResult(value) {
            if (!Number.isFinite(value)) return '--';
            return value.toFixed(3);
        }

        function concentrationToMolarity(solution, density, concentration) {
            const molarMass = solution.molarMass;
            if (!molarMass || !Number.isFinite(density) || !Number.isFinite(concentration)) return NaN;
            return density * 10 * concentration / molarMass;
        }

        function interpolate(x0, y0, x1, y1, x) {
            if (x1 === x0) return y0;
            return y0 + (y1 - y0) * ((x - x0) / (x1 - x0));
        }

        function findBounds(values, target) {
            const sorted = [...values].sort((a, b) => a - b);
            if (target < sorted[0] || target > sorted[sorted.length - 1]) return null;
            for (let i = 0; i < sorted.length - 1; i++) {
                if (target >= sorted[i] && target <= sorted[i + 1]) {
                    return [sorted[i], sorted[i + 1]];
                }
            }
            return [sorted[sorted.length - 1], sorted[sorted.length - 1]];
        }


        function waterDensityAt(temperature) {
            if (WATER_DENSITY_TABLE.has(temperature)) return WATER_DENSITY_TABLE.get(temperature);
            return null;
        }

        function addPointToSeries(series, concentration, temperature, density) {
            series.points.push({ concentration, temperature, density });
            series.concentrations.add(concentration);
            series.temperatures.add(temperature);
        }

        function applyWaterDensityPoints() {
            for (const solution of state.solutions.values()) {
                Object.values(solution.series).forEach(series => {
                    const temps = [...series.temperatures];
                    temps.forEach(temperature => {
                        const density = waterDensityAt(temperature);
                        if (density == null) return;
                        const existing = series.points.find(point => point.concentration === 0 && point.temperature === temperature);
                        if (existing) {
                            existing.density = density;
                        } else {
                            addPointToSeries(series, 0, temperature, density);
                        }
                    });
                });
            }
        }

        function buildSolutionData(rows) {
            const header = rows[0];
            const index = Object.fromEntries(header.map((name, i) => [name.replace(/^\uFEFF/, ''), i]));

            rows.slice(1).forEach(row => {
                const id = row[index.item_id];
                if (!id) return;
                if (!state.solutions.has(id)) {
                    const category = row[index.category];
                    state.solutions.set(id, {
                        id,
                        category,
                        categoryName: row[index.category_name],
                        name: row[index.item_name],
                        formula: row[index.formula],
                        molarMass: Number(row[index.molar_mass_g_mol]),
                        series: {
                            weight: { points: [], concentrations: new Set(), temperatures: new Set(), byConcentration: new Map() },
                            volume: { points: [], concentrations: new Set(), temperatures: new Set(), byConcentration: new Map() }
                        }
                    });
                    if (!state.categories.has(category)) {
                        state.categories.set(category, row[index.category_name]);
                    }
                }
                const solution = state.solutions.get(id);
                const basis = row[index.basis] || 'weight';
                const concentration = Number(row[index.concentration_pct]);
                const temperature = Number(row[index.temperature_c]);
                const density = Number(row[index.density_kg_l]);
                const series = solution.series[basis];
                if (series && [concentration, temperature, density].every(Number.isFinite)) {
                    addPointToSeries(series, concentration, temperature, density);
                }
            });

            applyWaterDensityPoints();

            for (const solution of state.solutions.values()) {
                Object.values(solution.series).forEach(series => {
                    series.concentrations = [...series.concentrations].sort((a, b) => a - b);
                    series.temperatures = [...series.temperatures].sort((a, b) => a - b);
                    series.byConcentration = new Map();
                    series.points.forEach(point => {
                        if (!series.byConcentration.has(point.concentration)) {
                            series.byConcentration.set(point.concentration, new Map());
                        }
                        series.byConcentration.get(point.concentration).set(point.temperature, point.density);
                    });
                });
            }
        }

        function primaryBasis(solution) {
            return solution.category === 'alcohol' && solution.series.volume?.points.length ? 'volume' : 'weight';
        }

        function primarySeries(solution) {
            return solution.series[primaryBasis(solution)] || solution.series.weight;
        }

        function interpolateDensityAtTemperature(solution, temperature, basis = 'weight') {
            const series = solution.series[basis];
            if (!series) return [];
            const samples = [];
            series.concentrations.forEach(concentration => {
                const tempMap = series.byConcentration.get(concentration);
                const availableTemps = [...tempMap.keys()].sort((a, b) => a - b);
                const bounds = findBounds(availableTemps, temperature);
                if (!bounds) return;
                const [t0, t1] = bounds;
                const d0 = tempMap.get(t0);
                const d1 = tempMap.get(t1);
                samples.push({
                    concentration,
                    density: interpolate(t0, d0, t1, d1, temperature),
                    t0,
                    t1
                });
            });
            return samples.sort((a, b) => a.concentration - b.concentration);
        }

        function solveConcentrationFromDensity(samples, density) {
            const brackets = [];
            for (let i = 0; i < samples.length - 1; i++) {
                const a = samples[i];
                const b = samples[i + 1];
                const lo = Math.min(a.density, b.density);
                const hi = Math.max(a.density, b.density);
                if (density >= lo && density <= hi) {
                    brackets.push([a, b]);
                }
            }

            const rawResults = brackets.map(([lower, upper]) => ({
                lower,
                upper,
                concentration: interpolate(lower.density, lower.concentration, upper.density, upper.concentration, density)
            }));
            const results = [];
            rawResults.forEach(result => {
                const duplicate = results.some(existing => Math.abs(existing.concentration - result.concentration) < 1e-9);
                if (!duplicate) results.push(result);
            });
            return results;
        }

        function densityRange(samples) {
            const densities = samples.map(sample => sample.density);
            return {
                min: Math.min(...densities),
                max: Math.max(...densities)
            };
        }

        function exactMatchMessage(results, density) {
            return results.some(result => Math.abs(result.lower.density - density) < 1e-10 || Math.abs(result.upper.density - density) < 1e-10);
        }

        function bracketConcentrationSet(results) {
            const set = new Set();
            results.forEach(result => {
                set.add(result.lower.concentration);
                set.add(result.upper.concentration);
            });
            return set;
        }

        function resultText(results) {
            return results.map(result => formatResult(result.concentration)).join(' / ');
        }

        function applyResultUnits(solution) {
            document.getElementById('primaryUnit').textContent = solution.category === 'alcohol' ? 'v/v' : 'w/w';
        }

        function calculate() {
            const solution = state.solutions.get(state.selectedItemId);
            const densityText = document.getElementById('densityInput').value.trim();
            const temperatureText = document.getElementById('temperatureInput').value.trim();
            const density = Number(densityText);
            const temperature = Number(temperatureText);
            const message = document.getElementById('message');
            message.className = 'message';
            message.textContent = '';
            state.currentResult = null;

            if (!solution || !densityText || !temperatureText || !Number.isFinite(density) || !Number.isFinite(temperature)) {
                setResult('--', '请输入有效的密度和温度。', '--');
                renderSamples([]);
                return;
            }

            applyResultUnits(solution);
            const series = primarySeries(solution);
            const basis = primaryBasis(solution);
            const tempMin = series.temperatures[0];
            const tempMax = series.temperatures[series.temperatures.length - 1];
            if (temperature < tempMin || temperature > tempMax) {
                setResult('--', `${solution.name}（${solution.formula}）数据温度范围为 ${tempMin} 到 ${tempMax} °C。`, '--');
                message.className = 'message bad';
                message.textContent = '当前页面不做外推，请输入表格范围内的温度。';
                renderSamples([]);
                return;
            }

            const samples = interpolateDensityAtTemperature(solution, temperature, basis);
            if (samples.length < 2) {
                setResult('--', '该温度下可用于插值的数据不足。', '--');
                renderSamples(samples);
                return;
            }

            const { min: dMin, max: dMax } = densityRange(samples);
            if (density < dMin || density > dMax) {
                setResult('--', `${temperature} °C 下，${solution.name}可计算密度范围约为 ${formatNumber(dMin, 5)} 到 ${formatNumber(dMax, 5)} kg/L。`, '--');
                message.className = 'message bad';
                message.textContent = '当前页面不做浓度外推，请输入表格范围内的密度。';
                renderSamples(samples, density);
                return;
            }

            const primaryResults = solveConcentrationFromDensity(samples, density);
            if (primaryResults.length === 0) {
                setResult('--', '没有找到可包围该密度的相邻浓度点。', '--');
                renderSamples(samples, density);
                return;
            }

            const weightSamples = basis === 'weight' ? samples : interpolateDensityAtTemperature(solution, temperature, 'weight');
            const weightResults = weightSamples.length >= 2 ? solveConcentrationFromDensity(weightSamples, density) : [];
            let molarityText = weightResults
                .map(result => formatResult(concentrationToMolarity(solution, density, result.concentration)))
                .join(' / ');

            if (!molarityText) molarityText = '--';

            setResult(
                resultText(primaryResults),
                `${solution.name}（${solution.formula}），温度 ${formatNumber(temperature, 2)} °C，密度 ${formatNumber(density, 5)} kg/L。`,
                molarityText
            );

            state.currentResult = {
                solution,
                density,
                temperature,
                weightResults,
                primaryResults
            };

            const exactMatch = exactMatchMessage(primaryResults, density);
            message.className = primaryResults.length > 1 ? 'message warn' : 'message good';
            message.textContent = primaryResults.length > 1
                ? `该密度对应 ${primaryResults.length} 个可能浓度，请结合样品实际浓度范围判断。`
                : (exactMatch
                    ? '输入密度与表格插值后的数据点完全一致。'
                    : `使用 ${primaryResults[0].lower.concentration}% 和 ${primaryResults[0].upper.concentration}% 两个相邻浓度点进行线性插值。`);
            renderSamples(samples, density, bracketConcentrationSet(primaryResults));
        }

        function setResult(primary, detail, molarity = '--') {
            document.getElementById('primaryValue').textContent = primary;
            document.getElementById('molarityValue').textContent = molarity;
            document.getElementById('resultDetail').textContent = detail;
        }

        function renderSamples(samples, density = null, bracketConcentrations = new Set()) {
            const tbody = document.getElementById('sampleBody');
            tbody.innerHTML = '';
            if (samples.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">暂无可显示数据</td></tr>';
                return;
            }

            let nearest = null;
            if (Number.isFinite(density)) {
                nearest = samples.reduce((best, sample) => {
                    if (!best) return sample;
                    return Math.abs(sample.density - density) < Math.abs(best.density - density) ? sample : best;
                }, null);
            }

            samples.forEach(sample => {
                const tr = document.createElement('tr');
                const isBracket = bracketConcentrations.has(sample.concentration);
                const isNearest = nearest && sample.concentration === nearest.concentration;
                if (isBracket) tr.classList.add('is-bracket');
                if (isNearest) tr.classList.add('is-nearest');

                const diff = Number.isFinite(density) ? sample.density - density : NaN;
                const status = isBracket ? '插值点' : (isNearest ? '最近点' : '');
                tr.innerHTML = `
                    <td>${formatNumber(sample.concentration, 3)}</td>
                    <td>${formatNumber(sample.density, 5)}</td>
                    <td>${Number.isFinite(diff) ? formatNumber(diff, 5) : '--'}</td>
                    <td>${status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function orderedCategoryIds() {
            const known = CATEGORY_ORDER.filter(id => state.categories.has(id));
            const extra = [...state.categories.keys()].filter(id => !known.includes(id)).sort();
            return [...known, ...extra];
        }

        function orderedItemsForCategory(category) {
            const preferred = ITEM_ORDER[category] || [];
            const items = [...state.solutions.values()].filter(solution => solution.category === category);
            const byId = new Map(items.map(item => [item.id, item]));
            const known = preferred.map(id => byId.get(id)).filter(Boolean);
            const extra = items.filter(item => !preferred.includes(item.id)).sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            return [...known, ...extra];
        }

        function renderCategoryOptions() {
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            orderedCategoryIds().forEach(category => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'global-btn';
                button.dataset.category = category;
                button.textContent = state.categories.get(category);
                button.addEventListener('click', () => {
                    state.selectedCategory = category;
                    const firstItem = orderedItemsForCategory(category)[0];
                    if (firstItem) state.selectedItemId = firstItem.id;
                    updateCategoryButtons();
                    renderItemOptions();
                    calculate();
                });
                container.appendChild(button);
            });
            updateCategoryButtons();
        }

        function renderItemOptions() {
            const container = document.getElementById('itemButtons');
            container.innerHTML = '';
            const items = orderedItemsForCategory(state.selectedCategory);
            if (!items.some(item => item.id === state.selectedItemId) && items[0]) {
                state.selectedItemId = items[0].id;
            }
            items.forEach(solution => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'global-btn';
                    button.dataset.itemId = solution.id;
                    button.textContent = solution.name;
                    button.addEventListener('click', () => {
                        state.selectedItemId = solution.id;
                        updateItemButtons();
                        calculate();
                    });
                    container.appendChild(button);
                });
            updateItemButtons();
        }

        function updateCategoryButtons() {
            document.querySelectorAll('#categoryButtons .global-btn').forEach(button => {
                button.classList.toggle('active', button.dataset.category === state.selectedCategory);
            });
        }

        function updateItemButtons() {
            document.querySelectorAll('#itemButtons .global-btn').forEach(button => {
                button.classList.toggle('active', button.dataset.itemId === state.selectedItemId);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetch(DATA_URL)
                .then(response => {
                    if (!response.ok) throw new Error('无法加载数据');
                    return response.text();
                })
                .then(text => {
                    buildSolutionData(parseCsv(text));
                    renderCategoryOptions();
                    renderItemOptions();
                    calculate();
                })
                .catch(error => {
                    setResult('--', error.message);
                    document.getElementById('message').className = 'message bad';
                    document.getElementById('message').textContent = '请确认 concentration.csv 与本页面位于同一目录。';
                });

            document.getElementById('densityInput').addEventListener('input', calculate);
            document.getElementById('temperatureInput').addEventListener('input', calculate);
        });
    </script>
</body>
</html>
